<style>
  /* ---------- Tokens ---------- */
  :root{
    color-scheme: light;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --page-bg: #f9f9f7;
    --surface: #ffffff;
    --surface-2: #fcfcfb;
    --surface-sunken: #f2f1ec;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);
    --gridline: #e1e0d9;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: rgba(42,120,214,0.10);

    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
    --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;
    --cat-other: #898781;

    --status-good: #0ca30c;
    --status-warning: #b8790c;
    --status-serious: #c15a34;
    --status-critical: #d03b3b;

    --shadow-1: 0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);
    --shadow-2: 0 8px 24px rgba(11,11,11,0.12), 0 2px 6px rgba(11,11,11,0.08);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page-bg: #0d0d0d;
      --surface: #171716;
      --surface-2: #1a1a19;
      --surface-sunken: #131312;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8d84;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --gridline: #2c2c2a;
      --accent: #3987e5;
      --accent-ink: #ffffff;
      --accent-wash: rgba(57,135,229,0.16);
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
      --cat-5: #d55181; --cat-6: #1a9c1a; --cat-7: #9085e9; --cat-8: #e66767;
      --cat-other: #8f8d84;
      --status-good: #17c317; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #e66767;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-2: 0 10px 28px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page-bg: #0d0d0d;
    --surface: #171716;
    --surface-2: #1a1a19;
    --surface-sunken: #131312;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8d84;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --gridline: #2c2c2a;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-wash: rgba(57,135,229,0.16);
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #1a9c1a; --cat-7: #9085e9; --cat-8: #e66767;
    --cat-other: #8f8d84;
    --status-good: #17c317; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #e66767;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-2: 0 10px 28px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    color:var(--text-primary);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom: 88px;
  }
  h1,h2,h3,.display{
    font-family:var(--font-sans);
    font-weight:600;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono, .amount{ font-family:var(--font-sans); }
  .mono, .amount, .kpi-value, .cc-amount, .cat-tile-value, .bar-row-value, .bar-axis-label, .chart-tooltip b, .chart-table td:last-child, .chart-table th:last-child, .payer-history-date{ font-variant-numeric:tabular-nums; }
  .amount{ font-variant-numeric: tabular-nums; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-wash); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .icon{ width:1.1em; height:1.1em; flex:none; display:inline-block; vertical-align:-0.18em; }

  /* ---------- Layout shell ---------- */
  #app{ min-height:100vh; }
  .shell{
    display:flex;
    max-width:1180px;
    margin:0 auto;
  }
  .sidebar{
    display:none;
    flex-direction:column;
    width:236px;
    flex:none;
    padding: 28px 16px;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    padding: 0 4px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:9px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
    flex:none; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; display:block; }
  .brand-text{ min-width:0; }
  .brand-name{ font-family:var(--font-sans); font-weight:600; font-size:1.18rem; line-height:1.15; }
  .brand-slogan{ font-size:0.68rem; color:var(--text-muted); line-height:1.25; margin-top:1px; padding-left:1px; white-space:nowrap; }
  .nav-list{ display:flex; flex-direction:column; gap:2px; list-style:none; margin:0; padding:0; }
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:var(--radius-s);
    color:var(--text-secondary); text-decoration:none; font-size:0.95rem; font-weight:500;
    cursor:pointer; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{ background:var(--surface-sunken); color:var(--text-primary); }
  .nav-item.active{ background:var(--accent-wash); color:var(--accent); }
  .sidebar-cta{
    margin-top:auto;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:var(--radius-s); padding:11px 14px;
    font-weight:600; font-size:0.92rem; cursor:pointer;
  }
  .sidebar-cta:hover{ filter:brightness(1.06); }

  main{ flex:1; min-width:0; padding: 18px 16px 40px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 2px 18px;
  }
  .topbar h1{ font-size:1.4rem; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .sync-chip{ border:none; cursor:pointer; font-family:inherit; }
  .topbar-sub{ color:var(--text-secondary); font-size:0.86rem; margin-top:2px; }

  /* Bottom nav (mobile) */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:space-around;
    background:var(--surface); border-top:1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav button{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:var(--text-muted);
    font-size:0.68rem; font-weight:600; padding:6px 2px; border-radius:10px; cursor:pointer;
    flex:1 1 0; min-width:0; /* alle Einträge teilen sich die Breite – nichts ragt mehr über den Rand */
  }
  .bottom-nav button.active{ color:var(--accent); }
  .fab{
    position:fixed; right:18px; bottom:74px; z-index:41;
    width:56px;height:56px;border-radius:50%;
    background:var(--accent); color:var(--accent-ink); border:none;
    box-shadow:var(--shadow-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .fab .icon{ width:26px; height:26px; }
  .fab:hover{ filter:brightness(1.06); }

  @media (min-width:860px){
    body{ padding-bottom:0; }
    .sidebar{ display:flex; }
    .bottom-nav, .fab{ display:none; }
    main{ padding: 30px 32px 60px; }
  }

  /* Smartphone/iPad im Hochformat: App-Rahmen mit fester Fußleiste.
     Nicht das ganze Dokument scrollt, sondern nur der Inhaltsbereich – so bleibt die
     untere Menüleiste in iOS/iPadOS-Safari zuverlässig am unteren Rand stehen. */
  @media screen and (max-width:859px){
    html, body{ height:100%; overflow:hidden; }
    body{ overflow:clip; }
    body{ padding-bottom:0; }
    #app{ height:100%; height:100dvh; min-height:0; display:flex; flex-direction:column; }
    .shell{ flex:1; min-height:0; max-width:none; margin:0; }
    main{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding-bottom:28px; }
    .bottom-nav{ position:static; flex:none; }
  }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    margin-bottom:18px;
  }
  @media (min-width:640px){ .kpi-row{ grid-template-columns:repeat(4,1fr); gap:14px; } }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:14px 16px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-1);
  }
  .kpi-label{ font-size:0.74rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .kpi-value{ font-family:var(--font-sans); font-size:1.4rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi-value small{ font-size:0.62em; color:var(--text-muted); font-weight:500; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    box-shadow:var(--shadow-1);
  }
  .card-pad{ padding:18px 18px 20px; }
  .section{ margin-bottom:20px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .section-head h2{ font-size:1.06rem; }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:0.84rem; font-weight:600; cursor:pointer; padding:2px; }

  /* Chart */
  .chart-toggle{ display:inline-flex; background:var(--surface-sunken); border-radius:999px; padding:3px; gap:2px; }
  .chart-toggle button{
    border:none; background:none; padding:6px 13px; border-radius:999px; font-size:0.8rem; font-weight:600;
    color:var(--text-secondary); cursor:pointer;
  }
  .chart-toggle button.active{ background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow-1); }
  .chart-wrap{ position:relative; }
  .bar-row-label{ font-size:0.82rem; fill:var(--text-primary); font-weight:500; }
  .bar-row-value{ font-size:0.82rem; fill:var(--text-secondary); font-family:var(--font-sans); font-variant-numeric:tabular-nums; }
  .bar-row-count{ font-size:0.72rem; fill:var(--text-muted); }
  .bar-axis-label{ font-size:0.68rem; fill:var(--text-muted); font-family:var(--font-sans); }
  .bar-hit{ cursor:pointer; }
  .bar-hit:hover + .bar-rect, .bar-rect.hovered{ filter:brightness(1.08); }
  .chart-tooltip{
    position:absolute; pointer-events:none; z-index:5;
    background:var(--text-primary); color:var(--page-bg);
    padding:8px 11px; border-radius:8px; font-size:0.78rem; line-height:1.45;
    box-shadow:var(--shadow-2); max-width:220px; transform:translate(-50%,-100%); margin-top:-10px;
    opacity:0; transition:opacity .1s;
  }
  :root[data-theme="dark"] .chart-tooltip, @media (prefers-color-scheme:dark){ }
  .chart-tooltip.show{ opacity:1; }
  .chart-tooltip b{ font-family:var(--font-sans); }
  .chart-empty{ padding:34px 10px; text-align:center; color:var(--text-muted); font-size:0.88rem; }
  .chart-table{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  .chart-table td, .chart-table th{ padding:7px 6px; border-bottom:1px solid var(--gridline); text-align:left; }
  .chart-table td:last-child, .chart-table th:last-child{ text-align:right; font-family:var(--font-sans); font-variant-numeric:tabular-nums; }

  .dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }

  .chart-display-row{ margin-bottom:14px; }
  .tile-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(158px,1fr)); gap:10px;
  }
  .cat-tile{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:12px 14px; display:flex; flex-direction:column; gap:7px; cursor:pointer; text-align:left;
  }
  .cat-tile:hover{ border-color:var(--border-strong); background:var(--surface-sunken); }
  .cat-tile-head{ display:flex; align-items:flex-start; gap:7px; }
  .cat-tile-head .dot{ margin-top:5px; }
  .cat-tile-label{ font-size:0.78rem; font-weight:600; color:var(--text-secondary); line-height:1.25; }
  .cat-tile-value{ font-family:var(--font-sans); font-size:1.2rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .cat-tile-sub{ font-size:0.74rem; color:var(--text-muted); }
  .cat-tile-count{ font-size:0.72rem; color:var(--text-muted); }
  .chart-count{ font-size:0.82rem; color:var(--text-muted); }
  .cat-tile-meter{ height:5px; border-radius:3px; background:var(--gridline); overflow:hidden; margin-top:2px; }
  .cat-tile-meter>span{ display:block; height:100%; border-radius:3px; }

  /* Deadlines */
  .deadline-row{
    display:flex; align-items:center; gap:12px; padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .deadline-row:last-child{ border-bottom:none; }
  .deadline-main{ flex:1; min-width:0; }
  .deadline-name{ font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deadline-sub{ font-size:0.78rem; color:var(--text-secondary); }
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:0.72rem; font-weight:700; white-space:nowrap;
  }
  .badge .icon{ width:12px; height:12px; }
  .badge-critical{ background:color-mix(in srgb, var(--status-critical) 16%, transparent); color:var(--status-critical); }
  .badge-warning{ background:color-mix(in srgb, var(--status-warning) 18%, transparent); color:var(--status-warning); }
  .badge-good{ background:color-mix(in srgb, var(--status-good) 16%, transparent); color:var(--status-good); }
  .badge-neutral{ background:var(--surface-sunken); color:var(--text-secondary); }

  .empty-state{

  .empty-state h3{ font-size:1.1rem; }
  .empty-state p{ color:var(--text-secondary); font-size:0.9rem; max-width:360px; margin:0; }
  .btn{

    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:var(--surface-sunken); color:var(--text-primary); }
  .btn-ghost:hover{ background:var(--border-strong); }
  .btn-danger{ background:none; color:var(--status-critical); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* Contract list */
  .toolbar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .search-box{
    flex:1; min-width:180px; display:flex; align-items:center; gap:8px;

    padding:8px 12px; color:var(--text-muted);

  }
  .contract-list{ display:flex; flex-direction:column; gap:9px; }

    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);

  }

  .cc-cat{ width:4px; align-self:stretch; border-radius:3px; flex:none; }
  .cc-body{ flex:1; min-width:0; }
  .cc-top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .cc-name{ font-weight:600; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cc-amount{ font-family:var(--font-sans); font-weight:600; font-size:0.9rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cc-meta{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; font-size:0.78rem; color:var(--text-secondary); align-items:center; }

  /* Household */
  .member-row{
    display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .member-row:last-child{ border-bottom:none; }
  .avatar{
    width:38px;height:38px;border-radius:50%; color:#fff; display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:0.85rem; flex:none; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-lg{ width:64px; height:64px; font-size:1.3rem; }
  .member-photo-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .member-photo-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .member-name{ font-weight:600; font-size:0.92rem; }
  .member-sub{ font-size:0.78rem; color:var(--text-muted); }
  .member-open{
    display:flex; align-items:center; gap:12px; flex:1; min-width:0;
    background:none; border:none; padding:0; margin:0; cursor:pointer; text-align:left; font:inherit; color:inherit;
  }
  .member-open:hover .member-name{ text-decoration:underline; color:var(--accent); }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(11,11,11,0.45); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .overlay{ align-items:center; padding:24px; } }
  .modal{
    background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    border-radius:var(--radius-l); box-shadow:var(--shadow-2);
    transform:translateY(16px); transition:transform .15s;
  }
  .overlay.show .modal{ transform:translateY(0); }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2;
  }
  .modal-head h2{ font-size:1.12rem; }
  .icon-btn{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:6px; border-radius:8px; display:flex; }
  .icon-btn:hover{ background:var(--surface-sunken); }
  .modal-body{ padding:18px; display:flex; flex-direction:column; gap:16px; }
  .modal-foot{
    display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--border);
    position:sticky; bottom:0; background:var(--surface);
  }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:0.78rem; font-weight:600; color:var(--text-secondary); }
  .field .hint{ font-size:0.73rem; color:var(--text-muted); font-weight:400; }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
    padding:10px 11px; font-size:0.92rem; color:var(--text-primary); font-family:inherit; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-with-action{ display:flex; gap:8px; align-items:stretch; }
  .field-with-action input{ flex:1; min-width:0; }
  .field-action-btn{
    flex:none; width:40px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
    color:var(--text-secondary); cursor:pointer;
  }
  .field-action-btn:hover{ background:var(--surface-sunken); color:var(--accent); border-color:var(--accent); }
  .subsection-label{ font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-top:6px; }
  .checkbox-label{
    display:flex; align-items:center; gap:9px; font-size:0.88rem; font-weight:500; color:var(--text-primary); cursor:pointer;
  }
  .checkbox-label input[type="checkbox"]{ width:17px; height:17px; accent-color:var(--accent); flex:none; cursor:pointer; }
  .radio-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-chip{
    border:1px solid var(--border-strong); background:var(--surface-2); border-radius:999px;
    padding:7px 13px; font-size:0.82rem; cursor:pointer; color:var(--text-secondary); font-weight:500;
  }
  .radio-chip.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .doc-zone{
    border:1.5px dashed var(--border-strong); border-radius:var(--radius-m); padding:16px;
    display:flex; flex-direction:column; gap:12px; background:var(--surface-2);
  }
  .doc-zone.drag-over{ border-color:var(--accent); background:var(--surface-3, var(--surface-2)); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .help-countries{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 10px; }
  @media (max-width:640px){ .help-countries{ grid-template-columns:1fr; } }
  .help-country{ border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-m); padding:12px 14px; background:var(--surface-2); }
  .help-country.at{ border-left-color:var(--cat-2); }
  .help-country h4{ margin:0 0 8px; font-size:0.95rem; }
  .help-country ul{ margin:0; padding-left:18px; }
  .help-country li{ margin:0 0 6px; }
  .doc-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .attachment-list{ display:flex; flex-direction:column; gap:8px; }
  .attachment-item{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:7px 9px;
  }
  .attachment-item img{ width:38px;height:38px;object-fit:cover;border-radius:6px; flex:none; }
  .attachment-item .attachment-name{ flex:1; min-width:0; font-size:0.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att-order{ display:flex; flex-direction:column; gap:2px; flex:none; }
  .att-move{ border:0; background:var(--surface-sunken); color:var(--text-secondary); border-radius:6px; width:30px; height:22px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .att-move:hover:not(:disabled){ color:var(--accent); }
  .att-move:disabled{ opacity:0.3; cursor:default; }
  .att-move .icon{ width:14px; height:14px; }
  .attachment-open{
    display:flex; align-items:center; gap:10px; flex:1; min-width:0; background:none; border:none; padding:0;
    text-align:left; cursor:pointer; color:var(--text-primary); font:inherit;
  }
  .attachment-open:hover .attachment-name{ text-decoration:underline; color:var(--accent); }
  .payer-history{ display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
  .payer-history-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px;
  }
  .payer-history-date{ font-family:var(--font-sans); font-size:0.76rem; color:var(--text-muted); flex:none; }
  .payer-history-who{ font-size:0.84rem; font-weight:600; text-align:right; }
  .price-row{ flex-wrap:wrap; align-items:center; }
  .price-row .price-main{ flex:1; min-width:140px; font-size:0.86rem; font-weight:600; }
  .price-row .price-main small{ display:block; font-weight:400; color:var(--text-muted); font-size:0.76rem; }
  .price-delta{ font-size:0.82rem; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .price-delta.up{ color:var(--status-warning); }
  .price-delta.down{ color:var(--status-good); }
  .price-remove{ border:0; background:transparent; color:var(--text-muted); cursor:pointer; padding:2px; display:inline-flex; }
  .price-remove:hover{ color:var(--status-critical); }
  .badge-price{ font-variant-numeric:tabular-nums; }
  .pc-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); cursor:pointer; }
  .pc-row:first-of-type{ border-top:0; }
  .pc-name{ flex:1; font-size:0.9rem; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc-sub{ font-size:0.76rem; color:var(--text-muted); font-weight:400; }
  .cv-toggle-row{ margin:-2px 0 12px; }
  .prov-letter{ font-size:0.78rem; font-weight:700; color:var(--text-muted); margin:14px 4px 6px; letter-spacing:0.04em; }
  .prov-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
  @media (max-width:640px){ .prov-list{ grid-template-columns:1fr; } }
  .prov-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 14px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:10px; min-width:0; }
  .prov-head{ display:flex; align-items:center; gap:12px; min-width:0; }
  .prov-avatar{ width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1.05rem; }
  .prov-name{ font-weight:700; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prov-sub{ font-size:0.78rem; color:var(--text-muted); }
  .prov-contact{ display:flex; flex-wrap:wrap; gap:6px; }
  .contact-chip{ display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:6px 10px; border-radius:999px; background:var(--surface-sunken); color:var(--text-primary); text-decoration:none; font-size:0.82rem; font-weight:600; }
  .contact-chip:hover{ background:var(--surface-2); color:var(--accent); }
  .contact-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .contact-chip small{ font-weight:400; color:var(--text-muted); }
  .prov-contract{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); cursor:pointer; min-width:0; }
  .prov-contract .pc-name{ flex:1; }
  .prov-contract-amt{ font-size:0.84rem; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ai-status{ display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--text-secondary); }
  .spinner{
    width:14px;height:14px;border-radius:50%; border:2px solid var(--border-strong); border-top-color:var(--accent);
    animation:spin .7s linear infinite; flex:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:1.6s; } * { scroll-behavior:auto !important; } }

  .toast-host{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
  @media (min-width:860px){ .toast-host{ bottom:26px; } }
  .toast{
    background:var(--text-primary); color:var(--page-bg); padding:10px 16px; border-radius:10px; font-size:0.85rem;
    box-shadow:var(--shadow-2); opacity:0; transform:translateY(8px); transition:all .18s; max-width:88vw;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.error{ background:var(--status-critical); color:#fff; }

  .confirm-box{ max-width:360px; }
  .confirm-box .modal-body{ padding-top:6px; }
  .confirm-box p{ color:var(--text-secondary); font-size:0.9rem; margin:0; line-height:1.5; }

  .pill-filter{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .pill-filter::-webkit-scrollbar{ display:none; }

  .swatch-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:26px;height:26px;border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:var(--text-primary); }

  .visually-hidden{ position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }

  .nav-item{ position:relative; }
  .nav-dot{ width:7px;height:7px;border-radius:50%;background:var(--status-warning); margin-left:auto; flex:none; }
  .bottom-nav button{ position:relative; }
  .bottom-nav .nav-dot{ position:absolute; top:2px; right:calc(50% - 20px); width:6px;height:6px; margin:0; }
  code{ background:var(--surface-sunken); padding:1px 5px; border-radius:4px; font-family:var(--font-mono); font-size:0.9em; }

  body.has-bg-image{
    background-image: linear-gradient(color-mix(in srgb, var(--page-bg) 84%, transparent), color-mix(in srgb, var(--page-bg) 84%, transparent)), var(--bg-photo, none);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  .bg-preview-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .bg-preview-thumb{
    width:96px; height:64px; border-radius:var(--radius-s); object-fit:cover;
    border:1px solid var(--border); flex:none;
  }

  /* Help / Wiki */
  .help-topic{ border-bottom:1px solid var(--border); padding:4px 0; }
  .help-topic:last-child{ border-bottom:none; }
  .help-topic summary{
    cursor:pointer; padding:12px 4px; font-weight:600; font-size:0.94rem; list-style:none;
    display:flex; align-items:center; gap:10px; color:var(--text-primary);
  }
  .help-topic summary::-webkit-details-marker{ display:none; }
  .help-topic summary .chev{ transition:transform .15s; flex:none; color:var(--text-muted); }
  .help-topic[open] summary .chev{ transform:rotate(90deg); }
  .help-topic-body{ padding:0 4px 16px 34px; color:var(--text-secondary); font-size:0.88rem; line-height:1.65; }
  .help-topic-body p{ margin:0 0 10px; }
  .help-topic-body p:last-child{ margin-bottom:0; }
  .help-topic-body ul, .help-topic-body ol{ margin:0 0 10px; padding-left:20px; }
  .help-topic-body strong{ color:var(--text-primary); }

  /* Print */
  #print-area{ display:none; }
  @media print{
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; position:absolute; left:0; top:0; width:100%; color:#000; background:#fff; }
    .print-header{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:16px; }
    .print-brand{ font-weight:700; font-family:var(--font-sans); font-size:1.1rem; display:flex; align-items:center; gap:6px; }
    .print-brand svg{ width:18px; height:18px; }
    .print-meta{ font-size:0.8rem; color:#444; }
    .print-title{ font-size:1.3rem; margin:0 0 4px; }
    .print-subtitle{ font-size:0.85rem; color:#333; margin:0 0 14px; }
    .print-table{ width:100%; border-collapse:collapse; font-size:0.82rem; }
    .print-table th, .print-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid #999; }

/* ======================= State ======================= */

const state = {
  view: "dashboard",
  contracts: [],

  households: [],          // [{id, name, colorIndex, createdAt}] – frei benennbare Haushalte/Standorte (z. B. "Wohnhaus A", "Praxis")

  draftPhoto: null,       // data URL of the chosen member photo for the open member modal, or null
  draftHouseholdIds: [],  // [householdId, ...] für das offene Mitglied- oder Vertrags-Modal
  dirty: false,             // unsaved changes since the last exported backup
  lastSavedAt: null,        // ISO timestamp of the last successful export
  lastLocalChangeAt: null,  // ISO timestamp of the last local change
  backgroundImage: null,     // data URL of the chosen background photo, or null (per-device, not part of the backup)
  deviceName: null,          // frei vergebener Name dieses Geräts (z. B. "Mac Büro", "iPad Rob") – per-device, nicht Teil der Sicherung
  lastSyncCheckAt: null,     // ISO: letzter Abgleich/Sicherung/Laden auf diesem Gerät – per-device, nicht Teil der Sicherung
  syncSnoozeUntil: null,     // ISO: Abgleich-Erinnerung bis dahin ausblenden – per-device
  persistError: null,        // Fehlertext, falls das lokale Speichern fehlschlägt (nicht Teil der Sicherung)
  lastImportInfo: null       // {at, fromDevice, fromExportedAt} der zuletzt auf diesem Gerät geladenen Sicherung – per-device, nicht Teil der Sicherung
};

/* ======================= Local storage & backup ======================= */

const STORAGE_KEY = "vertragsordner_v1";

function newId(){
  return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
}

/* ---- Speicherschicht: IndexedDB (große Quote, robust), Rückfall auf localStorage ----
   Zwei Datensätze im Store "kv": "data" (Verträge inkl. Anhänge, Mitglieder, Haushalte, Zeitstempel,
   Gerätename …) und "bg" (Hintergrundbild, getrennt, damit es nicht bei jeder Änderung neu geschrieben wird).
   persist() bleibt synchron aufrufbar (gebündelt, ~60 ms verzögert); Fehler werden NICHT mehr
   verschluckt, sondern als dauerhafte Warnung angezeigt. */

const IDB_NAME = "vertragsordner_db";
const IDB_STORE = "kv";
const storage = { mode: "none", db: null, timer: null, chain: Promise.resolve(), bgDirty: false };

function idbOpen(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){ reject(new Error("IndexedDB nicht verfügbar")); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = function(){ if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB konnte nicht geöffnet werden")); };
    req.onblocked = function(){ reject(new Error("IndexedDB blockiert")); };
  });
}
function idbGet(db, key){
  return new Promise(function(resolve, reject){
    const r = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    r.onsuccess = function(){ resolve(r.result); };
    r.onerror = function(){ reject(r.error); };
  });
}
function idbPutMany(db, entries){
  return new Promise(function(resolve, reject){
    const tx = db.transaction(IDB_STORE, "readwrite");
    const os = tx.objectStore(IDB_STORE);
    entries.forEach(function(e){ os.put(e.value, e.key); });
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error || new Error("Schreiben fehlgeschlagen")); };
    tx.onabort = function(){ reject(tx.error || new Error("Schreiben abgebrochen (vermutlich Speicher voll)")); };
  });
}

function dataSnapshot(){
  return {
    contracts: state.contracts,
    members: state.members,
    households: state.households,
    dirty: state.dirty,
    lastSavedAt: state.lastSavedAt,
    lastLocalChangeAt: state.lastLocalChangeAt,
    deviceName: state.deviceName,
    lastImportInfo: state.lastImportInfo,
    lastSyncCheckAt: state.lastSyncCheckAt,
    syncSnoozeUntil: state.syncSnoozeUntil
  };
}
function applyStoredData(data, bg){
  state.contracts = Array.isArray(data.contracts) ? data.contracts : [];
  state.members = Array.isArray(data.members) ? data.members : [];
  state.households = Array.isArray(data.households) ? data.households : [];
  state.dirty = !!data.dirty;
  state.lastSavedAt = data.lastSavedAt || null;
  state.lastLocalChangeAt = data.lastLocalChangeAt || null;
  state.backgroundImage = bg || data.backgroundImage || null;
  state.deviceName = data.deviceName || null;
  state.lastImportInfo = data.lastImportInfo || null;
  state.lastSyncCheckAt = data.lastSyncCheckAt || null;
  state.syncSnoozeUntil = data.syncSnoozeUntil || null;
}

function persist(){
  if (storage.timer) return;
  storage.timer = setTimeout(function(){ storage.timer = null; flushPersist(); }, 25);
}
function persistBackground(){ storage.bgDirty = true; persist(); }

function setPersistError(msg){
  const changed = state.persistError !== msg;
  state.persistError = msg;
  if (changed){
    renderPersistAlert();
    if (msg) toast("Speichern auf diesem Gerät fehlgeschlagen – bitte jetzt eine Sicherung speichern.", "error");
  }
}

function flushPersist(){
  if (storage.timer){ clearTimeout(storage.timer); storage.timer = null; }
  if (storage.mode === "none") return storage.chain;
  const snap = dataSnapshot();
  const withBg = storage.bgDirty;
  const bg = state.backgroundImage;
  storage.bgDirty = false;
  storage.chain = storage.chain.then(function(){
    if (storage.mode === "idb"){
      const entries = [{ key:"data", value:snap }];
      if (withBg) entries.push({ key:"bg", value:bg || null });
      return idbPutMany(storage.db, entries);
    }
    /* Rückfall: localStorage (inkl. Hintergrundbild in einem Datensatz) */
    snap.backgroundImage = bg;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snap));
  }).then(function(){
    setPersistError(null);
  }).catch(function(e){
    if (withBg) storage.bgDirty = true;
    setPersistError((e && (e.name || e.message)) ? String(e.name || e.message) : "unbekannter Fehler");
  });
  return storage.chain;
}

function renderPersistAlert(){
  const slot = document.getElementById("persist-alert-slot");
  if (!slot) return;
  if (!state.persistError){ slot.innerHTML = ""; return; }
  slot.innerHTML =
    '<div class="section card" role="alert" style="border-color:var(--status-critical);"><div class="card-pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">'+
      icon("warn")+
      '<div style="flex:1;min-width:200px;font-size:0.88rem;color:var(--text-secondary);"><strong style="color:var(--text-primary);">Speichern auf diesem Gerät fehlgeschlagen.</strong> Ihre letzten Änderungen sind möglicherweise nicht dauerhaft gespeichert (Speicher voll oder vom Browser gesperrt). Bitte jetzt eine Sicherung speichern.</div>'+
      '<div><button class="btn btn-primary" id="persist-alert-save" type="button">Sicherung jetzt speichern</button></div>'+
    '</div></div>';
  slot.querySelector("#persist-alert-save").addEventListener("click", exportBackup);
}

/* Beim Verlassen/Ausblenden der Seite sofort schreiben, damit nichts im 60-ms-Puffer hängen bleibt */
window.addEventListener("pagehide", function(){ flushPersist(); });
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") flushPersist(); });

/* Lädt den gespeicherten Stand; übernimmt einmalig Daten aus der früheren localStorage-Version. */
async function initStorage(){
  try{
    storage.db = await idbOpen();
    storage.mode = "idb";
  }catch(e){
    storage.mode = (function(){ try{ localStorage.getItem(STORAGE_KEY); return "ls"; }catch(_){ return "none"; } })();
    if (storage.mode === "none") setPersistError("Kein lokaler Speicher verfügbar");
  }

  if (storage.mode === "idb"){
    let data = null, bg = null;
    try{ data = await idbGet(storage.db, "data"); bg = await idbGet(storage.db, "bg"); }catch(e){ /* wie leer behandeln */ }
    if (data){
      applyStoredData(data, bg);
    } else {
      /* Erststart mit IndexedDB: ggf. Altbestand aus localStorage übernehmen */
      let legacy = null;
      try{ const raw = localStorage.getItem(STORAGE_KEY); if (raw) legacy = JSON.parse(raw); }catch(e){}
      if (legacy){
        applyStoredData(legacy, null);
        storage.bgDirty = true;
        await flushPersist();
        if (!state.persistError){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }
      }
    }
    /* Browser bitten, den Speicher dieser Seite nicht ohne Not zu räumen (best effort) */
    try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  } else if (storage.mode === "ls"){
    try{ const raw = localStorage.getItem(STORAGE_KEY); if (raw) applyStoredData(JSON.parse(raw), null); }catch(e){}
  }
}

/* Haushalte: beim allerersten Start bzw. beim Laden einer älteren Sicherung ohne
   "households" wird automatisch ein Standard-Haushalt angelegt und alle vorhandenen
   Mitglieder/Verträge diesem zugeordnet, damit nichts verloren geht oder unsichtbar wird. */
function ensureHouseholdsMigrated(){
  let changed = false;
  if (!Array.isArray(state.households)){ state.households = []; changed = true; }
  if (state.households.length===0){
    const def = { id:newId(), name:"Mein Haushalt", colorIndex:0, createdAt:new Date().toISOString() };
    state.households.push(def);
    state.members.forEach(function(m){ if (!Array.isArray(m.householdIds) || m.householdIds.length===0) m.householdIds=[def.id]; });
    state.contracts.forEach(function(c){ if (!Array.isArray(c.householdIds) || c.householdIds.length===0) c.householdIds=[def.id]; });
    changed = true;
  } else {
    const allIds = state.households.map(function(h){ return h.id; });
    state.members.forEach(function(m){ if (!Array.isArray(m.householdIds) || m.householdIds.length===0){ m.householdIds=allIds.slice(); changed=true; } });
    state.contracts.forEach(function(c){ if (!Array.isArray(c.householdIds) || c.householdIds.length===0){ c.householdIds=allIds.slice(); changed=true; } });
  }
  if (changed) persist();
  return changed;
}

function applyBackgroundImage(){
  if (state.backgroundImage){
    document.body.style.setProperty("--bg-photo", 'url("'+state.backgroundImage+'")');
    document.body.classList.add("has-bg-image");
  } else {
    document.body.classList.remove("has-bg-image");
    document.body.style.removeProperty("--bg-photo");
  }
}

function setBackgroundImage(dataUrl){
  state.backgroundImage = dataUrl;
  persistBackground();
  applyBackgroundImage();
  render();
}

function markDirty(){
  state.dirty = true;
  state.lastLocalChangeAt = new Date().toISOString();
  persist();
}

function exportBackup(){
  const payload = {
    app: "vertragsordner",
    version: 3,
    exportedAt: new Date().toISOString(),
    exportedByDevice: state.deviceName || null,
    members: state.members,
    contracts: state.contracts,
    households: state.households
  };
  let blob;
  try{
    blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  }catch(e){
    toast("Sicherung konnte nicht erstellt werden.","error");
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "vertragsordner-daten.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

  state.dirty = false;
  state.lastSavedAt = new Date().toISOString();
  state.lastSyncCheckAt = state.lastSavedAt;
  persist();
  render();
  toast("Sicherung wird heruntergeladen.");
}

function importBackupFile(file, skipConfirm){
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast("Datei konnte nicht gelesen werden – ist es eine gültige Sicherungsdatei?","error"); return; }
    if (!data || !Array.isArray(data.contracts) || !Array.isArray(data.members)){
      toast("Diese Datei sieht nicht wie eine Vertragsraum-Sicherung aus.","error");
      return;
    }
    const fromDevice = data.exportedByDevice || null;
    const fromWhen = data.exportedAt ? formatDateTime(data.exportedAt) : null;
    const provenanceHint = (fromDevice || fromWhen)
      ? " Diese Datei wurde" + (fromWhen ? " am " + fromWhen : "") + (fromDevice ? " auf „" + fromDevice + "“" : " auf einem nicht benannten Gerät") + " gesichert."
      : " Für diese Datei ist kein Gerät/Zeitpunkt hinterlegt (ältere Sicherung).";
    const confirmText = "Der aktuell angezeigte Stand wird durch " + data.contracts.length + " Vertrag/Verträge und " + data.members.length + " Person(en) aus der Datei ersetzt." + provenanceHint;
    const applyBackup = function(){
        state.contracts = data.contracts;
        state.members = data.members;
        state.households = Array.isArray(data.households) ? data.households : [];
        ensureHouseholdsMigrated(); // ältere Sicherungen ohne Haushalte bekommen automatisch einen Standard-Haushalt
        state.activeHousehold = "__all";
        state.dirty = false;
        state.lastSavedAt = data.exportedAt || new Date().toISOString();
        state.lastLocalChangeAt = state.lastSavedAt;
        state.lastImportInfo = { at: new Date().toISOString(), fromDevice: fromDevice, fromExportedAt: data.exportedAt || null };
        state.lastSyncCheckAt = new Date().toISOString();
        state.syncSnoozeUntil = null;
        persist();
        render();
        toast("Sicherung geladen.");
    };
    if (skipConfirm){ applyBackup(); return; }
    confirmDialog("Sicherung laden?", confirmText, applyBackup, "Sicherung laden", false);
  };
  reader.onerror = function(){ toast("Datei konnte nicht gelesen werden.","error"); };
  reader.readAsText(file);
}

/* Vergleicht eine ausgewählte Sicherungsdatei (ohne sie zu laden) mit dem lokalen Stand. Grundlage:
   state.lastSavedAt = Zeitpunkt der Sicherung, auf der dieser Stand beruht (eigene Sicherung oder zuletzt geladene),
   state.dirty = seitdem lokal geändert. */
function compareBackupFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast("Datei konnte nicht gelesen werden – ist es eine gültige Sicherungsdatei?","error"); return; }
    if (!data || !Array.isArray(data.contracts) || !Array.isArray(data.members)){
      toast("Diese Datei sieht nicht wie eine Vertragsraum-Sicherung aus.","error");
      return;
    }
    state.lastSyncCheckAt = new Date().toISOString();
    state.syncSnoozeUntil = null;
    persist();
    render();

    const tFile = data.exportedAt ? Date.parse(data.exportedAt) : NaN;
    const tBase = state.lastSavedAt ? Date.parse(state.lastSavedAt) : NaN;
    const who = data.exportedByDevice ? "„"+data.exportedByDevice+"“" : "einem nicht benannten Gerät";
    const fileInfo = isNaN(tFile) ? "" : "Die Datei im Ordner stammt vom "+formatDateTime(data.exportedAt)+" ("+who+").";
    const localInfo = isNaN(tBase) ? "Auf diesem Gerät wurde bisher keine Sicherung gesichert oder geladen."
                                    : "Ihr Stand beruht auf der Sicherung vom "+formatDateTime(state.lastSavedAt)+".";
    const later = { label:"Später", cls:"btn-ghost" };
    const ok = { label:"OK", cls:"btn-primary" };
    const saveNow = { label:"Jetzt sichern", cls:"btn-primary", onClick:function(){ exportBackup(); } };

    if (isNaN(tFile)){
      compareDialog("Vergleich nicht möglich", ["Diese Sicherungsdatei enthält keinen Zeitstempel (ältere Sicherung), daher lässt sich nicht beurteilen, welcher Stand neuer ist."], [ok]);
      return;
    }
    const TOL = 1500; // ms Toleranz
    const same = !isNaN(tBase) && Math.abs(tFile-tBase)<=TOL;
    const fileNewer = isNaN(tBase) || (tFile-tBase)>TOL;

    if (same && !state.dirty){
      compareDialog("Alles aktuell", ["Ihr Stand entspricht der Sicherung im Ordner.", fileInfo], [ok]);
    } else if (same && state.dirty){
      compareDialog("Ihr Stand ist neuer", ["Sie haben seit der letzten Sicherung Änderungen vorgenommen, die noch nicht im Ordner liegen.", fileInfo], [saveNow, later]);
    } else if (fileNewer && !state.dirty){
      compareDialog("Neuere Sicherung vorhanden", [fileInfo, localInfo, "Sie haben lokal nichts geändert – das Laden ist unkritisch."],
        [{ label:"Sicherung laden", cls:"btn-primary", onClick:function(){ importBackupFile(file, true); } }, later]);
    } else if (fileNewer && state.dirty){
      compareDialog("Achtung: beide Stände wurden geändert", [fileInfo, localInfo,
        "Sie haben lokal Änderungen, die noch nicht gesichert sind, und im Ordner liegt zugleich eine neuere Sicherung. Laden Sie die Sicherung, gehen Ihre lokalen Änderungen verloren; sichern Sie stattdessen, werden die Änderungen im Ordner überschrieben."],
        [{ label:"Sicherung laden …", cls:"btn-danger", onClick:function(){ importBackupFile(file, false); } }, { label:"Abbrechen", cls:"btn-ghost" }]);
    } else if (state.dirty){
      compareDialog("Ihr Stand ist neuer", [fileInfo, localInfo, "Ihre Änderungen sind jünger als die Datei im Ordner."], [saveNow, later]);
    } else {
      compareDialog("Datei im Ordner ist älter", [fileInfo, localInfo, "Vermutlich wurde Ihre letzte Sicherung noch nicht in den Ordner gelegt oder iCloud hat sie noch nicht synchronisiert."], [saveNow, ok]);
    }
  };
  reader.onerror = function(){ toast("Datei konnte nicht gelesen werden.","error"); };
  reader.readAsText(file);
}

/* Einfügen (Cmd/Strg+V) eines kopierten Bildes/PDFs, solange ein Vertrag geöffnet ist */
document.addEventListener("paste", function(e){
  const input = document.getElementById("file-input");
  if (!input || !e.clipboardData) return;
  const overlay = input.closest(".overlay");
  const files = Array.prototype.filter.call(e.clipboardData.files || [], function(f){ return f.type && (f.type.indexOf("image/")===0 || f.type==="application/pdf"); });
  if (!overlay || !files.length) return;
  e.preventDefault();
  const nd = new Date(), z2 = function(n){ return (n<10?"0":"")+n; };
  const stamp = dateToISO(nd)+"_"+z2(nd.getHours())+"-"+z2(nd.getMinutes())+"-"+z2(nd.getSeconds());
  const named = files.map(function(f, i){
    if (f.name && !/^image\.(png|jpe?g|gif)$/i.test(f.name)) return f;
    const ext = f.type==="application/pdf" ? "pdf" : "jpg";
    try{ return new File([f], "Einfügung_"+stamp+(files.length>1?"_"+(i+1):"")+"."+ext, { type:f.type }); }catch(err){ return f; }
  });
  handleFilesSelected(overlay, named);
});

/* ======================= Helpers: money & dates ======================= */

const eur = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" });
const eurNoDecimals = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR", maximumFractionDigits:0 });
function formatEUR(v){ return eur.format(v||0); }
function formatDate(s){
  if (!s) return "–";
  const d = new Date(s+"T00:00:00");
  if (isNaN(d)) return "–";
  return new Intl.DateTimeFormat("de-DE",{ day:"2-digit", month:"2-digit", year:"numeric" }).format(d);
}
function dateToISO(d){
  // lokales Datum als YYYY-MM-DD (toISOString() würde in Zeitzonen östlich von UTC einen Tag zu früh liefern)
  const m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function todayISO(){ return dateToISO(new Date()); }
function addMonthsISO(iso, delta){
  const d = new Date(iso+"T00:00:00");
  d.setMonth(d.getMonth()+delta);
  return d;
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function annualCost(c){
  const f = FREQ_BY_ID[c.frequency];
  const amt = Number(c.amount)||0;
  return f ? amt * f.perYear : 0;
}
function monthlyEquivalent(c){ return annualCost(c)/12; }

function cancelByDate(c){
  if (!c.endDate || c.noticePeriodMonths==null || c.noticePeriodMonths==="") return null;
  const months = Number(c.noticePeriodMonths);
  if (isNaN(months)) return null;
  let effectiveEnd = c.endDate;
  let cb = addMonthsISO(effectiveEnd, -months);

  if (c.autoRenew && c.renewalTermMonths!=null && c.renewalTermMonths!==""){
    const term = Number(c.renewalTermMonths);
    if (!isNaN(term) && term>0){
      const today = new Date(todayISO()+"T00:00:00");
      let guard = 0;
      while (cb < today && guard < 200){
        effectiveEnd = dateToISO(addMonthsISO(effectiveEnd, term));
        cb = addMonthsISO(effectiveEnd, -months);
        guard++;
      }
    }
  }
  cb.effectiveEndDate = effectiveEnd;
  return cb;
}

function catColor(id){ return "var("+(CATEGORY_BY_ID[id] ? CATEGORY_BY_ID[id].varName : "--cat-other")+")"; }
function memberColorVar(m){
  const idx = state.members.findIndex(function(x){ return x.id===m.id; });
  return MEMBER_COLORS[(m.colorIndex!=null?m.colorIndex:idx) % MEMBER_COLORS.length];
}
function memberById(id){ return state.members.find(function(m){ return m.id===id; }); }
function householdById(id){ return state.households.find(function(h){ return h.id===id; }); }
function householdColorVar(h){
  const idx = state.households.findIndex(function(x){ return x.id===h.id; });
  return MEMBER_COLORS[(h.colorIndex!=null?h.colorIndex:idx) % MEMBER_COLORS.length];
}
function householdsOfContract(c){
  const ids = Array.isArray(c.householdIds) ? c.householdIds : [];
  return ids.map(householdById).filter(Boolean);
}
function membersForHouseholds(ids){
  if (!ids || ids.length===0) return state.members.slice();
  return state.members.filter(function(m){
    return (m.householdIds||[]).some(function(hid){ return ids.indexOf(hid)>=0; });
  });
}
function contractInActiveHousehold(c){
  if (state.activeHousehold==="__all") return true;
  return (c.householdIds||[]).indexOf(state.activeHousehold)>=0;
}
function visibleContracts(){
  return state.contracts.filter(contractInActiveHousehold);
}
function householdChipsHTML(idPrefix, selectedIds){
  if (!state.households.length) return '<div class="hint">Noch kein Haushalt angelegt.</div>';
  return '<div class="radio-group" id="'+idPrefix+'-chips">'+
    state.households.map(function(h){
      const sel = selectedIds.indexOf(h.id)>=0;
      return '<button type="button" class="radio-chip'+(sel?' selected':'')+'" data-household-chip="'+h.id+'">'+
        '<span class="dot" style="background:var('+householdColorVar(h)+');margin-right:6px;"></span>'+escapeHtml(h.name)+
      '</button>';
    }).join("")+
  '</div>';
}
function memberBankAccounts(id){
  const m = memberById(id);
  return (m && Array.isArray(m.bankAccounts)) ? m.bankAccounts : [];
}
function bankAccountById(memberId, accountId){
  return memberBankAccounts(memberId).find(function(a){ return a.id===accountId; });
}
function bankAccountLabel(a){
  return a.iban ? (a.label||"Konto")+" · "+a.iban : (a.label||"Konto");
}
function memberInitials(name){
  const parts = String(name||"?").trim().split(/\s+/);
  return ((parts[0]||"")[0]||"?").toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase();
}
function avatarHTML(m, extraClass){
  const cls = "avatar"+(extraClass?" "+extraClass:"");
  if (m.photo){
    return '<div class="'+cls+'"><img src="'+m.photo+'" alt=""></div>';
  }
  return '<div class="'+cls+'" style="background:'+"var("+memberColorVar(m)+")"+'">'+escapeHtml(memberInitials(m.name))+'</div>';
}

/* ======================= Toasts ======================= */

function toast(msg, type){
  const host = document.getElementById("toast-host");
  const el = document.createElement("div");
  el.className = "toast" + (type==="error" ? " error" : "");
  el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("show"); });
  setTimeout(function(){
    el.classList.remove("show");
    setTimeout(function(){ el.remove(); }, 220);
  }, 3200);
}
