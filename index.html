        (state.lastImportInfo
          ? '<div class="member-sub">Zuletzt geladene Sicherung: '+escapeHtml(formatDateTime(state.lastImportInfo.fromExportedAt))+
            (state.lastImportInfo.fromDevice ? ' von „'+escapeHtml(state.lastImportInfo.fromDevice)+'“' : ' (Gerät nicht benannt)')+
            ', eingespielt am '+escapeHtml(formatDateTime(state.lastImportInfo.at))+'</div>'
          : '')+
        '<div class="member-sub">Gespeicherte Anhänge auf diesem Gerät: '+escapeHtml(attachmentStats())+'</div>'+
        (state.dirty
          ? '<span class="badge badge-warning" style="width:fit-content;margin-top:4px;">'+icon("warn")+' Ungesicherte Änderungen</span>'
          : '<span class="badge badge-good" style="width:fit-content;margin-top:4px;">'+icon("check")+' Alles gesichert</span>')+
      '</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
        '<button class="btn btn-primary" id="backup-save-btn" type="button">'+icon("upload")+' Sicherung jetzt speichern</button>'+
        '<button class="btn btn-ghost" id="backup-compare-btn" type="button">'+icon("refresh")+' Mit Sicherungsordner abgleichen</button>'+
        '<button class="btn btn-ghost" id="backup-load-btn" type="button">'+icon("folder")+' Sicherung laden …</button>'+
        '<button class="btn btn-ghost" id="backup-csv-btn" type="button" title="Alle Verträge als Tabelle (CSV) exportieren – ohne Bankkonten und Anhänge">'+icon("list")+' Verträge als CSV exportieren</button>'+
        '<input type="file" id="backup-file-input" accept="application/json,.json" class="visually-hidden">'+
      '</div>'+
    '</div></div>'+

    '<div class="card"><div class="card-pad" style="display:flex;gap:10px;align-items:flex-start;color:var(--text-secondary);font-size:0.86rem;line-height:1.6;">'+
      icon("info")+
      '<div>'+
        '<p style="margin:0 0 8px;"><strong>Vor dem Arbeiten</strong> auf „Mit Sicherungsordner abgleichen“ tippen und die Sicherungsdatei im gemeinsamen Ordner auswählen – die App sagt Ihnen dann, ob eine neuere Sicherung vorliegt oder ob Ihr Stand neuer ist. Es wird dabei nichts geladen oder verändert.</p>'+
        '<p style="margin:0 0 8px;">Diese App läuft vollständig lokal in diesem Browser – Ihre Vertragsdaten und gescannten Dokumente verlassen dieses Gerät nicht von selbst, es gibt keinen Server im Hintergrund. Für den Abgleich zwischen Ihren eigenen Geräten über iCloud:</p>'+
        '<ol style="margin:0 0 8px 18px;padding:0;">'+
          '<li>„Sicherung jetzt speichern“ anklicken – es wird die Datei <code>vertragsordner-daten.json</code> heruntergeladen.</li>'+
          '<li>Diese Datei in einen Ordner Ihres iCloud Drive legen (per Finder verschieben, oder den Download-Ordner des Browsers direkt auf diesen iCloud-Ordner stellen).</li>'+
          '<li>Auf einem anderen Gerät hierher wechseln und über „Sicherung laden …“ dieselbe Datei aus dem iCloud-Ordner öffnen.</li>'+
        '</ol>'+
        '<p style="margin:0;">Tipp: Browser-Einstellung „Vor jedem Download nach Speicherort fragen“ aktivieren – dann lässt sich beim Sichern jedes Mal derselbe iCloud-Ordner wählen und die Datei sauber überschreiben, statt dass sich mehrere Dateien „(1)“, „(2)“ … ansammeln.</p>'+
      '</div>'+
    '</div></div>';

  const deviceNameInput = document.getElementById("device-name-input");
  deviceNameInput.addEventListener("change", function(){
    state.deviceName = deviceNameInput.value.trim() || null;
    persist();
    render();
  });

  document.getElementById("backup-save-btn").addEventListener("click", exportBackup);
  document.getElementById("backup-compare-btn").addEventListener("click", startCompare);
  document.getElementById("backup-csv-btn").addEventListener("click", function(){ exportContractsCSV(state.contracts.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","de"); })); });
  const fileInput = document.getElementById("backup-file-input");
  document.getElementById("backup-load-btn").addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(){
    const file = fileInput.files[0];
    if (file) importBackupFile(file);
    fileInput.value = "";
  });

  const bgInput = document.getElementById("bg-file-input");
  bgInput.addEventListener("change", function(){
    const file = bgInput.files[0];
    if (file) handleBackgroundFileSelected(file);
    bgInput.value = "";
  });
  const bgRemoveBtn = document.getElementById("bg-remove-btn");
  if (bgRemoveBtn){
    bgRemoveBtn.addEventListener("click", function(){
      confirmDialog("Hintergrundbild entfernen", "Das aktuelle Hintergrundbild wird entfernt und die Standarddarstellung genutzt.", function(){
        setBackgroundImage(null);
        toast("Hintergrundbild entfernt.");
      }, "Entfernen", true);
    });
  }
}

/* ======================= Hilfe & FAQs ======================= */

const HELP_TOPICS = [
  { title:"Erste Schritte", body:
    '<p>Am einfachsten starten Sie unter <strong>Mitglieder</strong>: Legen Sie dort zuerst Ihren/Ihre Haushalt(e) an (z. B. „Wohnhaus A“ oder „Praxis“) und danach die Personen, die in Ihrem Haushalt Rechnungen bezahlen, und hinterlegen Sie bei Bedarf gleich deren Bankkonten. Danach erfassen Sie unter <strong>Verträge</strong> Ihren ersten Vertrag und ordnen ihm einen oder mehrere Haushalte, eine Kategorie, einen Zahler bzw. eine Zahlerin und – falls vorhanden – ein gescanntes Dokument zu.</p>'+
    '<p>Alle Zahlen auf der <strong>Übersicht</strong> (jährliche Kosten, anstehende Kündigungsfristen, Ausgabenverteilung) aktualisieren sich automatisch, sobald Verträge vorhanden sind.</p>' },

  { title:"Verträge anlegen", body:
    '<p>Über „Neuer Vertrag“ (unten rechts bzw. in der Seitenleiste) öffnet sich das Erfassungsformular. Pflichtfeld ist nur die Bezeichnung – alle anderen Angaben wie Kategorie, Anbieter, Vertragsnummer, Betrag, Zahlungsrhythmus, Laufzeiten und Notizen sind optional und können jederzeit nachgetragen werden. Wie Sie Dokumente (Vertragsurkunde, Police, Scan) anhängen, steht im nächsten Thema „Dokumente anhängen“.</p>' },

  { title:"Dokumente anhängen (Foto, Scan, Datei)", body:
    '<p>Im Vertrag finden Sie unter „Dokument“ die Schaltfläche <strong>„Foto / Scan / Datei hinzufügen“</strong>. Angehängt werden können Fotos und PDF-Dateien (maximal 20 MB je Datei). Fotos werden automatisch verkleinert, PDFs unverändert übernommen. Die Dokumente sind ausschließlich im geöffneten Vertrag sichtbar, nicht in der Vertragsliste; ein Klick auf ein Dokument öffnet es in einem neuen Tab.</p>'+
    '<p><strong>Die Möglichkeiten je Gerät:</strong></p>'+
    '<ul style="margin:0 0 8px 18px;padding:0;">'+
      '<li><strong>Alle Geräte:</strong> „Foto / Scan / Datei hinzufügen“ antippen bzw. anklicken und ein oder <em>mehrere</em> Fotos bzw. PDFs gleichzeitig auswählen.</li>'+
      '<li><strong>iPhone / iPad:</strong> Das System bietet „Fotomediathek“, „Foto aufnehmen“ und „Datei auswählen“ an; in der Fotomediathek lassen sich mehrere Fotos auf einmal markieren. Einen Scan legen Sie am einfachsten über „Datei auswählen“ an: Im Dateien-Fenster finden Sie oben rechts im Menü (…) meist den Punkt „Dokumente scannen“. Alternativ scannen Sie vorher in der Notizen- oder Dateien-App und wählen das PDF danach aus. Ob und wo dieser Punkt erscheint, bestimmt iOS – die App kann die Scan-Funktion nicht selbst erzwingen.</li>'+
      '<li><strong>Mac / PC:</strong> Dateien direkt aus dem Finder bzw. Explorer in das geöffnete Vertragsfenster ziehen (Drag &amp; Drop; das Dokumentfeld leuchtet dabei auf). Außerdem lässt sich ein kopiertes Bild, z. B. ein Screenshot, mit Cmd/Strg+V einfügen, solange der Vertrag geöffnet ist.</li>'+
    '</ul>'+
    '<p><strong>Reihenfolge ändern:</strong> Sind mehrere Dokumente angehängt, stehen links neben jedem zwei kleine Pfeile („nach oben“ / „nach unten“). Damit bringen Sie die Dokumente in die gewünschte Reihenfolge, ohne sie löschen und neu hochladen zu müssen; die Reihenfolge wird mit „Speichern“ übernommen. Bewusst sind es Pfeile statt Ziehen mit dem Finger oder der Maus, weil sie auf iPhone, iPad und Mac gleich zuverlässig funktionieren.</p>'+
    '<p>Nicht passende Dateien (z. B. Textdateien, zu große oder nicht lesbare Dateien) werden übersprungen, die App meldet das kurz; die übrigen Dateien werden trotzdem angehängt.</p>'+
    '<p><strong>Empfohlener Ablauf für Scans:</strong> Legen Sie in iCloud Drive einen Ordner „Vertragsscans“ an. Ein Kombigerät oder Drucker mit „Scan an Ordner“ bzw. „Scan an E-Mail“ legt seine Scans dort oder in Ihrem Postfach ab; auf iPhone/iPad scannen Sie mit der Dateien-App („…“ → „Dokumente scannen“) direkt in diesen Ordner, am Mac mit „Digitale Bilder“. Anschließend wählen Sie die Datei im Vertrag aus oder ziehen sie hinein. Die App selbst kann nicht auf Drucker oder Scanner im Netzwerk zugreifen – sie läuft im Browser und hat dafür keine Berechtigung.</p>'+
    '<p><strong>Speicherbedarf:</strong> Ein gescanntes PDF hat schnell 1 bis 5 MB. Alle Anhänge sind auch in der Sicherungsdatei enthalten; wie viele es sind und wie groß sie zusammen etwa sind, zeigt der Bereich „Sicherung“.</p>' },

  { title:"Zahler:in & Bankkonten", body:
    '<p>Jedem Vertrag kann eine Person aus dem Haushalt als Zahler:in zugeordnet werden. Sobald eine Person ausgewählt ist, erscheint darunter das Feld „Zahlungsquelle“ mit den für diese Person hinterlegten Bankkonten – sind noch keine vorhanden, lässt sich direkt aus dem Vertragsformular heraus eines anlegen.</p>'+
    '<p>Bankkonten verwalten Sie dauerhaft über „Mitglieder“ → Person bearbeiten. Die gewählte Zahlungsquelle wird auf der Vertragskarte als zusätzliche Information angezeigt.</p>' },

  { title:"Verlauf bei Zahler-Wechsel", body:
    '<p>Ändern Sie bei einem bestehenden Vertrag die Zahler:in oder das Bankkonto, merkt sich die App diesen Wechsel automatisch mit Datum. Im Vertragsformular erscheint dafür unterhalb der Zahlungsquelle ein Verlauf mit allen bisherigen Wechseln – praktisch, um später nachzuvollziehen, wer wann für einen Vertrag aufgekommen ist.</p>' },

  { title:"Kündigungsfristen & automatische Verlängerung", body:
    '<p>Tragen Sie Vertragsende und Kündigungsfrist (in Monaten vor Vertragsende) ein, berechnet die App automatisch das späteste Kündigungsdatum und zeigt es unter „Anstehende Fristen &amp; Termine“ auf der Übersicht an, sobald es innerhalb der nächsten 90 Tage liegt. (Seit Oktober 2026 wird dieses Datum korrekt angezeigt – zuvor war es in manchen Zeitzonen, auch in Deutschland, einen Tag zu früh.)</p>'+
    '<p>Verlängert sich ein Vertrag automatisch, wenn nicht rechtzeitig gekündigt wird, aktivieren Sie „Verlängert sich automatisch“ und geben an, um wie viele Monate sich die Laufzeit jeweils verlängert. Ist die ursprüngliche Frist bereits verstrichen, rechnet die App selbstständig die nächste tatsächliche Kündigungsfrist hoch, statt die Frist fälschlich als überfällig anzuzeigen – erkennbar am kleinen Aktualisieren-Symbol neben dem Datum.</p>'+
    '<p><strong>Sonderkündigungsrecht:</strong> Im Vertrag gibt es dazu ein reines Hinweisfeld (z. B. „Nein“, „Ja – bei Beitragserhöhung“ oder „Ja – Details im Vertrag“). Das Feld wird nicht berechnet und löst keine Erinnerung aus; es dient nur dazu, den Hinweis bei Bedarf schnell zu finden. Es erscheint im Einzelausdruck und in der CSV-Tabelle. Maßgeblich sind immer die Vertragsbedingungen und gesetzlichen Regelungen.</p>' },

  { title:"Preisänderungen & Preisverlauf", body:
    '<p>Ändert ein Anbieter den Beitrag (Beitragsanpassung, Hoch- oder Rückstufung, Tarifwechsel), tragen Sie einfach den neuen Betrag im Vertrag ein und speichern. Die App erkennt die Änderung und fragt kurz nach, bevor der alte Wert überschrieben wird:</p>'+
    '<ul style="margin:0 0 8px 18px;padding:0;">'+
      '<li><strong>Neuer Beitrag gültig ab:</strong> Datum, ab dem der neue Beitrag gilt (Vorgabe: heute).</li>'+
      '<li><strong>Grund (optional):</strong> ein paar Worte, z. B. „Hochstufung SF 5“.</li>'+
      '<li><strong>Nur Korrektur:</strong> Haken setzen, wenn es sich um einen Tippfehler handelt – dann wird nichts als Preisänderung gemerkt, der letzte Eintrag wird lediglich korrigiert.</li>'+
    '</ul>'+
    '<p><strong>Wo Sie die Änderung sehen:</strong></p>'+
    '<ul style="margin:0 0 8px 18px;padding:0;">'+
      '<li><strong>Vertragsliste:</strong> Bei Verträgen mit einer Preisänderung in den letzten 12 Monaten erscheint ein Abzeichen, z. B. „↑ +86,00 € / Jahr (+8,9 %)“ (orange bei Erhöhung, grün bei Senkung). Fahren Sie mit der Maus darüber bzw. halten Sie es gedrückt, sehen Sie den Vorher-/Nachher-Wert.</li>'+
      '<li><strong>Im Vertrag:</strong> Der Abschnitt „Preisverlauf“ unter Betrag und Rhythmus listet alle Beiträge mit Datum, Veränderung in Euro und Prozent sowie dem Grund; der neueste steht oben. Mit dem kleinen „x“ lässt sich ein fälschlich erfasster Eintrag entfernen (wirksam mit „Speichern“).</li>'+
      '<li><strong>Übersicht:</strong> Die Karte „Preisänderungen der letzten 12 Monate“ zeigt die Auswirkung auf Ihre Jahreskosten (Summe in Euro und Prozent, auch pro Monat) und darunter die Verträge mit der größten Veränderung; ein Klick öffnet den Vertrag. Gibt es keine Änderungen, erscheint die Karte nicht. Die Jahres- und Monatssummen darüber zeigen weiterhin den aktuellen Stand.</li>'+
    '</ul>'+
    '<p><strong>Gut zu wissen:</strong> Verglichen wird immer auf Jahresbasis. Wechselt der Rhythmus (z. B. von monatlich auf jährlich), sind die Änderungen dadurch vergleichbar. Bei bereits vorhandenen Verträgen beginnt der Verlauf mit der ersten Änderung: Der bisherige Beitrag wird dann als „Bisher“ gespeichert, sein genaues Datum kennt die App nicht. Der Preisverlauf ist Teil der Sicherungsdatei. Es gibt bewusst keine Diagramme und Prognosen – die App zeigt, was sich geändert hat, und bleibt eine schlanke Vertragsübersicht.</p>' },

  { title:"Vorzeitig gekündigt: Vorauszahlung & Rückerstattung", body:
    '<p><strong>Beispiel:</strong> Sie haben eine Leistung für ein ganzes Jahr im Voraus bezahlt, kündigen während der Laufzeit und erhalten für den nicht genutzten Teil Geld zurück.</p>'+
    '<p><strong>Was die App kann:</strong> Sie zeigt laufende Verträge und deren künftige Kosten, aber sie führt keine Zahlungsliste. Weder Vorauszahlungen noch Rückerstattungen werden als Beträge verbucht, und es gibt keine Auswertung „tatsächlich gezahlt“. Stellen Sie den Vertrag auf „Gekündigt“, rechnet die App ihn aus „Ausgaben im Überblick“ sowie den Jahres- und Monatssummen heraus – genau das ist hier richtig, weil künftig nichts mehr anfällt. Der Vertrag bleibt mit Dokumenten und Notizen in der Liste erhalten.</p>'+
    '<p><strong>Empfohlene Vorgehensweise:</strong></p>'+
    '<ol style="margin:0 0 8px 18px;padding:0;">'+
      '<li>Den Vertrag öffnen und den <strong>Status auf „Gekündigt“</strong> setzen (nach dem tatsächlichen Ende später auf „Ausgelaufen“).</li>'+
      '<li>Bei <strong>Vertragsende</strong> das tatsächliche Datum eintragen, zu dem der Vertrag endet.</li>'+
      '<li>In den <strong>Notizen</strong> den Vorgang festhalten, z. B.: „Vorauszahlung 600 € für 2026; gekündigt zum 30.09.; Rückerstattung 150 € am 12.11. erhalten.“</li>'+
      '<li>Kündigungsschreiben, Bestätigung und ggf. die Abrechnung der Rückerstattung als <strong>Dokument anhängen</strong> (siehe „Dokumente anhängen“).</li>'+
    '</ol>'+
    '<p>Das genügt für den Überblick und als Nachweis. Eine eigene Verbuchung von Zahlungen und Erstattungen ist bewusst nicht vorgesehen, damit die App eine schlanke Vertragsübersicht bleibt und keine Buchführung wird.</p>' },

  { title:"Kündigungsschreiben (Musterbriefe)", body:
    '<p>Die App erstellt keine Kündigungsschreiben selbst und gibt auch keine Daten an Webseiten weiter. Kostenlose Musterbriefe bieten die Verbraucherschutz-Einrichtungen an. Die Links unten führen auf deren Übersichtsseiten; die Briefe laden Sie dort als Datei (Word/PDF) herunter und füllen sie lokal auf Ihrem Gerät aus – Ihre Angaben müssen Sie nirgends im Internet eintippen. Mit dem Antippen eines Links verlassen Sie die App.</p>'+
    '<div class="help-countries">'+
      '<div class="help-country de"><h4>Deutschland – Verbraucherzentrale</h4><ul>'+
        '<li><a href="https://www.verbraucherzentrale.de/musterbriefe" target="_blank" rel="noopener noreferrer">Alle Musterbriefe (Übersicht)</a></li>'+
        '<li><a href="https://www.verbraucherzentrale.de/musterbriefe/vertraege-reklamation" target="_blank" rel="noopener noreferrer">Verträge &amp; Reklamation (allgemeine Kündigung, Abos, Mitgliedschaften)</a></li>'+
        '<li><a href="https://www.verbraucherzentrale.de/musterbriefe/geld-versicherungen" target="_blank" rel="noopener noreferrer">Geld &amp; Versicherungen</a></li>'+
        '<li><a href="https://www.verbraucherzentrale.de/musterbriefe/digitale-welt" target="_blank" rel="noopener noreferrer">Digitale Welt (Handy, Internet, Online-Dienste)</a></li>'+
        '<li><a href="https://www.verbraucherzentrale.de/musterbriefe/energie" target="_blank" rel="noopener noreferrer">Energie (Strom, Gas)</a></li>'+
      '</ul></div>'+
      '<div class="help-country at"><h4>Österreich – Arbeiterkammer</h4><ul>'+
        '<li><a href="https://www.arbeiterkammer.at/musterbriefe" target="_blank" rel="noopener noreferrer">Musterbriefe-Datenbank (Übersicht)</a></li>'+
        '<li><a href="https://arbeiterkammer.at/mb_konsumentenschutz" target="_blank" rel="noopener noreferrer">Konsumentenschutz (u. a. Versicherungen, Haushalts- und KFZ-Versicherung, Mietvertrag)</a></li>'+
      '</ul></div>'+
    '</div>'+
    '<p><strong>Das brauchen Sie aus der App:</strong> Bezeichnung und Anbieter, Vertrags- bzw. Versicherungsnummer, das späteste Kündigungsdatum („Kündigen bis“) und – falls hinterlegt – den Kontakt beim Anbieter bzw. das Kundenportal. Wenn der Anbieter eine Kündigung direkt im Kundenportal oder per Formular auf seiner Webseite anbietet, genügt oft dieser Weg.</p>'+
    '<p><strong>Tipps:</strong> Kündigen Sie schriftlich und so, dass Sie den Zugang belegen können (z. B. Einschreiben oder die Bestätigung des Portals). Hängen Sie Schreiben und Bestätigung als Dokument an den Vertrag und stellen Sie danach den Status auf „Gekündigt“ (siehe „Vorzeitig gekündigt“).</p>'+
    '<p><em>Hinweis:</em> Die Musterbriefe sind Vorlagen und keine Rechtsberatung; Fristen und Formvorschriften unterscheiden sich je nach Land und Vertragsart. Die Webseiten Dritter können sich ändern – führt ein Link ins Leere, suchen Sie auf der jeweiligen Startseite nach „Musterbriefe“.</p>' },

  { title:"Serviceverträge & Prüfintervalle (z. B. Heizungswartung)", body:
    '<p>Für Leistungen, die erst bei Durchführung bezahlt werden (Feuerlöscherprüfung, Heizungswartung, Schornsteinfeger …), tragen Sie als Betrag die Kosten pro Termin ein und wählen als „Zahlungsrhythmus / Intervall“ den Abstand zwischen zwei Terminen – auch „alle 2 Jahre“, „alle 3 Jahre“ oder „alle 5 Jahre“ stehen zur Wahl. Die Übersicht rechnet das automatisch auf Jahres- und Monatskosten um (z. B. 120 € alle 2 Jahre = 60 € pro Jahr).</p>'+
    '<p>Im Feld „Nächster Termin“ halten Sie fest, wann die Leistung wieder fällig ist. Dieses Datum erscheint auf der Vertragskarte und unter „Anstehende Fristen &amp; Termine“ auf der Übersicht, sobald es weniger als 90 Tage entfernt ist. Nach dem Termin tragen Sie einfach das nächste Datum ein. Eine eigene Kategorie gibt es dafür nicht – passend ist meist „Wohnen &amp; Hausrat“ oder „Sonstige“.</p>' },

  { title:"Kontakte beim Anbieter & Ansicht „Nach Anbieter“", body:
    '<p><strong>Im Vertrag</strong> pflegen Sie den Abschnitt „Kontakt beim Anbieter“: Ansprechpartner, zwei Rufnummern („Service / Kündigung“ und „Schaden / Hotline“) E-Mail-Adresse und – für die Schadenmeldung – eine Website („Schadenmeldung online“). Zusätzlich lässt sich beim Feld „URL / Login zum Vertragspartner“ die Adresse des Kundenportals hinterlegen. Die kleinen Symbole neben den Feldern öffnen die Adresse im Browser, starten einen Anruf bzw. eine E-Mail. (Ältere Einträge behalten ihre Angaben; die bisherige Rufnummer steht jetzt unter „Service / Kündigung“.)</p>'+
    '<p><strong>Kontakte nachschlagen:</strong> In der Ansicht „Verträge“ schaltet der Umschalter <em>Liste | Nach Anbieter</em> die Darstellung um. „Nach Anbieter“ zeigt eine Karte pro Anbieter, alphabetisch mit Anfangsbuchstaben – ähnlich einem Adressbuch: oben Name, Anzahl der Verträge und Jahreskosten, darunter Rufnummern, E-Mail, Schadenmeldung und Portal als antippbare Schaltflächen (Anruf, E-Mail, Webseite) und darunter die zugehörigen Verträge. Ein Antippen eines Vertrags öffnet ihn.</p>'+
    '<p><strong>Gut zu wissen:</strong> Es gibt kein zweites Kontaktverzeichnis, das Sie pflegen müssten – die Kartenansicht fasst die Angaben aus allen Verträgen eines Anbieters automatisch zusammen (gleiche Nummern und Adressen nur einmal; Groß-/Kleinschreibung beim Anbieternamen ist egal). Geändert wird immer im Vertrag. Verträge ohne Anbieter stehen unter „Ohne Anbieter“. Die Suche berücksichtigt in beiden Ansichten auch Ansprechpartner, Rufnummern und E-Mail; Kategorie- und Statusfilter gelten ebenfalls. Die Ansicht wird nicht gespeichert: Nach dem Neuladen steht wieder „Liste“.</p>' },

  { title:"Ausgaben im Überblick", body:
    '<p>Der Diagrammbereich auf der Übersicht lässt sich zwischen drei Auswertungen umschalten: „Nach Kategorie“, „Nach Zahler:in“ und „Nach Anbieter“ – jeweils wahlweise als Kacheln, Balkendiagramm oder Tabelle. Bei vielen Anbietern werden automatisch nur die zehn größten einzeln aufgeführt, der Rest wird unter „Weitere“ zusammengefasst.</p>'+
    '<p>Ein Klick auf eine Kachel oder einen Balken springt direkt zur passend gefilterten Vertragsliste; ein kleiner Chip oberhalb der Liste zeigt den aktiven Filter an und lässt sich mit einem Klick wieder entfernen.</p>'+
    '<p>Im Balkendiagramm werden sehr lange Bezeichnungen (z. B. Kategorien oder Anbieter) mit „…“ gekürzt, damit sie den Balken nicht überdecken. Der vollständige Name erscheint, sobald Sie mit der Maus über die Zeile fahren; in der Kachel- und Tabellenansicht wird immer der volle Name gezeigt.</p>' },

  { title:"Haushaltsmitglieder & Fotos", body:
    '<p>Unter „Mitglieder“ legen Sie Personen an, denen Sie Verträge und Bankkonten zuordnen können. Optional lässt sich pro Person ein Foto hinterlegen, das anstelle der farbigen Initialen angezeigt wird – praktisch zur schnelleren Unterscheidung bei mehreren Personen.</p>'+
    '<p>Ein Klick auf eine Person in der Liste springt direkt zu den ihr zugeordneten Verträgen.</p>' },

  { title:"Mehrere Haushalte (z. B. Wohnhaus A, Praxis)", body:
    '<p>Unter „Mitglieder“ lassen sich beliebig viele Haushalte anlegen und frei benennen – z. B. „Wohnhaus A“, „Wohnhaus B“ oder „Praxis“. Jede Person kann mehreren Haushalten gleichzeitig angehören, und auch ein Vertrag kann mehreren Haushalten zugeordnet werden (etwa ein gemeinsam genutzter Vertrag).</p>'+
    '<p>Sobald mehr als ein Haushalt angelegt ist, erscheint oben rechts auf „Übersicht“ und „Verträge“ eine Auswahl zum Umschalten. „Alle Haushalte“ zeigt dabei die zusammengefasste Gesamtübersicht über alle Haushalte hinweg (jährliche und monatliche Kosten, Diagramme, Kündigungsfristen); die Auswahl eines einzelnen Haushalts blendet alles auf dessen Verträge ein.</p>'+
    '<p><strong>Vertrag einem anderen Haushalt zuordnen:</strong> Ein eigener „Verschieben“-Button ist dafür nicht nötig – öffnen Sie den Vertrag einfach erneut und wählen Sie bei den Haushalts-Chips den bisherigen Haushalt ab und den gewünschten neuen an. Das funktioniert jederzeit über das normale Bearbeiten, auch für mehrere zugeordnete Haushalte gleichzeitig. Ebenso lässt sich bei jeder Person unter „Mitglieder“ über die gleichen Chips festlegen, welchen Haushalten sie angehört.</p>' },

  { title:"Sicherung & iCloud-Abgleich", body:
    '<p>Die App läuft vollständig lokal auf diesem Gerät, es gibt keinen Server und keine automatische Internetübertragung Ihrer Daten. Damit Ihre Angaben auch auf anderen eigenen Geräten verfügbar sind, speichern Sie regelmäßig eine Sicherungsdatei und legen diese in einem gemeinsamen iCloud-Drive-Ordner ab – die genaue Schritt-für-Schritt-Anleitung finden Sie im Bereich „Sicherung“.</p>'+
    '<p><strong>Mehrere Geräte im Einsatz (z. B. Mac, zwei iPads):</strong> Da es keine automatische Synchronisierung gibt, lohnt es sich, im Bereich „Sicherung“ jedem Gerät einen eigenen Namen zu geben (z. B. „Mac Büro“, „iPad Rob“). Dieser Name wird zusammen mit Datum und Uhrzeit in jede Sicherungsdatei geschrieben. Beim Laden einer Sicherung zeigt die App dann an, von welchem Gerät und von wann die Datei stammt – so lässt sich leicht erkennen, ob es die aktuellste ist, bevor der vorhandene Stand überschrieben wird. Im Bereich „Sicherung“ steht außerdem, wann auf diesem Gerät zuletzt gesichert bzw. zuletzt eine Sicherung geladen wurde, und ob es ungesicherte Änderungen gibt.</p>' },

  { title:"Stand abgleichen (mehrere Geräte)", body:
    '<p>Werden die Daten auf mehreren Geräten gepflegt (z. B. Mac und zwei iPads) und über einen gemeinsamen iCloud-Ordner ausgetauscht, hilft der Abgleich, nichts zu überschreiben. Im Bereich „Sicherung“ tippen Sie auf „Mit Sicherungsordner abgleichen“ und wählen die Sicherungsdatei im gemeinsamen Ordner aus. Die App liest nur Datum und Gerätename der Datei und vergleicht sie mit Ihrem Stand – <strong>es wird nichts geladen oder verändert</strong>, bevor Sie es bestätigen.</p>'+
    '<p>Mögliche Ergebnisse: „Alles aktuell“; „Neuere Sicherung vorhanden“ (Sie haben nichts geändert, Laden ist unkritisch); „Ihr Stand ist neuer“ (bitte sichern, damit die anderen Geräte Ihre Änderungen bekommen); „Achtung: beide Stände wurden geändert“ (Laden überschreibt Ihre lokalen Änderungen, Sichern überschreibt die Änderungen im Ordner – bitte bewusst entscheiden, ein automatisches Zusammenführen gibt es nicht).</p>'+
    '<p>Oben neben der Überschrift zeigt eine kleine Anzeige jederzeit „Gesichert“ oder „Ungesichert“; ein Tipp darauf öffnet den Bereich „Sicherung“. Ist der letzte Abgleich länger als 12 Stunden her, erscheint beim Öffnen eine Erinnerung „Stand abgleichen?“, die sich mit „Später“ für 12 Stunden ausblenden lässt. Wichtig: Die App kann den Ordner nicht selbst einsehen (Safari erlaubt das nicht) – deshalb müssen Sie die Datei einmal auswählen. Verglichen werden die Uhrzeiten der beteiligten Geräte, die um wenige Sekunden abweichen können.</p>' },

  { title:"Hintergrundbild", body:
    '<p>Im Bereich „Sicherung“ lässt sich ein eigenes Foto als Hintergrund wählen. Dieses Hintergrundbild ist bewusst geräteabhängig und wird nicht Teil der Sicherungsdatei – auf jedem Gerät kann also ein anderes Bild hinterlegt sein, ohne dass sich die Dateigröße der eigentlichen Vertragsdaten dadurch unnötig vergrößert.</p>' },

  { title:"Auf dem iPad/iPhone als App nutzen", body:
    '<p>Am zuverlässigsten funktioniert die App, wenn sie über eine normale Internetadresse (https://…) bereitgestellt wird, z. B. als kostenlose Seite über GitHub Pages. Öffnen Sie diese Adresse einmal in Safari und tippen Sie auf Teilen → „Zum Home-Bildschirm“. Es erscheint ein eigenes Icon „Vertragsraum“, über das sich die App künftig wie eine eigenständige App öffnen lässt – ganz ohne Safari-Adressleiste. Auf dem Mac geht das entsprechend über Teilen → „Zum Dock hinzufügen“.</p>'+
    '<p>Wichtig: Auf der Internetseite liegt nur die App selbst, <strong>keine Ihrer Daten</strong>. Ihre Verträge werden weiterhin ausschließlich im Speicher des jeweiligen Geräts gehalten und über die Sicherungsdatei zwischen Ihren Geräten abgeglichen (siehe „Sicherung &amp; iCloud-Abgleich“). Eine neue App-Version erscheint erst, wenn die Datei auf der Internetseite ersetzt wurde.</p>'+
    '<p><strong>Name oder Icon haben sich geändert?</strong> Die App hieß früher „Vertragsordner“ und heißt jetzt „Vertragsraum“ (Slogan: „Verträge einfach im Blick“). Ein bereits angelegtes Symbol auf dem Home-Bildschirm bzw. im Dock behält Namen und Bild von damals – iOS und macOS übernehmen Änderungen nicht automatisch. <strong>Bevor Sie es entfernen, unbedingt im Bereich „Sicherung“ eine Sicherung speichern</strong>, denn ein Home-Bildschirm-Symbol (bzw. eine Dock-App) hat unter Umständen einen eigenen Datenspeicher. Danach das alte Symbol entfernen, die Internetadresse in Safari neu öffnen, erneut „Zum Home-Bildschirm“ bzw. „Zum Dock hinzufügen“ wählen und die Sicherung über „Sicherung laden …“ einspielen. In Safari selbst ändern sich Name und Icon sofort mit der neuen Version. Die Dateinamen der Sicherung (<code>vertragsordner-daten.json</code>) bleiben aus technischen Gründen unverändert, damit der Abgleich mit Ihren bestehenden Sicherungen weiter funktioniert.</p>'+
    '<p>Eine lokale Datei direkt über „Öffnen in Safari“ oder „Zum Home-Bildschirm“ zu starten, ist dagegen unzuverlässig, weil iOS das für lokale Dateien nur eingeschränkt zulässt.</p>' },

  { title:"Tabelle exportieren (CSV für Excel/Numbers)", body:
    '<p>In der Vertragsliste exportiert die Schaltfläche „CSV“ die aktuell angezeigten (gefilterten) Verträge als Tabelle, im Bereich „Sicherung“ gibt es „Verträge als CSV exportieren“ für alle Verträge. Die Datei <code>vertragsordner-vertraege-JJJJ-MM-TT.csv</code> lässt sich in Excel, Numbers oder Google Tabellen öffnen – z. B. für eigene Auswertungen oder zum Weitergeben an Steuerberatung bzw. Versicherungsmakler.</p>'+
    '<p>Enthalten sind Bezeichnung, Haushalt(e), Kategorie, Anbieter, Vertragsnummer, Status, Zahler:in, Betrag, Rhythmus, Jahreskosten, monatlicher Durchschnitt, Vertragsbeginn und -ende, Kündigungsfrist, nächste Kündigungsfrist, nächster Termin, automatische Verlängerung und Notizen. <strong>Nicht enthalten</strong> sind Bankkonten/IBANs, Zugangsdaten und Anhänge.</p>'+
    '<p>Es gibt bewusst nur einen Export und keinen Import: Die Tabelle ist ein Auswertungs-Werkzeug. Die Sicherungsdatei (JSON) bleibt der einzige Weg, Ihre vollständigen Daten zu sichern und auf ein anderes Gerät zu übertragen.</p>'+
    '<p>Technisch: Trennzeichen Semikolon, Zeichensatz UTF-8 (Umlaute stimmen), Beträge mit Dezimalkomma, Datum als TT.MM.JJJJ. Falls Excel die Spalten nicht trennt, die Datei per „Daten → Aus Text/CSV“ öffnen.</p>' },

  { title:"Speicher auf dem Gerät & Anhänge", body:
    '<p>Ihre Daten – inklusive gescannter Dokumente – liegen im lokalen Speicher des Browsers (IndexedDB). Der bietet deutlich mehr Platz als der frühere Speicher und kommt auch mit vielen PDF-Scans zurecht. Beim ersten Start nach dem Update werden vorhandene Daten automatisch übernommen. Im Bereich „Sicherung“ sehen Sie, wie viele Anhänge gespeichert sind und wie groß sie zusammen etwa sind – ungefähr so groß wird auch die Sicherungsdatei.</p>'+
    '<p><strong>Warnung bei Speicherproblemen:</strong> Kann die App einmal nicht speichern (z. B. Speicher voll oder Browser gesperrt), erscheint oben ein roter Hinweis mit der Schaltfläche „Sicherung jetzt speichern“. Bitte dann sofort eine Sicherung anlegen.</p>'+
    '<p><strong>Wichtig:</strong> Der Browser-Speicher ist kein Archiv. Safari kann die Daten einer Webseite löschen, wenn sie sehr lange nicht geöffnet wurde, und beim Löschen von Websitedaten gehen sie ebenfalls verloren. Die regelmäßige Sicherungsdatei im iCloud-Ordner bleibt deshalb Ihre eigentliche Absicherung.</p>' },

  { title:"Drucken", body:
    '<p>In der gefilterten Vertragsliste erzeugt die Schaltfläche „Drucken“ oberhalb der Liste eine saubere, druckfreundliche Übersichtstabelle genau der aktuell angezeigten Verträge – inklusive der gewählten Filter.</p>'+
    '<p>Im Bearbeitungsfenster eines einzelnen Vertrags druckt das Drucker-Symbol neben dem Schließen-Button ein übersichtliches Einzelblatt mit allen Angaben zu diesem Vertrag, z. B. für Unterlagen oder zur Weitergabe.</p>' },

  { title:"Schrift & Darstellung", body:
    '<p>Die App verwendet die Systemschrift Ihres Geräts: auf Mac, iPad und iPhone ist das Apples „SF Pro“, für Beträge in gleich breiten Ziffern, damit Zahlen in Spalten sauber untereinander stehen. Auf anderen Geräten (z. B. Windows) erscheint stattdessen deren Systemschrift. Da keine Schriftdateien geladen werden, startet die App schneller und braucht keine Internetverbindung.</p>'+
    '<p>Die Darstellung passt sich automatisch an die Bildschirmbreite an: Ab etwa 860 Pixel Breite erscheint die Navigation als Seitenleiste, darunter (z. B. iPad oder iPhone im Hochformat) als Leiste am unteren Rand. Diese Leiste bleibt beim Scrollen fest unten stehen; nur der Inhalt darüber bewegt sich. Überschriften und der Name „Vertragsraum“ erscheinen ebenfalls in der Systemschrift.</p>' },

  { title:"Neuerungen (Stand Oktober 2026)", body:
    '<ul style="margin:0 0 8px 18px;padding:0;">'+
      '<li><strong>Mehrere Haushalte:</strong> frei benennbare Haushalte, Personen und Verträge können mehreren Haushalten zugeordnet werden; „Alle Haushalte“ zeigt die Gesamtübersicht. Der Bereich „Haushalt“ heißt jetzt „Mitglieder“.</li>'+
      '<li><strong>Sicherung mit Gerätename:</strong> jedes Gerät erhält einen Namen, der samt Datum in die Sicherungsdatei geschrieben wird. Beim Laden zeigt die App, von welchem Gerät und wann die Datei stammt.</li>'+
      '<li><strong>Abgleich mit dem Sicherungsordner:</strong> Prüft per Dateiauswahl, ob eine neuere Sicherung vorliegt oder Ihr Stand neuer ist; dazu eine Statusanzeige „Gesichert/Ungesichert“ und eine Erinnerung beim Öffnen.</li>'+
      '<li><strong>Serviceverträge:</strong> neue Intervalle „alle 2 / 3 / 5 Jahre“ und das Feld „Nächster Termin“; Termine erscheinen unter „Anstehende Fristen &amp; Termine“. Der Betrag wird auf der Karte jetzt als „/ Monat“, „/ Quartal“, „/ Halbjahr“, „/ Jahr“ bzw. „alle 2 Jahre“ ausgewiesen.</li>'+
      '<li><strong>Balkendiagramm:</strong> lange Bezeichnungen überdecken den Balken nicht mehr.</li>'+
      '<li><strong>Systemschrift (SF Pro)</strong> statt nachgeladener Schriften, auch bei Überschriften und beim Namen „Vertragsordner“.</li>'+
      '<li><strong>Hochformat:</strong> die untere Menüleiste bleibt beim Scrollen (z. B. in der Hilfe) fest am unteren Rand; die Einträge teilen sich die Breite gleichmäßig.</li>'+
      '<li><strong>Korrektur:</strong> „Kündigen bis“ wurde in deutscher Zeitzone einen Tag zu früh angezeigt – behoben.</li>'+
      '<li><strong>Anhänge komfortabler:</strong> mehrere Dateien auf einmal wählen (iPhone, iPad, Mac), Dateien am Mac/PC per Drag &amp; Drop in das Vertragsfenster ziehen, kopierte Bilder mit Cmd/Strg+V einfügen. Details unter „Dokumente anhängen“.</li>'+
      '<li><strong>Anhänge nur im Vertrag:</strong> Die Vertragsliste zeigt keine Vorschaubilder mehr; Fotos und PDFs sind ausschließlich im geöffneten Vertrag sichtbar. Der Anhänge-Button heißt „Foto / Scan / Datei hinzufügen“.</li>'+
      '<li><strong>Neuer Name und neues Icon:</strong> aus „Vertragsordner“ wird „Vertragsraum“ mit dem Slogan „Verträge einfach im Blick“ (in der Seitenleiste am Mac/iPad quer) und neuem App-Icon. Ihre Daten und Sicherungen sind davon nicht betroffen; zu bereits angelegten Home-Bildschirm-Symbolen siehe „Auf dem iPad/iPhone als App nutzen“.</li>'+
      '<li><strong>Dokumente sortieren:</strong> Pfeile „nach oben / nach unten“ ändern die Reihenfolge angehängter Dokumente.</li>'+
      '<li><strong>Neue Info-Felder:</strong> „Sonderkündigungsrecht“ (Freitext, nur Hinweis) und „Schadenmeldung online“ (Website mit Öffnen-Symbol, auch in der Ansicht „Nach Anbieter“).</li>'+
      '<li><strong>Kontakte &amp; Ansicht „Nach Anbieter“:</strong> neuer Umschalter in den Verträgen mit Anbieter-Karten (Anruf, E-Mail, Portal, zugehörige Verträge), zweite Rufnummer „Schaden / Hotline“ und erweiterte Suche.</li>'+
      '<li><strong>Korrektur:</strong> Beim Tippen ins Suchfeld der Verträge bleibt der Cursor jetzt im Feld (zuvor brach die Eingabe nach jedem Buchstaben ab).</li>'+
      '<li><strong>Preisverlauf:</strong> Beitragsänderungen werden pro Vertrag mit Datum, Grund und Veränderung in Euro/Prozent festgehalten; Abzeichen in der Vertragsliste und eine Übersichtskarte „Preisänderungen der letzten 12 Monate“.</li>'+
      '<li><strong>Kündigungsschreiben:</strong> neues Hilfe-Thema mit Links zu den kostenlosen Musterbriefen der Verbraucherzentrale (Deutschland) und der Arbeiterkammer (Österreich), getrennt dargestellt.</li>'+
      '<li><strong>CSV-Export:</strong> Vertragsliste als Tabelle für Excel/Numbers – ohne Bankkonten und Anhänge (nur Export, kein Import).</li>'+
      '<li><strong>Robusterer Speicher:</strong> Umstellung auf IndexedDB mit deutlich mehr Platz für Anhänge, automatische Übernahme der bisherigen Daten und eine Warnung, falls das Speichern einmal fehlschlägt.</li>'+
      '<li><strong>Bereitstellung:</strong> die App kann als Internetseite (z. B. GitHub Pages) genutzt und auf dem iPad zum Home-Bildschirm hinzugefügt werden; es liegen dort keine Daten.</li>'+
    '</ul>' },

  { title:"Datenschutz & Offline-Funktionsweise", body:
    '<p>Diese App besteht aus einer einzigen Datei, läuft vollständig im Browser dieses Geräts und greift auf keine externen Server zu – auch Schriften werden nicht mehr aus dem Internet nachgeladen, sondern es wird die Systemschrift Ihres Geräts verwendet. Ihre Vertragsdaten, angehängten Dokumente und Fotos verlassen das jeweilige Gerät nur dann, wenn Sie selbst eine Sicherungsdatei exportieren und bewusst weitergeben oder in iCloud Drive ablegen.</p>' }
];

function renderHelp(){
  const el = document.getElementById("view-help");
  el.innerHTML =
    '<div class="section card"><div class="card-pad">'+
      HELP_TOPICS.map(function(t, i){
        return '<details class="help-topic"'+(i===0?' open':'')+'>'+
          '<summary>'+icon("chevronRight","chev")+'<span>'+escapeHtml(t.title)+'</span></summary>'+
          '<div class="help-topic-body">'+t.body+'</div>'+
        '</details>';
      }).join("")+
    '</div></div>'+
    '<div class="card"><div class="card-pad" style="display:flex;gap:10px;align-items:flex-start;color:var(--text-secondary);font-size:0.86rem;line-height:1.6;">'+
      icon("info")+
      '<div>Finden Sie hier keine Antwort auf Ihre Frage? Diese Hilfe wächst mit der App – sagen Sie einfach Bescheid, welche Funktion noch erklärt werden sollte.</div>'+
    '</div></div>';
}

/* ======================= Dashboard ======================= */

function activeRecurring(){
  return visibleContracts().filter(function(c){ return c.status==="aktiv" && c.frequency!=="einmalig"; });
}

function renderDashboard(){
  const el = document.getElementById("view-dashboard");
  if (!state.contractsLoaded){
    el.innerHTML = '<div class="chart-empty">Wird geladen …</div>';
    return;
  }
  if (state.contracts.length===0){
    el.innerHTML = emptyStateHTML();
    wireEmptyState(el);
    return;
  }

  const rec = activeRecurring();
  const annualTotal = rec.reduce(function(s,c){ return s+annualCost(c); }, 0);
  const monthlyTotal = annualTotal/12;
  const activeCount = visibleContracts().filter(function(c){ return c.status==="aktiv"; }).length;
  const upcoming = upcomingDeadlines();

  el.innerHTML =
    '<div class="kpi-row">'+
      kpiHTML("Jährliche Kosten", formatEUR(annualTotal), "laufende, aktive Verträge")+
      kpiHTML("Monatlich Ø", formatEUR(monthlyTotal), "hochgerechnet")+
      kpiHTML("Aktive Verträge", String(activeCount), "")+
      kpiHTML("Fristen < 90 Tage", String(upcoming.length), "")+
    '</div>'+

    '<div class="section card">'+
      '<div class="card-pad">'+
        '<div class="section-head">'+
          '<h2>Ausgaben im Überblick</h2>'+
          '<div class="chart-toggle" id="chart-toggle">'+
            '<button data-mode="category" type="button">Nach Kategorie</button>'+
            '<button data-mode="payer" type="button">Nach Zahler:in</button>'+
            '<button data-mode="provider" type="button">Nach Anbieter</button>'+
          '</div>'+
        '</div>'+
        '<div class="chart-display-row">'+
          '<div class="chart-toggle" id="chart-display-toggle">'+
            '<button data-display="tiles" type="button">Kacheln</button>'+
            '<button data-display="bars" type="button">Diagramm</button>'+
            '<button data-display="table" type="button">Tabelle</button>'+
          '</div>'+
        '</div>'+
        '<div id="chart-host"></div>'+
      '</div>'+
    '</div>'+

    '<div class="section card">'+
      '<div class="card-pad">'+
        '<div class="section-head"><h2>Anstehende Fristen &amp; Termine</h2></div>'+
        (upcoming.length ? upcoming.map(deadlineRowHTML).join("") : '<div class="chart-empty">Keine Fristen oder Termine in den nächsten 90 Tagen.</div>')+
      '</div>'+
    '</div>'+
    priceChangesCardHTML();

  document.querySelectorAll("#chart-toggle button").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-mode")===state.chartMode);
    btn.addEventListener("click", function(){
      state.chartMode = btn.getAttribute("data-mode");
      renderDashboard();
    });
  });
  document.querySelectorAll("#chart-display-toggle button").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-display")===state.chartDisplay);
    btn.addEventListener("click", function(){
      state.chartDisplay = btn.getAttribute("data-display");
      renderDashboard();
    });
  });

  renderChart(document.getElementById("chart-host"));

  el.querySelectorAll("[data-open-contract]").forEach(function(row){
    row.addEventListener("click", function(){ openContractModal(row.getAttribute("data-open-contract")); });
  });
}

function priceChangesCardHTML(){
  const items = [];
  visibleContracts().filter(function(c){ return c.status==="aktiv"; }).forEach(function(c){
    const r = recentPriceChange(c);
    if (r) items.push({ c:c, r:r });
  });
  if (!items.length) return "";
  const total = items.reduce(function(sum,x){ return sum+x.r.delta; }, 0);
  const before = items.reduce(function(sum,x){ return sum+x.r.before; }, 0);
  const pct = before>0 ? total/before*100 : null;
  items.sort(function(a,b){ return Math.abs(b.r.delta)-Math.abs(a.r.delta); });
  const shown = items.slice(0,5);
  return '<div class="section card"><div class="card-pad">'+
    '<div class="section-head"><h2>Preisänderungen der letzten 12 Monate</h2></div>'+
    '<p style="margin:0 0 12px;font-size:0.9rem;">Auswirkung auf Ihre Jahreskosten: <span class="price-delta '+(total>0?"up":"down")+'">'+escapeHtml(signedEUR(total))+(pct!=null?' ('+escapeHtml(signedPct(pct))+')':'')+' pro Jahr</span>'+
      ' <span class="member-sub">≈ '+escapeHtml(signedEUR(total/12))+' pro Monat · '+items.length+(items.length===1?' Vertrag':' Verträge')+'</span></p>'+
    shown.map(function(x){
      return '<div class="pc-row" data-open-contract="'+x.c.id+'">'+
        '<span class="dot" style="background:'+catColor(x.c.category)+'"></span>'+
        '<div class="pc-name">'+escapeHtml(x.c.name||"(ohne Namen)")+'<div class="pc-sub">'+escapeHtml(formatEUR(x.r.before))+' → '+escapeHtml(formatEUR(x.r.after))+' pro Jahr · seit '+escapeHtml(formatDate(x.r.since))+'</div></div>'+
        '<span class="price-delta '+(x.r.delta>0?"up":"down")+'">'+escapeHtml(signedEUR(x.r.delta))+(x.r.pct!=null?' ('+escapeHtml(signedPct(x.r.pct))+')':'')+'</span>'+
      '</div>';
    }).join("")+
    (items.length>shown.length ? '<div class="member-sub" style="margin-top:6px;">… und '+(items.length-shown.length)+' weitere</div>' : '')+
  '</div></div>';
}

function kpiHTML(label, value, sub){
  return '<div class="kpi"><div class="kpi-label">'+escapeHtml(label)+'</div><div class="kpi-value">'+escapeHtml(value)+'</div>'+(sub?'<div class="member-sub">'+escapeHtml(sub)+'</div>':'')+'</div>';
}

function upcomingDeadlines(){
  const today = new Date(todayISO()+"T00:00:00");
  const items = [];
  visibleContracts().filter(function(c){ return c.status==="aktiv"; }).forEach(function(c){
    const cb = cancelByDate(c);
    if (cb && daysBetween(today, cb) <= 90) items.push({ c:c, cb:cb, kind:"cancel" });
    if (c.nextDueDate){
      const d = new Date(c.nextDueDate+"T00:00:00");
      if (!isNaN(d) && daysBetween(today, d) <= 90) items.push({ c:c, cb:d, kind:"service" });
    }
  });
  return items.sort(function(a,b){ return a.cb - b.cb; }).slice(0,8);
}

function deadlineRowHTML(x){
  const days = daysBetween(new Date(todayISO()+"T00:00:00"), x.cb);
  let badge;
  if (days < 0) badge = '<span class="badge badge-critical">'+icon("warn")+' überfällig</span>';
  else if (days <= 14) badge = '<span class="badge badge-critical">'+icon("warn")+' '+days+' Tage</span>';
  else if (days <= 60) badge = '<span class="badge badge-warning">'+days+' Tage</span>';
  else badge = '<span class="badge badge-neutral">'+days+' Tage</span>';
  const renewedNote = (x.kind!=="service" && x.c.autoRenew && x.cb.effectiveEndDate && x.cb.effectiveEndDate!==x.c.endDate)
    ? ' <span title="Automatische Verlängerung bereits eingerechnet">'+icon("refresh")+'</span>' : '';
  return '<div class="deadline-row" data-open-contract="'+x.c.id+'" style="cursor:pointer;">'+
    '<span class="dot" style="background:'+catColor(x.c.category)+'"></span>'+
    '<div class="deadline-main">'+
      '<div class="deadline-name">'+escapeHtml(x.c.name||"(ohne Namen)")+'</div>'+

/* ---------- Chart ---------- */

function chartData(){
  const rec = activeRecurring();
  if (state.chartMode==="category"){
    const totals = {};
    rec.forEach(function(c){ totals[c.category] = (totals[c.category]||0) + annualCost(c); });
    return CATEGORIES.map(function(cat){ return { key:cat.id, label:cat.label, value:totals[cat.id]||0, color:"var("+cat.varName+")" }; })
      .filter(function(r){ return r.value>0; })
      .sort(function(a,b){ return b.value-a.value; });
  }
  if (state.chartMode==="provider"){
    const totals = {}, counts = {}, order = [];
    rec.forEach(function(c){
      const key = (c.provider||"").trim() || "__none";
      if (!(key in totals)){ totals[key]=0; counts[key]=0; order.push(key); }
      totals[key]+=annualCost(c);
      counts[key]+=1;
    });
    let rows = order.map(function(key){
      return { key:key, label: key==="__none" ? "Ohne Anbieter" : key, value: totals[key], count: counts[key] };
    }).sort(function(a,b){ return b.value-a.value; });
    if (rows.length>10){
      // Aus Performance-/Übersichtsgründen: nur die Top 10 Anbieter einzeln, der Rest gebündelt.
      const head = rows.slice(0,10);
      const rest = rows.slice(10);
      const restSum = rest.reduce(function(s,r){ return s+r.value; },0);
      const restCount = rest.reduce(function(s,r){ return s+r.count; },0);
      rows = head.concat([{ key:"__other", label:"Weitere", value:restSum, count:restCount }]);
    }
    return rows.map(function(r,i){
      return Object.assign({}, r, { color: r.key==="__other" ? "var(--cat-other)" : "var(--cat-"+((i%8)+1)+")" });
    });
  }
  const totals = {}, order = [];
  rec.forEach(function(c){
    if (!c.payerId) return;
    if (!(c.payerId in totals)){ totals[c.payerId]=0; order.push(c.payerId); }
    totals[c.payerId]+=annualCost(c);
  });
  let rows = order.map(function(id){
    const m = memberById(id);
    return { key:id, label:m ? m.name : "Unbekannt", value:totals[id], color: m ? "var("+memberColorVar(m)+")" : "var(--cat-other)" };
  }).sort(function(a,b){ return b.value-a.value; });
  if (rows.length>8){
    const head = rows.slice(0,7);
    const restSum = rows.slice(7).reduce(function(s,r){ return s+r.value; },0);
    rows = head.concat([{ key:"__other", label:"Weitere", value:restSum, color:"var(--cat-other)" }]);
  }
  return rows;
}

function chartModeLabel(){
  return state.chartMode==="category" ? "Kategorie" : (state.chartMode==="provider" ? "Anbieter" : "Zahler:in");
}
function contractCountLabel(n){
  return n+' Vertrag/Verträge';
}

function renderChart(host){
  const data = chartData();
  const total = data.reduce(function(s,r){ return s+r.value; },0);

  if (data.length===0){
    host.innerHTML = '<div class="chart-empty">Noch keine aktiven, wiederkehrenden Verträge für diese Auswertung.</div>';
    return;
  }

  if (state.chartDisplay==="table"){
    host.innerHTML = '<div style="overflow-x:auto;"><table class="chart-table"><thead><tr><th>'+chartModeLabel()+'</th><th>Anteil</th><th>Jährlich</th></tr></thead><tbody>'+
      data.map(function(r){
        const pct = total? Math.round(r.value/total*100) : 0;
        const countSuffix = (state.chartMode==="provider")
          ? ' <span class="chart-count">('+contractCountLabel(r.count)+')</span>' : '';
        return '<tr><td><span class="dot" style="background:'+r.color+';margin-right:7px;"></span>'+escapeHtml(r.label)+countSuffix+'</td><td>'+pct+' %</td><td class="amount">'+formatEUR(r.value)+'</td></tr>';
      }).join("")+
      '</tbody></table></div>';
    return;
  }

  if (state.chartDisplay==="tiles"){
    host.innerHTML = '<div class="tile-grid">'+data.map(function(r){
      const pct = total? Math.round(r.value/total*100) : 0;
      const countHTML = (state.chartMode==="provider")
        ? '<span class="cat-tile-count">'+contractCountLabel(r.count)+'</span>' : '';
      const ariaCount = (state.chartMode==="provider") ? ', '+contractCountLabel(r.count) : '';
      return '<div class="cat-tile" data-tile-key="'+r.key+'" tabindex="0" role="button" aria-label="'+escapeHtml(r.label)+ariaCount+', '+formatEUR(r.value)+' pro Jahr, '+pct+' Prozent">'+
        '<div class="cat-tile-head"><span class="dot" style="background:'+r.color+'"></span><span class="cat-tile-label">'+escapeHtml(r.label)+'</span></div>'+
        countHTML+
        '<div class="cat-tile-value">'+formatEUR(r.value)+'</div>'+
        '<div class="cat-tile-sub">'+pct+' % · '+formatEUR(r.value/12)+' / Monat</div>'+
        '<div class="cat-tile-meter"><span style="width:'+pct+'%;background:'+r.color+';"></span></div>'+
      '</div>';
    }).join("")+'</div>';
    host.querySelectorAll("[data-tile-key]").forEach(function(el){
      function activate(){
        const key = el.getAttribute("data-tile-key");
        if (key==="__other") return;
        if (state.chartMode==="category"){ state.filterCategory = key; setView("contracts"); }
        else if (state.chartMode==="payer"){ state.filterPayer = key; setView("contracts"); }
        else if (state.chartMode==="provider"){ state.filterProvider = key; setView("contracts"); }
      }
      el.addEventListener("click", activate);
      el.addEventListener("keydown", function(e){ if (e.key==="Enter" || e.key===" "){ e.preventDefault(); activate(); } });
    });
    return;
  }

  const showCount = state.chartMode==="provider";
  const rowH = showCount ? 46 : 34, gap = 8, topPad = 6, labelColW = 168, axisH = 22;
  const chartW = 640;
  const plotW = chartW - labelColW - 54;
  const maxVal = Math.max.apply(null, data.map(function(r){ return r.value; }));
  const niceMax = maxVal<=0 ? 1 : maxVal*1.08;
  const h = topPad + data.length*(rowH+gap) - gap + axisH + 8;

  const ticks = [0, niceMax*0.5, niceMax];

  // Reserve a little breathing room between the label text and the bar start,
  // and cut off labels/values that would otherwise run into the bar (the
  // overlap this fixes). Approximate character widths so this stays correct
  // however wide the chart is rendered.
  const labelGap = 10;
  const maxTextW = labelColW - labelGap;
  function fitChartText(str, fontSize, monospace){
    const avgCharW = fontSize * (monospace ? 0.62 : 0.56);
    const maxChars = Math.max(3, Math.floor(maxTextW/avgCharW));
    if (str.length<=maxChars) return str;
    return str.slice(0, maxChars-1).replace(/\s+$/,"")+"…";
  }
  // For the amount/percent line, drop the cents before resorting to an
  // ellipsis, so very large totals keep their percentage figure readable.
  function fitChartValue(value, pct, fontSize){
    const full = formatEUR(value)+' · '+pct+' %';
    const avgCharW = fontSize*0.62;
    const maxChars = Math.max(3, Math.floor(maxTextW/avgCharW));
    if (full.length<=maxChars) return full;
    const short = eurNoDecimals.format(value||0)+' · '+pct+' %';
    if (short.length<=maxChars) return short;
    return fitChartText(short, fontSize, true);
  }

  let svg = '<svg viewBox="0 0 '+chartW+' '+h+'" style="width:100%;height:auto;display:block" role="img" aria-label="Balkendiagramm Ausgaben nach '+chartModeLabel()+'">';

  ticks.forEach(function(t){
    const x = labelColW + (t/niceMax)*plotW;
    svg += '<line x1="'+x.toFixed(1)+'" y1="'+topPad+'" x2="'+x.toFixed(1)+'" y2="'+(h-axisH)+'" stroke="var(--gridline)" stroke-width="1" stroke-dasharray="2,3"/>';
    svg += '<text class="bar-axis-label" x="'+x.toFixed(1)+'" y="'+(h-axisH+15)+'" text-anchor="middle">'+formatEUR(t).replace(/ /g," ")+'</text>';
  });

  data.forEach(function(r, i){
    const y = topPad + i*(rowH+gap);
    const barW = Math.max(2, (r.value/niceMax)*plotW);
    const cy = y + rowH/2;
    const pct = total? Math.round(r.value/total*100) : 0;
    const labelText = fitChartText(r.label, 13.12, false);
    const valueText = fitChartValue(r.value, pct, 13.12);
    if (showCount){
      const countText = fitChartText(contractCountLabel(r.count), 11.52, false);
      svg += '<text class="bar-row-label" x="0" y="'+(cy-12).toFixed(1)+'"><title>'+escapeHtml(r.label)+'</title>'+escapeHtml(labelText)+'</text>';
      svg += '<text class="bar-row-value" x="0" y="'+(cy+7).toFixed(1)+'">'+escapeHtml(valueText)+'</text>';
      svg += '<text class="bar-row-count" x="0" y="'+(cy+22).toFixed(1)+'">'+escapeHtml(countText)+'</text>';
    } else {
      svg += '<text class="bar-row-label" x="0" y="'+(cy-6).toFixed(1)+'"><title>'+escapeHtml(r.label)+'</title>'+escapeHtml(labelText)+'</text>';
      svg += '<text class="bar-row-value" x="0" y="'+(cy+13).toFixed(1)+'">'+escapeHtml(valueText)+'</text>';
    }
    svg += '<rect class="bar-rect" data-idx="'+i+'" x="'+labelColW+'" y="'+(cy-7).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="14" rx="7" fill="'+r.color+'"/>';
    svg += '<rect class="bar-hit" data-idx="'+i+'" x="'+labelColW+'" y="'+(y-2)+'" width="'+plotW+'" height="'+(rowH+4)+'" fill="transparent"/>';
  });

  svg += '</svg>';

  host.innerHTML = '<div class="chart-wrap">'+svg+'<div class="chart-tooltip" id="chart-tooltip"></div></div>';

  const wrap = host.querySelector(".chart-wrap");
  const tooltip = host.querySelector("#chart-tooltip");
  wrap.querySelectorAll(".bar-hit").forEach(function(hit){
    const idx = Number(hit.getAttribute("data-idx"));
    const r = data[idx];
    const rect = wrap.querySelector('.bar-rect[data-idx="'+idx+'"]');
    function show(evt){
      rect.classList.add("hovered");
      const pct = total? Math.round(r.value/total*100) : 0;
      const countLine = (state.chartMode==="provider") ? '<br>'+contractCountLabel(r.count) : '';
      tooltip.innerHTML = '<div style="font-weight:600;margin-bottom:2px;">'+escapeHtml(r.label)+'</div>'+
        'Jährlich: <b>'+formatEUR(r.value)+'</b><br>Monatlich Ø: <b>'+formatEUR(r.value/12)+'</b><br>Anteil: <b>'+pct+' %</b>'+countLine;
      const wrapRect = wrap.getBoundingClientRect();
      const px = evt.clientX - wrapRect.left;
      const py = evt.clientY - wrapRect.top;
      tooltip.style.left = Math.min(Math.max(px,60), wrapRect.width-60) + "px";
      tooltip.style.top = py + "px";
      tooltip.classList.add("show");
    }
    hit.addEventListener("mousemove", show);
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("mouseleave", function(){ rect.classList.remove("hovered"); tooltip.classList.remove("show"); });
    hit.addEventListener("click", function(){
      if (r.key==="__other") return;
      if (state.chartMode==="category"){ state.filterCategory = r.key; setView("contracts"); }
      else if (state.chartMode==="payer"){ state.filterPayer = r.key; setView("contracts"); }
      else if (state.chartMode==="provider"){ state.filterProvider = r.key; setView("contracts"); }
    });
  });
}

function filteredContractsList(){
  let list = visibleContracts();
  if (state.search){
    const q = state.search.toLowerCase();
    list = list.filter(function(c){
      return (c.name||"").toLowerCase().indexOf(q)>=0 ||
             (c.provider||"").toLowerCase().indexOf(q)>=0 ||
             (c.contractNumber||"").toLowerCase().indexOf(q)>=0 ||
             (c.cancelContactName||"").toLowerCase().indexOf(q)>=0 ||
             (c.cancelEmail||"").toLowerCase().indexOf(q)>=0 ||
             (c.cancelPhone||"").replace(/\s+/g,"").indexOf(q.replace(/\s+/g,""))>=0 ||
             (c.servicePhone||"").replace(/\s+/g,"").indexOf(q.replace(/\s+/g,""))>=0;
    });
  }
  if (state.filterCategory) list = list.filter(function(c){ return c.category===state.filterCategory; });

  if (state.filterPayer) list = list.filter(function(c){ return c.payerId===state.filterPayer; });

  list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||"", "de"); });

/* ======================= Ansicht „Nach Anbieter“ ======================= */

function telHref(raw){ return "tel:" + String(raw).replace(/[^\d+]/g, ""); }
function portalHref(raw){ raw = String(raw).trim(); return /^https?:\/\//i.test(raw) ? raw : "https://"+raw; }
function portalLabel(raw){ return String(raw).trim().replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/\/$/,""); }

function providerGroups(list){
  const map = {};
  list.forEach(function(c){
    const name = (c.provider||"").trim();
    const key = name.toLowerCase();
    if (!map[key]) map[key] = { key:key, name:name, contracts:[] };
    else if (name && !/^[A-ZÄÖÜ]/.test(map[key].name) && /^[A-ZÄÖÜ]/.test(name)) map[key].name = name;
    map[key].contracts.push(c);
  });
  const groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){
    if (!a.name) return 1; if (!b.name) return -1;
    return a.name.localeCompare(b.name, "de");
  });
  return groups;
}

/* Kontaktdaten eines Anbieters = Zusammenschau der Felder aus allen seinen Verträgen (ohne Dubletten) */
function providerContacts(g){
  const phones = [], mails = [], portals = [], names = [], claims = [];
  const seenP = {}, seenM = {}, seenU = {}, seenN = {}, seenC = {};
  g.contracts.forEach(function(c){
    [[c.servicePhone, "Schaden / Hotline"], [c.cancelPhone, "Service / Kündigung"]].forEach(function(pr){
      const v = (pr[0]||"").trim(); if (!v) return;
      const k = v.replace(/[^\d+]/g,""); if (!k || seenP[k]) return;
      seenP[k] = true; phones.push({ value:v, label:pr[1] });
    });
    const m = (c.cancelEmail||"").trim(); if (m && !seenM[m.toLowerCase()]){ seenM[m.toLowerCase()] = true; mails.push(m); }
    const u = (c.portalUrl||"").trim(); if (u){ const k = portalLabel(u).toLowerCase(); if (!seenU[k]){ seenU[k] = true; portals.push(u); } }
    const cu = (c.claimUrl||"").trim(); if (cu){ const k = portalLabel(cu).toLowerCase(); if (!seenC[k]){ seenC[k] = true; claims.push(cu); } }
    const n = (c.cancelContactName||"").trim(); if (n && !seenN[n.toLowerCase()]){ seenN[n.toLowerCase()] = true; names.push(n); }
  });
  return { phones:phones, mails:mails, portals:portals, claims:claims, names:names };
}

  const ci = providerContacts(g);

  const chips = []
    .concat(ci.phones.map(function(p){ return '<a class="contact-chip" href="'+escapeHtml(telHref(p.value))+'">'+icon("phone")+'<span>'+escapeHtml(p.value)+' <small>'+escapeHtml(p.label)+'</small></span></a>'; }))
    .concat(ci.mails.map(function(m){ return '<a class="contact-chip" href="mailto:'+escapeHtml(m)+'">'+icon("mail")+'<span>'+escapeHtml(m)+'</span></a>'; }))
    .concat(ci.claims.map(function(u){ return '<a class="contact-chip" href="'+escapeHtml(portalHref(u))+'" target="_blank" rel="noopener noreferrer">'+icon("link")+'<span>'+escapeHtml(portalLabel(u))+' <small>Schaden melden</small></span></a>'; }))
    .concat(ci.portals.map(function(u){ return '<a class="contact-chip" href="'+escapeHtml(portalHref(u))+'" target="_blank" rel="noopener noreferrer">'+icon("link")+'<span>'+escapeHtml(portalLabel(u))+'</span></a>'; }));
  return '<div class="prov-card">'+
    '<div class="prov-head">'+
      '<div class="prov-avatar" style="background:'+color+'">'+escapeHtml(g.name ? g.name.charAt(0).toUpperCase() : "–")+'</div>'+
      '<div style="min-width:0;"><div class="prov-name">'+escapeHtml(label)+'</div>'+
        '<div class="prov-sub">'+g.contracts.length+(g.contracts.length===1?' Vertrag':' Verträge')+(annual>0 ? ' · '+escapeHtml(formatEUR(annual))+' / Jahr' : '')+'</div></div>'+
    '</div>'+
    (ci.names.length ? '<div class="prov-sub">Ansprechpartner: '+escapeHtml(ci.names.join(", "))+'</div>' : '')+
    (chips.length ? '<div class="prov-contact">'+chips.join("")+'</div>' : '<div class="prov-sub">Keine Kontaktdaten hinterlegt – im Vertrag unter „Kontakt beim Anbieter“ ergänzen.</div>')+
    '<div>'+g.contracts.map(function(c){
      const f = FREQ_BY_ID[c.frequency];
      return '<div class="prov-contract" data-open-contract="'+c.id+'">'+
        '<span class="dot" style="background:'+catColor(c.category)+'"></span>'+
        '<div class="pc-name">'+escapeHtml(c.name||"(ohne Namen)")+(c.status!=="aktiv" ? ' <span class="badge badge-neutral">'+escapeHtml(STATUS_BY_ID[c.status]?STATUS_BY_ID[c.status].label:c.status)+'</span>' : '')+'</div>'+
        '<span class="prov-contract-amt">'+escapeHtml(formatEUR(c.amount))+(freqSuffix(f)?' <span style="color:var(--text-muted);font-weight:500;">'+escapeHtml(freqSuffix(f))+'</span>':'')+'</span>'+
        icon("chevronRight")+
      '</div>';
    }).join("")+'</div>'+
  '</div>';
}
function hashStr(str){ let h = 0; for (let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; } return h; }

function providerViewHTML(list){
  const groups = providerGroups(list);
  let out = "", letter = null, open = false;
  groups.forEach(function(g){
    const ch = g.name ? (/[A-Za-zÄÖÜäöü]/.test(g.name.charAt(0)) ? g.name.charAt(0).toUpperCase() : "#") : "";
    if (ch !== letter){
      if (open) out += '</div>';

      out += (ch ? '<div class="prov-letter">'+escapeHtml(ch)+'</div>' : '<div class="prov-letter">Ohne Anbieter</div>') + '<div class="prov-list">';
      open = true;
    }
    out += providerCardHTML(g);
  });
  if (open) out += '</div>';
  return out;
}

/* ======================= Preisverlauf ======================= */

function signedEUR(n){ return (n>0?"+":(n<0?"−":""))+formatEUR(Math.abs(n)); }
function signedPct(p){ return (p>0?"+":(p<0?"−":""))+Math.abs(p).toFixed(1).replace(".",",")+" %"; }

/* Chronologische Preisreihe eines Vertrags; der jeweils letzte Eintrag entspricht immer dem aktuellen Beitrag. */
function priceSeries(c, hist){
  const h = (hist || c.priceHistory || []).slice();
  if (!h.length) return [];
  h.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
  const out = h.map(function(e){
    const f = FREQ_BY_ID[e.frequency];
    const amount = Number(e.amount)||0;
    return { id:e.id, date:e.date||"", amount:amount, frequency:e.frequency, annual:amount*(f?f.perYear:0), reason:e.reason||"", base:!!e.base };
  });
  const last = out[out.length-1];
  last.amount = Number(c.amount)||0; last.frequency = c.frequency; last.annual = annualCost(c);
  return out;
}
function priceDeltas(series){
  const out = [];
  for (let i=1;i<series.length;i++){
    const prev = series[i-1], cur = series[i];
    out.push({ idx:i, date:cur.date, prevAnnual:prev.annual, annual:cur.annual, delta:cur.annual-prev.annual, pct: prev.annual>0 ? (cur.annual-prev.annual)/prev.annual*100 : null });
  }
  return out;
}
/* Netto-Veränderung der Jahreskosten eines Vertrags innerhalb der letzten 12 Monate (inkl. bereits erfasster künftiger Termine) */
function recentPriceChange(c){
  const series = priceSeries(c);
  if (series.length<2) return null;
  const cutoff = dateToISO(addMonthsISO(todayISO(), -12));
  const recent = priceDeltas(series).filter(function(d){ return d.date && d.date>=cutoff; });
  if (!recent.length) return null;
  const delta = recent.reduce(function(sum,d){ return sum+d.delta; }, 0);
  const before = recent[0].prevAnnual;
  const after = recent[recent.length-1].annual;
  if (Math.abs(delta)<0.005) return null;
  return { delta:delta, before:before, after:after, pct: before>0 ? delta/before*100 : null, since:recent[0].date };
}
function priceBadgeHTML(c){
  if (c.status!=="aktiv" && c.status!=="pausiert") return "";
  const r = recentPriceChange(c);
  if (!r) return "";
  const up = r.delta>0;
  return '<span class="badge badge-price '+(up?"badge-warning":"badge-good")+'" title="Preisänderung seit '+escapeHtml(formatDate(r.since))+': '+escapeHtml(formatEUR(r.before))+' → '+escapeHtml(formatEUR(r.after))+' pro Jahr">'+
    (up?"↑ ":"↓ ")+escapeHtml(signedEUR(r.delta))+' / Jahr'+(r.pct!=null?' ('+escapeHtml(signedPct(r.pct))+')':'')+'</span>';
}

function priceHistoryHTML(c){
  const series = priceSeries(c, state.draftPriceHistory);
  if (series.length<2) return "";
  const deltas = priceDeltas(series);
  const rows = series.slice().reverse().map(function(e, ri){
    const i = series.length-1-ri;
    const f = FREQ_BY_ID[e.frequency];
    const d = i>0 ? deltas[i-1] : null;
    const deltaHtml = d && Math.abs(d.delta)>=0.005
      ? '<span class="price-delta '+(d.delta>0?"up":"down")+'">'+escapeHtml(signedEUR(d.delta))+(d.pct!=null?' ('+escapeHtml(signedPct(d.pct))+')':'')+' / Jahr</span>'
      : (i===0 ? '<span class="member-sub">Ausgangswert</span>' : '');
    return '<div class="payer-history-row price-row">'+
      '<span class="payer-history-date">'+(e.date ? escapeHtml(formatDate(e.date)) : 'Bisher')+'</span>'+
      '<span class="price-main">'+escapeHtml(formatEUR(e.amount))+(freqSuffix(f)?' '+escapeHtml(freqSuffix(f)):'')+
        (f && f.perYear!==1 && f.perYear>0 ? ' <span style="color:var(--text-muted);font-weight:400;">· '+escapeHtml(formatEUR(e.annual))+' / Jahr</span>' : '')+
        (e.reason ? '<small>'+escapeHtml(e.reason)+'</small>' : '')+
      '</span>'+
      deltaHtml+
      (!e.base ? '<button class="price-remove" type="button" data-remove-price="'+escapeHtml(e.id)+'" aria-label="Eintrag entfernen" title="Eintrag aus dem Verlauf entfernen">'+icon("x")+'</button>' : '')+
    '</div>';
  }).join("");
  return '<div class="field"><label>Preisverlauf</label><div class="payer-history" style="max-height:240px;">'+rows+'</div></div>';
}
function renderPriceHistory(overlay){
  const host = overlay.querySelector("#price-history-host");
  if (!host) return;
  const c = Object.assign({}, state.editingSource || {});
  host.innerHTML = priceHistoryHTML(c);
  host.querySelectorAll("[data-remove-price]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const id = btn.getAttribute("data-remove-price");
      state.draftPriceHistory = state.draftPriceHistory.filter(function(e){ return e.id!==id; });
      renderPriceHistory(overlay);
    });
  });
}

/* Rückfrage beim Speichern, wenn sich der Beitrag geändert hat */
function priceChangeDialog(oldAnnual, newAnnual, onDone){
  const delta = newAnnual-oldAnnual, pct = oldAnnual>0 ? delta/oldAnnual*100 : null;
  const overlay = buildOverlay("modal confirm-box", ''+
    '<div class="modal-head"><h2>Beitrag geändert</h2><button class="icon-btn" data-close type="button">'+icon("x")+'</button></div>'+
    '<div class="modal-body">'+
      '<p style="margin:0 0 12px;"><strong>'+escapeHtml(formatEUR(oldAnnual))+' → '+escapeHtml(formatEUR(newAnnual))+' pro Jahr</strong><br>'+
        '<span class="price-delta '+(delta>0?"up":"down")+'">'+escapeHtml(signedEUR(delta))+(pct!=null?' ('+escapeHtml(signedPct(pct))+')':'')+' pro Jahr</span></p>'+
      '<div class="field"><label for="pc-date">Neuer Beitrag gültig ab</label><input id="pc-date" type="date" value="'+escapeHtml(todayISO())+'"></div>'+
      '<div class="field"><label for="pc-reason">Grund (optional)</label><input id="pc-reason" type="text" maxlength="60" placeholder="z. B. Hochstufung SF 5, Beitragsanpassung"></div>'+
      '<label class="checkbox-label"><input type="checkbox" id="pc-correction"> Nur Korrektur (z. B. Tippfehler) – nicht als Preisänderung merken</label>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-close type="button">Zurück</button><button class="btn btn-primary" id="pc-ok" type="button">Speichern</button></div>'
  );
  /* Escape soll nur diesen Dialog schließen, nicht das darunterliegende Vertragsfenster */
  document.removeEventListener("keydown", overlay._escHandler);
  const esc = function(e){
    if (e.key!=="Escape") return;
    if (!document.body.contains(overlay)){ window.removeEventListener("keydown", esc, true); return; }
    {  e.stopImmediatePropagation(); window.removeEventListener("keydown", esc, true); closeOverlay(overlay); }
  };
  window.addEventListener("keydown", esc, true);
  overlay.querySelector("#pc-ok").addEventListener("click", function(){
    const meta = {
      date: overlay.querySelector("#pc-date").value || todayISO(),
      reason: overlay.querySelector("#pc-reason").value.trim(),
      correction: overlay.querySelector("#pc-correction").checked
    };
    window.removeEventListener("keydown", esc, true);
    closeOverlay(overlay);
    onDone(meta);
  });
  overlay.querySelector("#pc-ok").focus();
}

/* ======================= CSV-Export (nur Export, kein Import) ======================= */

function csvText(v){
  /* Text-Zelle: Formel-Präfixe entschärfen (Excel-/Numbers-Injection), bei Bedarf in Anführungszeichen */
  let t = String(v==null ? "" : v);
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvNum(n){ return (Number(n)||0).toFixed(2).replace(".", ","); }
function csvDate(iso){
  if (!iso) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  return m ? m[3]+"."+m[2]+"."+m[1] : "";
}
function buildContractsCSV(list){
  const head = ["Bezeichnung","Haushalt(e)","Kategorie","Anbieter","Vertragsnummer","Status","Zahler:in","Betrag","Rhythmus","Jahreskosten","Monatlich Ø","Vertragsbeginn","Vertragsende","Kündigungsfrist (Monate)","Nächste Kündigungsfrist","Nächster Termin","Automatische Verlängerung","Verlängerung (Monate)","Sonderkündigungsrecht","Notizen"];
  const lines = [head.map(csvText).join(";")];
  list.forEach(function(c){
    const cat = CATEGORY_BY_ID[c.category];
    const f = FREQ_BY_ID[c.frequency];
    const payer = memberById(c.payerId);
    const cb = cancelByDate(c);
    const hasAmount = c.amount!=="" && c.amount!=null;
    lines.push([
      csvText(c.name),
      csvText(householdsOfContract(c).map(function(h){ return h.name; }).join(", ")),
      csvText(cat ? cat.label : (c.category||"")),
      csvText(c.provider),
      csvText(c.contractNumber),
      csvText(STATUS_BY_ID[c.status] ? STATUS_BY_ID[c.status].label : (c.status||"")),
      csvText(payer ? payer.name : ""),
      hasAmount ? csvNum(c.amount) : "",
      csvText(f ? f.label : ""),
      hasAmount ? csvNum(annualCost(c)) : "",
      hasAmount ? csvNum(monthlyEquivalent(c)) : "",
      csvDate(c.startDate),
      csvDate(c.endDate),
      (c.noticePeriodMonths!=null && c.noticePeriodMonths!=="") ? String(c.noticePeriodMonths) : "",
      cb ? csvDate(dateToISO(cb)) : "",
      csvDate(c.nextDueDate),
      c.autoRenew ? "Ja" : "Nein",
      (c.autoRenew && c.renewalTermMonths!=null && c.renewalTermMonths!=="") ? String(c.renewalTermMonths) : "",
      csvText(c.specialCancel),
      csvText(c.notes)
    ].join(";"));
  });
  /* UTF-8 mit BOM, damit Excel/Numbers Umlaute korrekt lesen; Semikolon als Trenner (deutsche Einstellung) */
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function exportContractsCSV(list){
  if (!list.length){ toast("Keine Verträge zum Exportieren.", "error"); return; }
  let blob;
  try{ blob = new Blob([buildContractsCSV(list)], { type:"text/csv;charset=utf-8" }); }
  catch(e){ toast("CSV konnte nicht erstellt werden.", "error"); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "vertragsordner-vertraege-" + todayISO() + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("CSV-Datei wird heruntergeladen ("+list.length+" Verträge).");
}

        ? " Er ist aktuell "+contractCount+" Vertrag/Verträgen und "+memberCount+" Person(en) zugeordnet – diese Zuordnung wird dabei entfernt, die Einträge selbst bleiben erhalten."
        : "";
      confirmDialog("Haushalt entfernen?", "Dieser Haushalt wird endgültig gelöscht."+detail, function(){
        state.contracts.forEach(function(c){ if (Array.isArray(c.householdIds)) c.householdIds = c.householdIds.filter(function(hid){ return hid!==id; }); });
        state.members.forEach(function(m){ if (Array.isArray(m.householdIds)) m.householdIds = m.householdIds.filter(function(hid){ return hid!==id; }); });
        state.households = state.households.filter(function(h){ return h.id!==id; });
        if (state.activeHousehold===id) state.activeHousehold = "__all";
        ensureHouseholdsMigrated();
        markDirty();
        render();

      });
    });
  });

  document.getElementById("add-member-btn").addEventListener("click", openMemberModal);
  el.querySelectorAll("[data-open-member]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.filterPayer = btn.getAttribute("data-open-member");

      state.filterStatus = "";
      state.search = "";
      setView("contracts");
    });
  });
  el.querySelectorAll("[data-edit-member]").forEach(function(btn){
    btn.addEventListener("click", function(e){

      openMemberModal(btn.getAttribute("data-edit-member"));
    });

  el.querySelectorAll("[data-del-member]").forEach(function(btn){

      const inUse = state.contracts.some(function(c){ return c.payerId===id; });

        state.members = state.members.filter(function(m){ return m.id!==id; });
        markDirty();
        render();
        toast("Entfernt.");
      });
    });
  });
}

function openMemberModal(id, onSaved){
  const existing = id ? memberById(id) : null;
  state.draftBankAccounts = existing ? (existing.bankAccounts||[]).slice() : [];
  state.draftPhoto = existing ? (existing.photo || null) : null;
  state.draftHouseholdIds = existing ? (existing.householdIds||[]).slice() : state.households.map(function(h){ return h.id; });

  const overlay = buildOverlay('modal', memberModalHTML(existing));
  renderBankAccountList(overlay);
  renderMemberPhotoRow(overlay, existing);
  renderMemberHouseholdChips(overlay);

  const input = overlay.querySelector("#member-name-input");
  setTimeout(function(){ input.focus(); }, 30);
  input.addEventListener("input", function(){ if (!state.draftPhoto) renderMemberPhotoRow(overlay, existing); });

  const photoInput = overlay.querySelector("#member-photo-input");
  photoInput.addEventListener("change", function(){
    const file = photoInput.files[0];
    photoInput.value = "";
    if (!file) return;
    if (!file.type || file.type.indexOf("image/")!==0){ toast("Bitte ein Foto wählen.","error"); return; }
    if (file.size > MAX_ATTACHMENT_MB*1024*1024){ toast("Foto ist größer als "+MAX_ATTACHMENT_MB+" MB.","error"); return; }
    downscaleImageToDataUrl(file, MAX_AVATAR_DIM).then(function(dataUrl){
      state.draftPhoto = dataUrl;
      renderMemberPhotoRow(overlay, existing);
    }).catch(function(){
      toast("Foto konnte nicht gelesen werden.","error");
    });
  });

  const labelInput = overlay.querySelector("#bank-account-label-input");
  const ibanInput = overlay.querySelector("#bank-account-iban-input");
  const addAcctBtn = overlay.querySelector("#bank-account-add-btn");
  function addDraftAccount(){
    const label = labelInput.value.trim();
    const iban = ibanInput.value.trim();
    if (!label && !iban) { labelInput.focus(); return; }
    state.draftBankAccounts.push({ id:newId(), label: label || "Konto", iban: iban });
    labelInput.value = ""; ibanInput.value = "";
    renderBankAccountList(overlay);
    labelInput.focus();
  }
  addAcctBtn.addEventListener("click", addDraftAccount);
  [labelInput, ibanInput].forEach(function(el){
    el.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); addDraftAccount(); } });
  });

  overlay.querySelector("#member-save-btn").addEventListener("click", function(){
    const name = input.value.trim();
    if (!name){ input.focus(); return; }
    if (existing){
      existing.name = name;
      existing.bankAccounts = state.draftBankAccounts.slice();
      existing.photo = state.draftPhoto || null;
      existing.householdIds = state.draftHouseholdIds.slice();
    } else {
      state.members.push({
        id:newId(), name:name, colorIndex: state.members.length % MEMBER_COLORS.length,
        createdAt: new Date().toISOString(), bankAccounts: state.draftBankAccounts.slice(),
        photo: state.draftPhoto || null, householdIds: state.draftHouseholdIds.slice()
      });
    }
    markDirty();
    render();
    toast(existing ? "Gespeichert." : "Hinzugefügt.");
    closeOverlay(overlay);
    if (typeof onSaved === "function") onSaved();
  });
  input.addEventListener("keydown", function(e){ if (e.key==="Enter") overlay.querySelector("#member-save-btn").click(); });
}

/* ======================= Overlay / modal infrastructure ======================= */

function buildOverlay(modalClass, innerHTML){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = '<div class="'+modalClass+'" role="dialog" aria-modal="true">'+innerHTML+'</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener("mousedown", function(e){ if (e.target===overlay) closeOverlay(overlay); });
  overlay.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", function(){ closeOverlay(overlay); }); });
  function escHandler(e){ if (e.key==="Escape") closeOverlay(overlay); }
  document.addEventListener("keydown", escHandler);
  overlay._escHandler = escHandler;
  requestAnimationFrame(function(){ overlay.classList.add("show"); });
  return overlay;
}
function closeOverlay(overlay){
  overlay.classList.remove("show");
  document.removeEventListener("keydown", overlay._escHandler);
  setTimeout(function(){ overlay.remove(); }, 180);
}

function confirmDialog(title, body, onConfirm, confirmLabel, danger){
  confirmLabel = confirmLabel || "Entfernen";
  const btnClass = danger===false ? "btn-primary" : "btn-danger";
  const overlay = buildOverlay("modal confirm-box", ''+
    '<div class="modal-head"><h2>'+escapeHtml(title)+'</h2><button class="icon-btn" data-close type="button">'+icon("x")+'</button></div>'+
    '<div class="modal-body"><p>'+escapeHtml(body)+'</p></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-close type="button">Abbrechen</button><button class="btn '+btnClass+'" id="confirm-yes" type="button">'+escapeHtml(confirmLabel)+'</button></div>'
  );
  overlay.querySelector("#confirm-yes").addEventListener("click", function(){ closeOverlay(overlay); onConfirm(); });
}
