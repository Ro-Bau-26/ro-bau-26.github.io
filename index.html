function renderAttachmentList(overlay){
  const host = overlay.querySelector("#attachment-list");
  if (!host) return;
  if (state.draftAttachments.length===0){ host.innerHTML = ""; return; }
  const n = state.draftAttachments.length;
  host.innerHTML = state.draftAttachments.map(function(a, i){
    const isImg = a.contentType && a.contentType.indexOf("image/")===0;
    return '<div class="attachment-item">'+
      (n>1 ? '<div class="att-order">'+
        '<button class="att-move" data-move-att="'+i+'" data-dir="-1" type="button" aria-label="Nach oben" title="Nach oben"'+(i===0?' disabled':'')+'>'+icon("chevronUp")+'</button>'+
        '<button class="att-move" data-move-att="'+i+'" data-dir="1" type="button" aria-label="Nach unten" title="Nach unten"'+(i===n-1?' disabled':'')+'>'+icon("chevronDown")+'</button>'+
      '</div>' : '')+
      '<button class="attachment-open" data-open-att="'+i+'" type="button" title="Dokument öffnen">'+
        (isImg ? '<img src="'+a.dataUrl+'" alt="">' : '<span style="color:var(--text-muted);flex:none;">'+icon("doc")+'</span>')+
        '<span class="attachment-name">'+escapeHtml(a.name||"Dokument")+'</span>'+
      '</button>'+

    '</div>';
  }).join("");
  host.querySelectorAll("[data-open-att]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const a = state.draftAttachments[Number(btn.getAttribute("data-open-att"))];
      if (a) openAttachment(a);
    });
  });
  host.querySelectorAll("[data-move-att]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const i = Number(btn.getAttribute("data-move-att")), j = i + Number(btn.getAttribute("data-dir"));
      if (j<0 || j>=state.draftAttachments.length) return;
      const tmp = state.draftAttachments[i]; state.draftAttachments[i] = state.draftAttachments[j]; state.draftAttachments[j] = tmp;
      renderAttachmentList(overlay);

    btn.addEventListener("click", function(){
      state.draftAttachments.splice(Number(btn.getAttribute("data-remove-att")),1);
      renderAttachmentList(overlay);
    });
  });
}

function dataUrlToBlob(dataUrl){
  const commaIdx = dataUrl.indexOf(",");
  const meta = dataUrl.slice(0, commaIdx);
  const body = dataUrl.slice(commaIdx+1);
  const typeMatch = meta.match(/^data:([^;]+)/);
  const contentType = typeMatch ? typeMatch[1] : "application/octet-stream";
  if (/;base64/.test(meta)){
    const byteChars = atob(body);
    const byteNumbers = new Array(byteChars.length);
    for (let i=0; i<byteChars.length; i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    return new Blob([new Uint8Array(byteNumbers)], { type: contentType });
  }
  return new Blob([decodeURIComponent(body)], { type: contentType });
}

function openAttachment(a){
  if (!a || !a.dataUrl) return;
  try{
    const blob = dataUrlToBlob(a.dataUrl);
    const blobUrl = URL.createObjectURL(blob);
    const win = window.open(blobUrl, "_blank");
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 60000);
    if (!win){ toast("Öffnen wurde vom Browser blockiert. Bitte Pop-ups für diese Seite erlauben.","error"); }
  }catch(e){
    // Ausweichlösung, falls die Blob-Umwandlung fehlschlägt
    window.open(a.dataUrl, "_blank");
  }
}

     dropEffect wird bewusst NICHT gesetzt – Safari/Chrome lehnen sonst bei abweichendem effectAllowed den Drop ab. */
  const docZone = overlay.querySelector(".doc-zone");
  if (docZone){
    let dragDepth = 0;
    const hasFiles = function(e){
      const dt = e.dataTransfer;
      if (!dt) return false;
      if (dt.types && Array.prototype.indexOf.call(dt.types, "Files")>=0) return true;
      return !!(dt.files && dt.files.length);
    };
    const clear = function(){ dragDepth = 0; docZone.classList.remove("drag-over"); };
    overlay.addEventListener("dragenter", function(e){ if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; docZone.classList.add("drag-over"); });
    overlay.addEventListener("dragover", function(e){ if (!hasFiles(e)) return; e.preventDefault(); docZone.classList.add("drag-over"); });
    overlay.addEventListener("dragleave", function(){ dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) docZone.classList.remove("drag-over"); });
    overlay.addEventListener("drop", function(e){
      if (!hasFiles(e)) return;
      e.preventDefault(); clear();

  const delBtn = overlay.querySelector("#delete-btn");

const MAX_ATTACHMENT_MB = 20;
const MAX_IMAGE_DIM = 1600;
const MAX_BG_DIM = 2400;
const MAX_AVATAR_DIM = 480;

function readFileAsDataUrl(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error("read_failed")); };
    reader.readAsDataURL(file);
  });
}

function downscaleImageToDataUrl(file, maxDim){
  const limit = maxDim || MAX_IMAGE_DIM;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w,h) > limit){
          const scale = limit / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        try{
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        }catch(e){
          resolve(reader.result); // Canvas nicht verfügbar – Originalbild verwenden
        }
      };
      img.onerror = function(){ resolve(reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error("read_failed")); };
    reader.readAsDataURL(file);
  });
}

function addAttachmentFile(file){
  const isImage = file.type && file.type.indexOf("image/")===0;
  const isPdf = file.type==="application/pdf";
  if (!isImage && !isPdf) return Promise.reject("type");
  if (file.size > MAX_ATTACHMENT_MB*1024*1024) return Promise.reject("size");
  const work = isImage ? downscaleImageToDataUrl(file) : readFileAsDataUrl(file);
  return work.then(function(dataUrl){
    state.draftAttachments.push({ id:newId(), contentType: isImage ? "image/jpeg" : file.type, name:file.name, dataUrl:dataUrl });
  });
}

/* Verarbeitet eine oder mehrere Dateien nacheinander (Auswahl, Drag & Drop, Einfügen) */
function handleFilesSelected(overlay, files){
  files = Array.prototype.slice.call(files || []);
  if (!files.length) return;
  let added = 0, badType = 0, tooBig = 0, failed = 0;
  setDocStatus(overlay, '<span class="spinner"></span> Dokument wird verarbeitet …', true);
  files.reduce(function(chain, file){
    return chain.then(function(){
      return addAttachmentFile(file).then(function(){ added++; }, function(reason){
        if (reason==="type") badType++; else if (reason==="size") tooBig++; else failed++;
      });
    });
  }, Promise.resolve()).then(function(){
    renderAttachmentList(overlay);
    setDocStatus(overlay, "", false);
    const problems = [];
    if (badType) problems.push(badType+" Datei(en) übersprungen – nur Fotos und PDF möglich");
    if (tooBig) problems.push(tooBig+" Datei(en) größer als "+MAX_ATTACHMENT_MB+" MB");
    if (failed) problems.push(failed+" Datei(en) nicht lesbar");
    if (problems.length) toast(problems.join("; ")+".", "error");
    else if (added > 1) toast(added+" Dokumente angehängt.");
  });
}

function handleBackgroundFileSelected(file){
  if (!file.type || file.type.indexOf("image/")!==0){ toast("Bitte ein Foto wählen.","error"); return; }
  if (file.size > MAX_ATTACHMENT_MB*1024*1024){ toast("Foto ist größer als "+MAX_ATTACHMENT_MB+" MB.","error"); return; }
  toast("Hintergrundbild wird verarbeitet …");
  downscaleImageToDataUrl(file, MAX_BG_DIM).then(function(dataUrl){
    setBackgroundImage(dataUrl);
    toast("Hintergrundbild gespeichert.");
  }).catch(function(){
    toast("Foto konnte nicht gelesen werden.","error");
  });
}

function saveContract(overlay, source, isNew, priceMeta){
  const val = function(sel){ const el = overlay.querySelector(sel); return el ? el.value : ""; };
  const name = val("#f-name").trim();
  if (!name){ toast("Bitte eine Bezeichnung eingeben.","error"); overlay.querySelector("#f-name").focus(); return; }
  if (!state.draftHouseholdIds.length){ toast("Bitte mindestens einen Haushalt auswählen.","error"); return; }
  const amountRaw = val("#f-amount");
  const newAmount = amountRaw==="" ? 0 : Number(amountRaw);
  const newFreq = val("#f-frequency");

  /* Preisverlauf: bei geändertem Beitrag nachfragen (gültig ab, Grund, ggf. nur Korrektur) */
  let hist = (state.draftPriceHistory || []).map(function(e){ return Object.assign({}, e); });
  if (!isNew){
    const oldAnnual = annualCost(source);
    const newAnnual = annualCost({ amount:newAmount, frequency:newFreq });
    const changed = oldAnnual>0 && newAnnual>0 && Math.abs(newAnnual-oldAnnual)>=0.005;
    if (changed && !priceMeta){
      priceChangeDialog(oldAnnual, newAnnual, function(meta){ saveContract(overlay, source, isNew, meta); });
      return;
    }
    if (changed && !priceMeta.correction){
      if (!hist.length) hist.push({ id:newId(), date:"", amount:Number(source.amount)||0, frequency:source.frequency, reason:"", base:true });
      hist.push({ id:newId(), date:priceMeta.date, amount:newAmount, frequency:newFreq, reason:priceMeta.reason||"" });
    } else if (hist.length){
      /* Korrektur oder gleichwertiger Rhythmus-Wechsel: letzten Eintrag mitziehen */
      hist.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
      hist[hist.length-1].amount = newAmount; hist[hist.length-1].frequency = newFreq;
    }
    hist.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
  }

  const payerId = val("#f-payer") || "";
  const bankAccountId = val("#f-bankaccount") || "";

  const payerChanged = payerId !== (source.payerId||"");
  const acctChanged = bankAccountId !== (source.bankAccountId||"");
  let payerHistory = Array.isArray(source.payerHistory) ? source.payerHistory.slice() : [];
  if ((isNew && payerId) || (!isNew && (payerChanged || acctChanged))){
    payerHistory.push(payerHistorySnapshot(payerId, bankAccountId));
  }

  const payload = {
    name: name,
    householdIds: state.draftHouseholdIds.slice(),
    category: val("#f-category"),
    provider: val("#f-provider").trim(),
    contractNumber: val("#f-number").trim(),
    portalUrl: val("#f-portal-url").trim(),
    cancelContactName: val("#f-cancel-contact").trim(),
    cancelPhone: val("#f-cancel-phone").trim(),
    cancelEmail: val("#f-cancel-email").trim(),
    servicePhone: val("#f-service-phone").trim(),
    claimUrl: val("#f-claim-url").trim(),
    specialCancel: val("#f-special-cancel").trim(),
    payerId: payerId,
    bankAccountId: bankAccountId,
    payerHistory: payerHistory,
    amount: newAmount,
    frequency: newFreq,
    priceHistory: hist,
    startDate: val("#f-start"),
    endDate: val("#f-end"),
    nextDueDate: val("#f-nextdue"),
    noticePeriodMonths: val("#f-notice")===""? null : Number(val("#f-notice")),
    autoRenew: !!(overlay.querySelector("#f-autorenew") && overlay.querySelector("#f-autorenew").checked),
    renewalTermMonths: val("#f-renewal-term")===""? "" : Number(val("#f-renewal-term")),
    status: val("#f-status"),
    notes: val("#f-notes").trim(),
    attachments: state.draftAttachments,
    updatedAt: new Date().toISOString()
  };

  if (isNew){
    state.contracts.push(Object.assign({ id:newId(), createdAt:new Date().toISOString() }, payload));
  } else {
    const idx = state.contracts.findIndex(function(c){ return c.id===source.id; });
    if (idx>=0){ state.contracts[idx] = Object.assign({}, source, payload); }
  }
  markDirty();
  toast(isNew?"Vertrag gespeichert.":"Änderungen gespeichert.");
  closeOverlay(overlay);
  render();
}

/* ======================= Go ======================= */

boot().catch(function(e){ console.error(e); toast("Start fehlgeschlagen: "+(e && e.message || e), "error"); });

})();
</script>
</body>
</html>
