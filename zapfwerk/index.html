<title>Zapfwerk</title>
<style>
:root{--bg:#EDF1F2;--surface:#FFFFFF;--ink:#15262D;--muted:#5E7178;--line:#D3DCDF;--petrol:#0D5566;--amber:#F3B61F;--volt:#1F9E89;--up:#C4422B;--down:#2E7D4F;--meter:#3B2B23;--meterlbl:#DCC9B6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E181C;--surface:#16242A;--ink:#E4ECEE;--muted:#8DA2A9;--line:#26383F;--petrol:#5BB8CB;--volt:#3CC2A8;--up:#E2735E;--down:#5BC08A;--meter:#2C211B;--meterlbl:#BFA994}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mark{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0}
.mark img{display:block;flex:none}
.mark .mt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.mark .slogan{font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:3px}
.top-in select{margin-left:auto;flex:0 0 auto;width:auto;max-width:50%;text-overflow:ellipsis}
.bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
.bgimg::after{content:"";position:absolute;inset:0;background:rgba(237,241,242,.35)}
@media (prefers-color-scheme:light){body.has-bg{background:transparent}body.has-bg .bgimg{display:block}}
.bgprev{width:100%;height:120px;border-radius:10px;border:1px solid var(--line);background-size:cover;background-position:center;margin-top:10px}
main{max-width:760px;margin:0 auto;padding:8px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h2{font-size:20px;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:15px;margin:22px 0 6px;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:6px 0}
select,input,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink)}
label.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:14px 0 4px}
label.check input{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--petrol)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--petrol);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#06181D}}
.btn.secondary{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--up);border:1px solid var(--line)}
.btn.wide{width:100%;margin-top:10px}
.actions{display:flex;gap:8px;align-items:center;margin-top:20px}
.actions .sp{flex:1}
/* Verlauf */
.month{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px;font-weight:700}
.month span{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.entry{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ico svg{width:18px;height:18px}
.ico.fuel{color:var(--petrol)} .ico.ev{color:var(--volt)} .ico.cost{color:var(--muted)}
.e-title{font-weight:600;line-height:1.25}
.e-sub,.e-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.e-meta{color:var(--ink);font-variant-numeric:tabular-nums}
.e-sum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.d{font-size:12px;font-weight:600;white-space:nowrap}
.d.up{color:var(--up)} .d.down{color:var(--down)} .d.eq{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:3px;border:1.5px solid currentColor;border-radius:999px;padding:0 7px;font-size:12px;font-weight:800;line-height:1.5;vertical-align:1px}
.pill .ar{font-size:10px}
.rec{display:inline-flex;align-items:center;gap:3px;background:var(--amber);color:#1B1B1B;border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;font-size:12px;font-weight:800;line-height:1.5;vertical-align:1px;white-space:nowrap}
.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* Zählwerk */
.meter{background:var(--meter);border-radius:16px;padding:16px 16px 14px;margin-top:14px;color:var(--amber)}
.meter .lbl{color:var(--meterlbl);font-size:13px}
.meter>.lbl:first-child{text-align:right}
.meter .big{justify-content:flex-end}
.meter .cols>div:last-child{text-align:right}
.meter .cols>div:last-child .small{justify-content:flex-end}
.meter .big{display:flex;gap:3px;margin:6px 0 14px;flex-wrap:wrap}
.meter .small{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.dg{display:inline-grid;place-items:center;background:#ffffff10;border-radius:5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:.78em;padding:0 .08em}
.big .dg{font-size:38px;line-height:1.25}
.small .dg{font-size:20px;line-height:1.3}
.dg.sep{background:none;min-width:0}
.meter .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid #ffffff1c;padding-top:12px}
.tag{position:relative;margin-top:16px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);overflow:hidden}
.tag-h{display:flex;align-items:center;gap:10px;background:var(--amber);color:#1B1B1B;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-bottom:2px solid var(--ink)}
.tag-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);flex:none}
.tag-b{padding:2px 14px 4px}
.tag-b .row:last-child,.tag-b .entry:last-child,.tag-b details.faq:last-child{border-bottom:0}
.jubi{position:relative;overflow:hidden}
.jubi .tag-h{background:var(--amber)}
.jubi .jt{font-size:17px;line-height:1.4;margin:12px 0 4px}
.jubi .js{color:var(--muted);font-size:14px;margin:0 0 12px}
.jubi .btn{margin-bottom:12px}
.spark{position:absolute;pointer-events:none;color:var(--amber);font-size:18px;opacity:0;animation:spark 1.6s ease-out forwards;text-shadow:0 0 1px var(--ink)}
@keyframes spark{0%{opacity:0;transform:translateY(10px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.15) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.spark{display:none}}
.tag-r{margin-left:auto;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag-b.pad{padding:4px 14px 14px}
.tag-b .card{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:none}
.tag-b .card:last-child{border-bottom:0}
.tag-b .vcard .vmain{padding-left:0}
.tag-b .vcard .vedit{margin-right:-8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row .k{min-width:0}
.row .k small{display:block;color:var(--muted);font-size:13px}
.row .v{text-align:right;white-space:nowrap;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--petrol);margin-top:5px}
.bar.ev{background:var(--volt)} .bar.cost{background:var(--amber)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;width:100%;text-align:left;cursor:pointer;display:block}
.plate{display:inline-block;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;font-weight:700;font-size:13px;letter-spacing:.04em;line-height:1.45}
.pl{display:block;margin:4px 0 2px 14px}
.card.arch{opacity:.55}
.vcard{display:flex;align-items:center;gap:6px;padding:0;cursor:default}
.vcard .vmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:12px 4px 12px 14px;cursor:pointer}
.vcard .vname{font-weight:700}
.vcard .swap{color:var(--muted);font-size:13px;margin-left:6px}
.vcard .vedit{flex:none;width:44px;height:44px;margin-right:6px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.vcard .vedit svg{width:20px;height:20px}
details.faq{border-bottom:1px solid var(--line);padding:10px 0}
details.faq summary{font-weight:600;cursor:pointer}
details.faq p,details.faq li{color:var(--ink);font-size:15px}
/* Navigation */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--petrol);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;background:var(--amber);color:#1B1B1B;border:0;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px;max-height:88%}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel h2{margin-top:14px}
details.scan{background:var(--surface);border:1px dashed var(--petrol);border-radius:12px;padding:10px 12px;margin-top:6px}
details.scan summary{font-weight:600;color:var(--petrol);cursor:pointer}
.withstar{display:flex;gap:6px;margin-top:4px}
.withstar input{min-width:0}
.star{flex:none;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:21px;color:var(--amber);cursor:pointer}
.favs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.favs .chip{flex:none;white-space:nowrap;font-size:15px}
.favs .chip b{color:var(--amber)}
.grid-addr{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.rc{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rc .th{width:52px;height:52px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--up);cursor:pointer}
.rc .rt{flex:1;min-width:0;font-size:14px}
.rc .rt small{display:block;color:var(--muted)}
.rc .btn{padding:8px 12px}
.clip{display:inline-block;vertical-align:-2px;margin-left:6px;color:var(--muted)}
.clip svg{width:15px;height:15px}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.viewer .vb{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.viewer .vb .btn{background:#ffffff1f;color:#fff}
.viewer .vc{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center}
.viewer img{max-width:100%;height:auto;border-radius:6px;background:#fff}
.viewer iframe{width:100%;height:100%;border:0;border-radius:6px;background:#fff}
.portals{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.portals a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:7px 13px;background:var(--surface);font-weight:600;font-size:15px}
.portals a:active{background:var(--amber)}
.choose{display:grid;gap:10px;margin:14px 0 6px}
.choose button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.choose svg{width:24px;height:24px;color:var(--petrol)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
.toast.show{opacity:1}
</style>
</head>

<script>
'use strict';
const VERSION='1.17';
const FUELS=[
 {id:'e5',label:'Super E5 (95)',unit:'L',g:'Kraftstoff'},
 {id:'e10',label:'Super E10',unit:'L',g:'Kraftstoff'},

 {id:'h2',label:'Wasserstoff',unit:'kg',g:'Gas'},
 {id:'ac',label:'Strom AC (Wallbox, Säule)',unit:'kWh',g:'Strom'},
 {id:'dc',label:'Strom DC (Schnellladen)',unit:'kWh',g:'Strom'}];
const FUEL=Object.fromEntries(FUELS.map(f=>[f.id,f]));
const COUNTRIES=[['DE','Deutschland'],['AT','Österreich'],['CH','Schweiz'],['IT','Italien'],['CZ','Tschechien'],['SI','Slowenien'],['HR','Kroatien'],['FR','Frankreich'],['LU','Luxemburg'],['NL','Niederlande'],['BE','Belgien'],['PL','Polen'],['DK','Dänemark'],['XX','Anderes Land']];
const CNAME=Object.fromEntries(COUNTRIES);
const CATS=[['betriebsmittel','Betriebsmittel (Öl, AdBlue …)'],['waschwasser','Scheibenwaschwasser'],['waschstrasse','Waschstraße'],['pflege','Pflege & Polieren'],['zubehoer','Duftbaum & Kleinzubehör'],['parken','Parken'],['maut','Maut & Vignette'],['werkstatt','Werkstatt & Service'],['reifen','Reifen'],['sonstiges','Sonstiges']];
const CAT=Object.fromEntries(CATS);
const ICON={
 fuel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><path d="M6.5 7h5M14 9h2.5l2 2.5V18a1.5 1.5 0 0 1-3 0v-3H14"/></svg>',
 ev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 5 13.5h6L10 22l8-11.5h-6z"/></svg>',
 cost:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>'};

let S=blank();let REC=new Set();
const ui={tab:'verlauf',vf:'all',period:'all',tech:new Set()};
function defaultPortals(){return[
 {id:'pt-de-adac',country:'DE',name:'ADAC Spritpreise',url:'https://www.adac.de/verkehr/tanken-kraftstoff-antrieb/kraftstoffpreise/'},
 {id:'pt-de-laden',country:'DE',name:'Mehr-Tanken Ladesäulen',url:'https://www.mehr-tanken.de/ladesaeulen/'},
 {id:'pt-at-econtrol',country:'AT',name:'Spritpreisrechner',url:'https://www.spritpreisrechner.at/'},
 {id:'pt-it-mimit',country:'IT',name:'Osservaprezzi Carburanti',url:'https://carburanti.mise.gov.it/ospzSearch/zona'}]}
function blank(){return{app:'Zapfwerk',version:1,persons:[],vehicles:[],entries:[],favorites:[],portals:defaultPortals(),meta:{last:{},lastVehicle:null,lastExport:null}}}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pn=v=>{if(v==null||v==='')return null;let s=String(v).replace(/\s|€/g,'');if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:null};
const NF=d=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const f0=NF(0),f1=NF(1),f2=NF(2),f3=NF(3);
const eur=n=>f2.format(n||0)+' €';
const rnd=(n,d)=>Math.round(n*10**d)/10**d;
const fin=n=>n==null?'':String(n).replace('.',',');
const todayISO=()=>new Date().toLocaleDateString('sv-SE');
const fDate=iso=>iso?new Date(iso+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const fMonth=k=>new Date(k+'-15T12:00').toLocaleDateString('de-DE',{month:'long',year:'numeric'});
const flag=c=>!c||c==='XX'?'🌐':String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
const veh=id=>S.vehicles.find(v=>v.id===id);
const person=id=>S.persons.find(p=>p.id===id);
const total=e=>e.total!=null?e.total:(e.amount!=null&&e.unitPrice!=null?e.amount*e.unitPrice:0);
const unitP=e=>e.unitPrice!=null?e.unitPrice:(e.total!=null&&e.amount?e.total/e.amount:null);
const chron=(a,b)=>a.date.localeCompare(b.date)||((a.odometer??0)-(b.odometer??0))||((a.created||0)-(b.created||0));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function trend(p){if(p==null||!isFinite(p))return'';if(Math.abs(p)<0.05)return'<span class="pill d eq" title="gleich wie zuletzt">= ±0 %</span>';
 return`<span class="pill d ${p>0?'up':'down'}" title="${p>0?'höher':'niedriger'} als beim letzten Volltanken"><span class="ar">${p>0?'▲':'▼'}</span>${f1.format(Math.abs(p))} %</span>`}
function bestIds(D,ids){const best={};for(const e of S.entries){if(ids&&!ids.has(e.id))continue;const d=D.get(e.id);if(!d||d.cons==null)continue;const k=e.vehicleId+'|'+d.unit;const n=best[k]?best[k].n+1:1;if(!best[k]||d.cons<best[k].c)best[k]={c:d.cons,e,d,n};else best[k].n=n}for(const k in best)if(best[k].n<2)delete best[k];return best}
function delta(p){if(p==null||!isFinite(p))return'';if(Math.abs(p)<0.05)return'<span class="d eq">±0 %</span>';return`<span class="d ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${f1.format(Math.abs(p))} %</span>`}
const plateLine=v=>v&&v.plate?`<span class="pl"><span class="plate">${esc(v.plate)}</span></span>`:'';
function vName(v){return v?esc(v.name)+plateLine(v):'–'}
function vText(v){return v?(v.name+(v.plate?' ('+v.plate+')':'')):'–'}

/* ---------- Speicher (IndexedDB) ---------- */
const DBN='zapfwerk',ST='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(ST).objectStore(ST).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function save(){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(JSON.parse(JSON.stringify(S)),'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){toast('Speichern fehlgeschlagen – bitte Sicherung exportieren.')}}
async function kvGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite');v==null?tx.objectStore(ST).delete(k):tx.objectStore(ST).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}}
let BG=null;
function applyBg(){$('#bgimg').style.backgroundImage=BG?`url("${BG}")`:'';document.body.classList.toggle('has-bg',!!BG)}
function shrinkImage(file,max=1600,qual=.82){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',qual))};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild konnte nicht gelesen werden'))};img.src=url})}

function normalize(d){const b=blank();if(!d||typeof d!=='object')return b;return{...b,...d,persons:Array.isArray(d.persons)?d.persons:[],vehicles:Array.isArray(d.vehicles)?d.vehicles:[],entries:Array.isArray(d.entries)?d.entries:[],favorites:Array.isArray(d.favorites)?d.favorites:[],portals:Array.isArray(d.portals)?d.portals:defaultPortals(),meta:{...b.meta,...(d.meta||{}),last:(d.meta&&d.meta.last)||{}}}}

/* ---------- Berechnungen ---------- */
function deriveAll(){
 const map=new Map();
 for(const v of S.vehicles){
  const list=S.entries.filter(e=>e.vehicleId===v.id&&e.type==='fuel').sort(chron);
  let prevOdo=null;const lastFull={},acc={},lastCons={},lastPrice={};
  for(const e of list){
   const u=(FUEL[e.fuel]||{}).unit||'L';
   let odo=e.odometer??null,trip=e.tripKm??null;
   if(odo==null&&trip!=null&&prevOdo!=null)odo=prevOdo+trip;
   if(trip==null&&odo!=null&&prevOdo!=null)trip=odo-prevOdo;
   if(trip!=null&&trip<0)trip=null;
   acc[u]=(acc[u]||0)+(e.amount||0);
   const d={odo,trip,unit:u,cons:null,consDelta:null,consAmt:0,consKm:0,up:unitP(e),pDelta:null};
   if(e.full){
    if(lastFull[u]!=null&&odo!=null&&odo>lastFull[u]&&acc[u]>0){
     d.consKm=odo-lastFull[u];d.consAmt=acc[u];d.cons=d.consAmt/d.consKm*100;
     if(lastCons[u]!=null)d.consDelta=(d.cons/lastCons[u]-1)*100;lastCons[u]=d.cons}
    lastFull[u]=odo;acc[u]=0}
   if(d.up!=null){if(lastPrice[e.fuel]!=null)d.pDelta=(d.up/lastPrice[e.fuel]-1)*100;lastPrice[e.fuel]=d.up}
   if(odo!=null)prevOdo=odo;
   map.set(e.id,d)}}
 return map}
function lastOdoFor(vid,date,exceptId){
 const D=deriveAll();let best=null;
 S.entries.filter(e=>e.vehicleId===vid&&e.type==='fuel'&&e.id!==exceptId&&e.date<=date).sort(chron).forEach(e=>{const d=D.get(e.id);if(d&&d.odo!=null)best=d.odo});
 return best}
function inPeriod(date){const p=ui.period,y=new Date().getFullYear();
 if(p==='y')return date.startsWith(String(y));if(p==='py')return date.startsWith(String(y-1));
 if(p==='12m'){const d=new Date();d.setFullYear(d.getFullYear()-1);return date>=d.toLocaleDateString('sv-SE')}return true}
function stats(list,D){
 const s={fuel:0,other:0,km:0,cons:{},cats:{}};
 for(const e of list){const t=total(e);
  if(e.type==='fuel'){s.fuel+=t;const d=D.get(e.id);if(d&&d.trip)s.km+=d.trip;
   if(d&&d.consKm){(s.cons[d.unit]=s.cons[d.unit]||{a:0,k:0});s.cons[d.unit].a+=d.consAmt;s.cons[d.unit].k+=d.consKm}
   const k='fuel:'+e.fuel;s.cats[k]=(s.cats[k]||0)+t}
  else{s.other+=t;s.cats[e.category]=(s.cats[e.category]||0)+t}}
 s.total=s.fuel+s.other;return s}

const tag=(t,inner,right,pad)=>`<section class="tag"><div class="tag-h">${t}${right?`<span class="tag-r">${right}</span>`:''}</div><div class="tag-b${pad?' pad':''}">${inner}</div></section>`;

const isoD=d=>d.toLocaleDateString('sv-SE');
function annivOn(base,year){const [y,m,d]=base.split('-').map(Number);let dd=d;if(m===2&&d===29&&!(year%4===0&&(year%100!==0||year%400===0)))dd=28;return new Date(year,m-1,dd,12)}
const NUMW=['','Ein','Zwei','Drei','Vier','Fünf','Sechs','Sieben','Acht','Neun','Zehn'];
function jubiIntro(n,name){
 if(n===1)return'Das erste Jahr voller Kurven – willkommen in der Familie!';
 if(n===3)return'Drei Jahre voller Kurven – längst eingefahren.';
 if(n===5)return'Fünf Jahre Kurven, Kreisel und Grenzübergänge.';
 if(n===10)return`Zehn Jahre voller Kurven – ein Jahrzehnt ${name}!`;
 if(n>10&&n%5===0)return`${n} Jahre voller Kurven – ein echter Klassiker!`;
 return null}
function jubiStats(v,from,to){
 const D=deriveAll();let km=0;const amt={},ck={},ca={};
 for(const e of S.entries){if(e.vehicleId!==v.id||e.type!=='fuel'||e.date<from||e.date>=to)continue;const d=D.get(e.id)||{};const u=d.unit||'L';
  if(d.trip)km+=d.trip;amt[u]=(amt[u]||0)+(e.amount||0);if(d.consKm){ck[u]=(ck[u]||0)+d.consKm;ca[u]=(ca[u]||0)+d.consAmt}}
 const pref=(FUEL[v.fuel]||{}).unit;const units=Object.keys(amt);if(!units.length&&!km)return null;
 const u=amt[pref]?pref:units.sort((a,b)=>amt[b]-amt[a])[0];
 const N='\u00a0',parts=[];if(km)parts.push(f0.format(km)+N+'km');if(u&&amt[u])parts.push(f0.format(amt[u])+N+(u==='L'?'Liter':u));if(u&&ck[u])parts.push('Ø'+N+f1.format(ca[u]/ck[u]*100)+N+u+'/100'+N+'km');
 return parts.length?parts.join(', '):null}
function jubilees(){
 const today=new Date();today.setHours(12,0,0,0);const out=[];
 for(const v of S.vehicles){if(v.archived)continue;const base=v.regDate||v.firstReg;if(!base)continue;
  let a=annivOn(base,today.getFullYear());if(a>today)a=annivOn(base,today.getFullYear()-1);
  const n=a.getFullYear()-Number(base.slice(0,4));const age=Math.round((today-a)/864e5);
  const key=isoD(a);if(n<1||age>6||(S.meta.jubi||{})[v.id]===key)continue;
  const name=v.alias||v.name;const stats=jubiStats(v,isoD(annivOn(base,a.getFullYear()-1)),key);const intro=jubiIntro(n,name);
  let text;if(intro)text=intro+' '+(stats?stats.charAt(0).toUpperCase()+stats.slice(1)+'.':'Die Zahlen schreiben wir ab jetzt mit.');
  else text='Ein Jahr voller Kurven – '+(stats?stats+'.':'die Zahlen schreiben wir ab jetzt mit.');
  out.push({v,key,n,name,text,day:age===0?'Heute ist Zulassungstag!':'Zulassungstag war am '+fDate(key)+'.'})}
 return out}
function jubiBlock(){return jubilees().map(j=>`<section class="tag jubi"><div class="tag-h">★ ${j.n} ${j.n===1?'Jahr':'Jahre'} ${esc(j.name)}</div><div class="tag-b"><p class="jt">${esc(j.text)}</p><p class="js">${j.day}</p><button class="btn primary wide" onclick="jubiDone('${j.v.id}','${j.key}')">Danke!</button></div></section>`).join('')}
function jubiDone(id,key){S.meta.jubi=S.meta.jubi||{};S.meta.jubi[id]=key;save();render()}
function sparkle(){document.querySelectorAll('.jubi').forEach(el=>{if(el.dataset.sp)return;el.dataset.sp=1;
 for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent='★';s.style.left=(6+Math.random()*88)+'%';s.style.top=(30+Math.random()*55)+'%';s.style.animationDelay=(i*0.12)+'s';el.appendChild(s);setTimeout(()=>s.remove(),3000)}})}
function viewVerlauf(){

  return tag(esc(fMonth(k)),g.map(e=>row(e,D)).join(''),eur(g.reduce((a,e)=>a+total(e),0)))}).join('')}
function row(e,D){

 const sub=`<span>${fDate(e.date)}</span><span>${flag(e.country)} ${where||esc(CNAME[e.country]||'')}</span>${multi&&v?`<span>${esc(v.plate||v.name)}</span>`:''}`;
 if(e.type==='fuel'){const f=FUEL[e.fuel]||{label:'?',unit:'L'};const d=D.get(e.id)||{};const ev=f.unit==='kWh';
  const meta=[e.amount!=null?`<span>${f2.format(e.amount)} ${f.unit}${e.full?'':' (Teil)'}</span>`:'',

 return`<button class="entry" onclick="editEntry('${e.id}')"><span class="ico cost">${ICON.cost}</span><span><div class="e-title">${esc(CAT[e.category]||'Kosten')}${e.receipt?`<span class="clip" title="Beleg angehängt">${CLIP}</span>`:''}</div><div class="e-sub">${e.station?`<span>${esc(e.station)}</span>`:''}${sub}</div>${e.note?`<div class="e-sub">${esc(e.note)}</div>`:''}</span><span class="e-sum">${eur(total(e))}</span></button>`}

function digits(str,cls){return`<div class="${cls}">`+[...str].map(c=>/\d/.test(c)?`<span class="dg">${c}</span>`:`<span class="dg sep">${esc(c)}</span>`).join('')+'</div>'}
function viewAuswertung(){

 const D=deriveAll();const list=filtered().filter(e=>inPeriod(e.date));const s=stats(list,D);
 const P=[['all','Gesamt'],['y','Dieses Jahr'],['py','Vorjahr'],['12m','Letzte 12 Monate']];
 let h=`<div class="seg">${P.map(([k,l])=>`<button aria-pressed="${ui.period===k}" onclick="ui.period='${k}';render()">${l}</button>`).join('')}</div>`;

 const cons=Object.entries(s.cons);
 h+=tag('Tanken und Laden',`<div class="row"><span class="k">Kraftstoff & Strom</span><span class="v">${eur(s.fuel)}</span></div><div class="row"><span class="k">Sonstige Kosten</span><span class="v">${eur(s.other)}</span></div>`+cons.map(([u,c])=>`<div class="row"><span class="k">Ø Verbrauch<small>Volltank-Methode, ${f0.format(c.k)} km gewertet</small></span><span class="v">${f1.format(c.a/c.k*100)} ${u}/100 km</span></div>`).join(''));
 const B=Object.values(bestIds(D,new Set(list.map(e=>e.id))));
 if(B.length)h+=tag('★ Bestwerte',B.map(b=>{const v=veh(b.e.vehicleId);const unitL=b.d.unit;const avg=s.cons[unitL];
  return`<div class="row"><span class="k">${v?esc(v.alias||v.name):'–'}${plateLine(v)}<small>${fDate(b.e.date)}${b.e.station?' – '+esc(b.e.station):''}${b.e.country?' '+flag(b.e.country):''}</small></span><span class="v"><span class="rec">★ ${f1.format(b.c)} ${unitL}/100 km</span></span></div>`}).join(''));
 if(ui.vf==='all'&&S.vehicles.length>1){
  h+=tag('Nach Fahrzeug',S.vehicles.map(v=>{const st=stats(list.filter(e=>e.vehicleId===v.id),D);if(!st.total)return'';const p=person(v.personId);
   return`<div class="row"><span class="k">${vName(v)}<small>${p?esc(p.name)+' – ':''}Tanken ${eur(st.fuel)}, Sonstiges ${eur(st.other)}</small></span><span class="v">${eur(st.total)}</span></div>`}).join(''));
  if(S.persons.length){const rows=[...S.persons,{id:null,name:'Ohne Person'}].map(p=>{const ids=S.vehicles.filter(v=>(v.personId||null)===p.id).map(v=>v.id);const st=stats(list.filter(e=>ids.includes(e.vehicleId)),D);return st.total?`<div class="row"><span class="k">${esc(p.name)}</span><span class="v">${eur(st.total)}</span></div>`:''}).join('');
   if(rows)h+=tag('Nach Person',rows)}}
 const cats=Object.entries(s.cats).sort((a,b)=>b[1]-a[1]);const max=cats.length?cats[0][1]:1;
 if(cats.length)h+=tag('Nach Art',cats.map(([k,val])=>{const isF=k.startsWith('fuel:');const f=isF?FUEL[k.slice(5)]:null;
  return`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(isF?(f?f.label:'Kraftstoff'):(CAT[k]||k))}</span><span class="v">${eur(val)}</span></div><div class="bar ${isF?(f&&f.unit==='kWh'?'ev':''):'cost'}" style="width:${Math.max(2,val/max*100)}%"></div></div>`}).join(''));
 return h}

const HELP=`
<details class="faq"><summary>Zapfwerk als App auf den Home-Bildschirm legen</summary><p>In Safari die Seite öffnen, auf „Teilen“ tippen und „Zum Home-Bildschirm“ wählen. Zapfwerk startet dann wie eine App ohne Browserleiste. Auf dem Mac: Safari › Ablage › Zum Dock hinzufügen.</p></details>
<details class="faq"><summary>Wo liegen meine Daten?</summary><p>Nur lokal auf dem jeweiligen Gerät (im Speicher des Browsers bzw. der Home-Bildschirm-App). Es gibt keinen Server und kein Konto. Zwischen iPhone, iPad und Mac wird nicht automatisch abgeglichen – dafür gibt es die Sicherung.</p></details>
<details class="faq"><summary>Daten auf ein anderes Gerät bringen</summary><p>„Sicherung exportieren“ erzeugt eine Datei <em>zapfwerk-backup-Datum.json</em>. Auf iPhone und iPad öffnet sich das Teilen-Menü – dort „In Dateien sichern“ und den iCloud-Ordner wählen. Auf dem anderen Gerät „Sicherung importieren“ und die Datei auswählen. Achtung: Der Import ersetzt alle Daten auf diesem Gerät. Angehängte Belege sind in der Sicherung enthalten.</p></details>
<details class="faq"><summary>Ältere Aufzeichnungen per CSV übernehmen</summary><p>Unter „Mehr“ › „CSV-Import“ die Vorlage herunterladen und in Numbers oder Excel öffnen. Eine Zeile pro Tankstopp oder Ausgabe. Die Beispielzeilen löschen oder einfach stehen lassen – Zeilen mit „Beispielzeile“ in der Notiz werden beim Import ignoriert. Danach als CSV exportieren (Numbers: Ablage › Exportieren › CSV) und mit „CSV importieren“ einlesen. Schreibt Numbers den Tabellennamen als erste Zeile mit hinein, ist das kein Problem – Zapfwerk sucht die Überschriften selbst. Vor dem Hinzufügen zeigt Zapfwerk, was erkannt wurde.</p>
<ul><li><strong>Typ:</strong> Tanken oder Kosten</li><li><strong>Datum:</strong> TT.MM.JJJJ</li><li><strong>Fahrzeug:</strong> Kennzeichen, Spitzname oder Bezeichnung – das Fahrzeug muss in Zapfwerk angelegt sein</li><li><strong>Energie oder Art:</strong> beim Tanken z. B. Super E5, E10, Super Plus, Diesel, HVO, LPG, CNG, Strom AC, Strom DC; bei Kosten z. B. Waschstraße, Öl, AdBlue, Vignette, Parken, Werkstatt, Reifen</li><li><strong>Menge, Preis je Einheit, Betrag:</strong> mit Komma, zwei der drei genügen</li><li><strong>Vollgetankt:</strong> ja oder nein (leer = ja)</li><li><strong>Kilometerstand oder Tageskilometer:</strong> einer genügt</li><li><strong>Land:</strong> DE, AT, CH … oder ausgeschrieben</li></ul>
<p>Die Einträge werden zu den vorhandenen hinzugefügt. Zeilen mit gleichem Fahrzeug, Datum, Typ und Betrag gelten als doppelt und werden übersprungen – ein versehentlich zweimal importierter Stapel richtet also keinen Schaden an. Tipp: Vor dem ersten Import trotzdem eine Sicherung exportieren.</p></details>
<details class="faq"><summary>Kassenbeleg scannen</summary><p>Im Formular „Kassenbeleg übernehmen“ aufklappen und ins Textfeld tippen. Auf dem iPhone erscheint „Text scannen“ (Symbol mit Rahmen über der Tastatur oder nach erneutem Tippen ins Feld). Kamera auf den Beleg halten und „Einsetzen“ tippen. Alternativ ein Foto des Belegs in der Fotos-App öffnen, Text gedrückt halten, „Alle auswählen“, kopieren und einfügen.</p><p>„Felder übernehmen“ sucht dann Datum, Menge, Preis je Einheit, Betrag, Kraftstoff, Tankstelle, Adresse (Ort, Straße, PLZ) und Land (z. B. an der UID-Nummer „ATU…“). Die Texterkennung passiert auf dem Gerät, nichts wird hochgeladen. Belege sind sehr unterschiedlich aufgebaut – bitte die übernommenen Werte kurz prüfen.</p></details>
<details class="faq"><summary>Beleg anhängen (Foto oder PDF)</summary><p>Unten im Formular „Beleg anhängen“ tippen. Auf dem iPhone kannst du direkt ein Foto machen, eins aus der Fotos-App wählen oder ein PDF aus „Dateien“ nehmen. Fotos werden automatisch verkleinert, bleiben aber gut lesbar. Einträge mit Beleg tragen im Verlauf eine Büroklammer.</p><p>Ein Tipp auf das Vorschaubild öffnet den Beleg in voller Größe; über „Teilen / Sichern“ lässt er sich weitergeben, drucken oder in „Dateien“ ablegen. Mit „Entfernen“ und „Speichern“ wird er wieder gelöst.</p><p>Belege sind Teil der Sicherung und kommen so auf das andere Gerät. Dadurch wird die Sicherungsdatei größer – pro Foto grob 150 bis 300 KB.</p></details>
<details class="faq"><summary>Günstige Tankstelle finden</summary><p>Beim gelben + gibt es unter „Preise vergleichen“ Knöpfe für Preisportale je Land. Ein Tipp öffnet das Portal in Safari; dort Standort und Sorte wählen. Vorbelegt sind der ADAC (Deutschland, amtliche Daten der Markttransparenzstelle), Mehr-Tanken Ladesäulen (Ladetarife für E-Autos), der Spritpreisrechner der E-Control (Österreich) und das Osservaprezzi des italienischen Ministeriums.</p><p>Unter „Mehr“ › „Preisportale“ lassen sich Portale ändern, löschen oder neu anlegen – mit Land, Name und Internetadresse. Die Portale sind Teil der Sicherung. Zapfwerk übergibt keinen Standort an das Portal und übernimmt keine Preise automatisch.</p></details>
<details class="faq"><summary>Adresse eingeben</summary><p>Alles in eine Zeile, durch Kommas getrennt, z. B. „Kufstein, Hauptstraße 5, 6330“. Zapfwerk speichert Ort, Straße und PLZ getrennt; unter dem Feld steht, wie es aufgeteilt wurde. Die Reihenfolge ist egal: Die PLZ erkennt die App an den Ziffern, die Straße an der Hausnummer. Der Belegscan füllt die Adresse mit aus.</p></details>
<details class="faq"><summary>Favoriten</summary><p>Tankstelle bzw. Anbieter und Adresse eintragen und auf den Stern ☆ daneben tippen. Der Favorit erscheint dann oben im Formular als Schnellwahl; ein Tipp füllt Anbieter, Adresse und Land aus. Die häufigsten stehen vorne. Zum Entfernen den Favoriten auswählen und auf den gefüllten Stern ★ tippen. Favoriten gibt es bei Tankstopps und sonstigen Kosten gemeinsam und sie sind Teil der Sicherung.</p></details>
<details class="faq"><summary>Menge, Preis und Betrag</summary><p>Zwei der drei Felder genügen – das dritte wird beim Verlassen des Feldes berechnet.</p></details>
<details class="faq"><summary>Kilometerstand und Tageskilometer</summary><p>Ein Wert genügt. Ist nur der Kilometerstand eingetragen, ergeben sich die Tageskilometer aus dem letzten erfassten Stand des Fahrzeugs. Sind nur Tageskilometer eingetragen, wird der Kilometerstand fortgeschrieben. Unter den Feldern steht jeweils der letzte bekannte Stand.</p></details>
<details class="faq"><summary>Wie wird der Verbrauch berechnet?</summary><p>Nach der Volltank-Methode: Verbrauch = getankte Menge seit dem letzten Volltanken ÷ gefahrene km × 100. Teilbetankungen (Haken „Vollgetankt“ entfernen) werden zur nächsten Volltankung dazugezählt. Beim E-Auto gilt „bis zum gewohnten Ladestand“ (z. B. immer 80 %) als voll. Die Prozentangabe vergleicht mit dem vorherigen Verbrauchswert bzw. Preis desselben Kraftstoffs: ▲ rot = höher, ▼ grün = niedriger. Beim Verbrauch steht der Vergleich als gerahmtes Abzeichen.</p><p><strong>★ Bestwert:</strong> Der niedrigste Verbrauch eines Fahrzeugs bekommt im Verlauf ein gelbes Abzeichen „★ Bestwert“ (getrennt nach Liter und kWh). Die Auswertung zeigt im Schild „Bestwerte“ den besten Wert je Fahrzeug im gewählten Zeitraum, mit Datum und Tankstelle. Wird ein besserer Wert gefahren, wandert das Abzeichen mit. Ein Bestwert gibt es erst ab zwei Verbrauchswerten – vorher gibt es nichts zu schlagen.</p><p>Bei Plug-in-Hybriden werden Liter und kWh getrennt gerechnet; die Werte sind dort nur grobe Richtwerte.</p></details>
<details class="faq"><summary>Währung</summary><p>Alle Beträge werden in Euro geführt. Bei Belegen in Franken oder Kronen bitte den Euro-Betrag laut Kartenabrechnung eintragen.</p></details>
<details class="faq"><summary>Spitzname fürs Fahrzeug</summary><p>Im Fahrzeug kann zusätzlich zur Bezeichnung ein Spitzname eingetragen werden. In der Fahrzeugliste steht dann der Spitzname (erkennbar am ⇄). Ein Tipp auf das Fahrzeug wechselt zur Bezeichnung, ein weiterer Tipp zurück; das Kennzeichen bleibt immer gleich. Bearbeiten geht über den Stift rechts. Beim Neustart der App wird wieder der Spitzname gezeigt.</p></details>
<details class="faq"><summary>Fahrzeugdaten (HSN, TSN, FIN …)</summary><p>Im Fahrzeug unter „Fahrzeugdaten“ lassen sich Herstellerschlüssel (HSN, Feld 2.1 im Fahrzeugschein), Typschlüssel (TSN, Feld 2.2), Leistung in kW (Feld P.2), Erstzulassung (Feld B), Datum der Zulassung auf euch (Feld I) und die Fahrzeug-Identifizierungsnummer (FIN, Feld E) hinterlegen – praktisch beim Teilekauf, in der Werkstatt oder für Versicherungsangebote. Die PS werden aus den kW umgerechnet. Bei der FIN prüft Zapfwerk die Länge (17 Zeichen) und warnt bei I, O oder Q, die in einer FIN nie vorkommen. Alle Angaben sind freiwillig. Tipp: Mit „Text scannen“ lassen sich die Nummern direkt vom Fahrzeugschein übernehmen.</p></details>
<details class="faq"><summary>Hintergrundbild</summary><p>Unter „Mehr“ › „Hintergrundbild“ ein Foto auswählen. Es erscheint nur im Hellmodus hinter den Schildern; im Dunkelmodus bleibt der dunkle Hintergrund. Das Bild wird verkleinert und nur auf diesem Gerät gespeichert – es ist nicht Teil der JSON-Sicherung, damit die Datei klein bleibt. Auf jedem Gerät kann also ein anderes Bild stehen. Ruhige, helle Motive wirken am besten.</p></details>
<details class="faq"><summary>Jahrestag der Zulassung</summary><p>Am Jahrestag der Zulassung erscheint oben im Verlauf ein Jubiläums-Schild mit kurzem Funkeln. Grundlage ist das Datum „Zugelassen auf uns seit“ (Feld I im Fahrzeugschein) – bei einem Gebrauchten ist das der Tag, an dem das Auto zu euch kam. Ist es nicht eingetragen, nimmt Zapfwerk die Erstzulassung (Feld B).</p><p>Die Zahlen (km, getankte Menge, Ø Verbrauch) stammen aus den zwölf Monaten vor dem Jahrestag, soweit sie in Zapfwerk erfasst sind. Im 1., 3., 5. und 10. Jahr sowie danach alle fünf Jahre gibt es einen eigenen Text. Das Schild bleibt eine Woche stehen, falls die App am Tag selbst nicht geöffnet wird, und verschwindet mit „Danke!“. Eine Mitteilung bei geschlossener App ist bei einer Web-App nicht möglich.</p></details>
<details class="faq"><summary>Fahrzeug verkauft</summary><p>Im Fahrzeug „Stillgelegt“ anhaken. Es verschwindet aus der Auswahl beim Erfassen, die Einträge bleiben in der Auswertung erhalten. Löschen geht nur, solange keine Einträge vorhanden sind.</p></details>
<details class="faq"><summary>Änderungen</summary><ul><li><strong>1.17</strong> – CSV-Import: Titelzeilen vor den Spaltenüberschriften (z. B. der Tabellenname aus Numbers) werden übersprungen.</li><li><strong>1.16</strong> – Preise vergleichen: Preisportale je Land beim gelben + (vorbelegt: ADAC, Mehr-Tanken Ladesäulen, E-Control-Spritpreisrechner, Osservaprezzi Italien), unter „Mehr“ frei änderbar.</li><li><strong>1.15</strong> – Beleg anhängen: Foto oder PDF der Quittung am Tankstopp oder an sonstigen Kosten, Büroklammer im Verlauf, Ansicht in voller Größe, Belege in der Sicherung enthalten.</li><li><strong>1.14</strong> – CSV-Import für ältere Aufzeichnungen mit herunterladbarer Vorlage, Vorschau vor dem Hinzufügen und Schutz vor doppelten Einträgen.</li><li><strong>1.13</strong> – Jahrestag der Zulassung: neues Feld „Zugelassen auf uns seit (Feld I)“, Jubiläums-Schild mit Funkeln und den Zahlen des letzten Jahres im Verlauf.</li><li><strong>1.12</strong> – Personen wie Fahrzeuge: eigene Liste mit zugeordneten Fahrzeugen und Stift zum Bearbeiten, darunter der Knopf „Person hinzufügen“.</li><li><strong>1.11</strong> – Kennzeichen steht in der Fahrzeugliste und der Auswertung jetzt in einer eigenen, leicht eingerückten Zeile unter dem Namen.</li><li><strong>1.10</strong> – Kachel „Kosten gesamt“: Gesamtkosten und Kosten je km rechtsbündig wie an der Zapfsäule, gefahrene km bleiben links.</li><li><strong>1.9</strong> – Eigenes Hintergrundbild im Hellmodus (unter „Mehr“), wird nur auf dem Gerät gespeichert.</li><li><strong>1.8</strong> – Slogan „Jeder Tropfen auf der Liste.“ unter dem Namen; das Zählwerk der Gesamtkosten in sanfterem Espressobraun statt Schwarz.</li><li><strong>1.7</strong> – Verbrauchstrend als Abzeichen (▲ höher / ▼ niedriger als beim letzten Volltanken); ★ Bestwert für den niedrigsten Verbrauch je Fahrzeug im Verlauf und neues Schild „Bestwerte“ in der Auswertung.</li><li><strong>1.6</strong> – Preisschild-Look in allen Ansichten: Verlauf (je Monat ein Schild mit Monatssumme), Fahrzeuge, Personen, Sicherung und Hilfe.</li><li><strong>1.5</strong> – Auswertung im Preisschild-Look: Jeder Bereich (Tanken und Laden, nach Fahrzeug, Person und Art) steht in einem eigenen gerahmten Schild.</li><li><strong>1.4</strong> – Fahrzeugdaten: HSN, TSN, Leistung (kW mit PS-Umrechnung), Erstzulassung und FIN mit Plausibilitätsprüfung.</li><li><strong>1.3</strong> – Spitzname fürs Fahrzeug; in der Fahrzeugliste per Tipp zwischen Spitzname und Bezeichnung wechseln. Fahrzeug bearbeiten jetzt über den Stift rechts.</li><li><strong>1.2</strong> – Adresse in einer Zeile (Ort, Straße, PLZ mit Komma getrennt, wird getrennt gespeichert); Favoriten für Tankstellen und Anbieter mit Schnellwahl; Belegscan übernimmt auch Straße und PLZ. Im Formular stehen Land und Tankstelle jetzt nebeneinander, die Adresse hat die volle Breite.</li><li><strong>1.1</strong> – Neues App-Icon im 70er-Stil, auch oben neben dem Namen. Damit das Icon auf dem Home-Bildschirm erscheint, Zapfwerk dort einmal entfernen und neu hinzufügen – die Daten bleiben nur erhalten, wenn vorher eine Sicherung exportiert wurde.</li><li><strong>1.0</strong> – Erste Version: Tankstopps (Kraftstoff, Gas, Strom), sonstige Kosten, mehrere Fahrzeuge mit Kennzeichen und Person, Länderwahl, Kilometer-Automatik, Verbrauch mit Veränderung in %, Auswertung nach Fahrzeug, Person und Art, Belegübernahme per Texterkennung, JSON-Sicherung.</li></ul></details>`;

/* ---------- Sheet ---------- */
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').hidden=false;document.body.style.overflow='hidden';$('#panel').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet)}
function closeSheet(){$('#sheet').hidden=true;$('#panel').innerHTML='';document.body.style.overflow=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function actions(del){return`<div class="actions">${del?'<button type="button" class="btn danger" id="del">Löschen</button>':''}<span class="sp"></span><button type="button" class="btn secondary" data-close>Abbrechen</button><button class="btn primary">Speichern</button></div>`}
function vehicleOptions(sel){const list=S.vehicles.filter(v=>!v.archived||v.id===sel);return list.map(v=>`<option value="${v.id}"${v.id===sel?' selected':''}>${esc(vText(v))}</option>`).join('')}
function countryOptions(sel){return COUNTRIES.map(([c,n])=>`<option value="${c}"${c===sel?' selected':''}>${flag(c)} ${n}</option>`).join('')}
function fuelOptions(sel){return['Kraftstoff','Gas','Strom'].map(g=>`<optgroup label="${g}">${FUELS.filter(f=>f.g===g).map(f=>`<option value="${f.id}"${f.id===sel?' selected':''}>${f.label}</option>`).join('')}</optgroup>`).join('')}
function scanBox(){return`<details class="scan"><summary>Kassenbeleg übernehmen</summary><p class="hint">Ins Feld tippen und „Text scannen“ wählen – oder kopierten Belegtext einfügen.</p><textarea name="receipt" rows="4" placeholder="Belegtext"></textarea><button type="button" class="btn secondary wide" id="parse">Felder übernehmen</button><p class="hint" id="parseInfo"></p></details>`}

function chooseNew(){
 if(!S.vehicles.some(v=>!v.archived)){go('fahrzeuge');toast('Bitte zuerst ein Fahrzeug anlegen.');return}
 openSheet(`<h2>Neuer Eintrag</h2><div class="choose"><button onclick="fuelForm()">${ICON.fuel} Tanken oder Laden</button><button onclick="costForm()">${ICON.cost} Sonstige Kosten</button></div>${portalRow()}<div class="actions"><span class="sp"></span><button type="button" class="btn secondary" data-close>Abbrechen</button></div>`)}
function editEntry(id){const e=S.entries.find(x=>x.id===id);if(!e)return;e.type==='fuel'?fuelForm(e):costForm(e)}
function defaultVehicle(){const act=S.vehicles.filter(v=>!v.archived);if(ui.vf!=='all'&&act.some(v=>v.id===ui.vf))return ui.vf;if(act.some(v=>v.id===S.meta.lastVehicle))return S.meta.lastVehicle;return act[0]&&act[0].id}

/* ---------- Adresse & Favoriten ---------- */
const joinAddr=e=>[e.place,e.street,e.zip].filter(Boolean).join(', ');
function splitAddr(s){
 const r={place:'',street:'',zip:''},rest=[];
 String(s||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>{
  let m=t.match(/^(?:[A-Z]{1,2}-)?(\d{4,5})$/);if(m&&!r.zip){r.zip=m[1];return}
  m=t.match(/^(?:[A-Z]{1,2}-)?(\d{4,5})\s+(\D.*)$/);if(m&&!r.zip){r.zip=m[1];r.place?rest.push(m[2]):r.place=m[2];return}
  if(!r.street&&(/\d/.test(t)||/(straße|strasse|str\.?|gasse|weg|platz|allee)(\s|\d|$)/i.test(t))){r.street=t;return}
  rest.push(t)});
 for(const t of rest){if(!r.place)r.place=t;else if(!r.street)r.street=t;else r.place+=', '+t}
 return r}
const favKey=(st,pl)=>(st||'').trim().toLowerCase()+'|'+(pl||'').trim().toLowerCase();
const findFav=(st,pl)=>st?S.favorites.find(x=>favKey(x.station,x.place)===favKey(st,pl)):null;
function placeFields(e,label){return`<div class="grid-addr"><label>Land<select name="country">${countryOptions(e.country)}</select></label><label>${label}<span class="withstar"><input name="station" value="${esc(e.station)}"><button type="button" class="star" id="star">☆</button></span></label></div>
 <label>Adresse<input name="address" value="${esc(joinAddr(e))}" placeholder="Ort, Straße, PLZ"></label>
 <p class="hint" id="addrHint"></p>`}
function wirePlace(f){
 const star=$('#star');
 const cur=()=>({station:f.station.value.trim(),...splitAddr(f.address.value),country:f.country.value});
 const upd=()=>{const c=cur(),fv=findFav(c.station,c.place);
  star.textContent=fv?'★':'☆';star.setAttribute('aria-pressed',String(!!fv));star.setAttribute('aria-label',fv?'Favorit entfernen':'Als Favorit merken');
  $('#addrHint').textContent=f.address.value.trim()?[c.place&&'Ort: '+c.place,c.street&&'Straße: '+c.street,c.zip&&'PLZ: '+c.zip].filter(Boolean).join(' / '):''};
 const chips=()=>{const l=S.favorites.slice().sort((a,b)=>(b.uses||0)-(a.uses||0));const box=$('#favBox');
  box.className=l.length?'favs':'';box.setAttribute('aria-label','Favoriten');
  box.innerHTML=l.map(x=>`<button type="button" class="chip" data-fav="${x.id}"><b>★</b> ${esc(x.station)}${x.place?' '+esc(x.place):''}</button>`).join('');
  box.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const x=S.favorites.find(y=>y.id===b.dataset.fav);if(!x)return;
   f.station.value=x.station;f.address.value=joinAddr(x);if(x.country)f.country.value=x.country;upd()})};
 star.onclick=()=>{const c=cur(),fv=findFav(c.station,c.place);
  if(fv){if(!confirm(`„${fv.station}${fv.place?' '+fv.place:''}“ aus den Favoriten entfernen?`))return;S.favorites=S.favorites.filter(x=>x!==fv);toast('Favorit entfernt')}
  else{if(!c.station)return toast('Bitte zuerst Tankstelle bzw. Anbieter eintragen.');S.favorites.push({id:uid(),...c,uses:0});toast('Als Favorit gemerkt')}
  save();chips();upd()};
 ['station','address'].forEach(n=>f[n].addEventListener('input',upd));f.country.addEventListener('change',upd);
 chips();upd();
 return{
  apply(r){if(r.station)f.station.value=r.station;if(r.country)f.country.value=r.country;if(r.place||r.street||r.zip)f.address.value=joinAddr(r);upd()},
  read(){return splitAddr(f.address.value)},
  used(o){const fv=findFav(o.station,o.place);if(fv)fv.uses=(fv.uses||0)+1}}}

/* ---------- Beleg anhängen ---------- */
const CLIP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>';
const kb=n=>n>=1048576?f1.format(n/1048576)+' MB':f0.format(Math.max(1,n/1024))+' KB';
async function kvKeys(prefix){try{const db=await idb();return await new Promise(res=>{const q=db.transaction(ST).objectStore(ST).getAllKeys();q.onsuccess=()=>res(q.result.filter(k=>String(k).startsWith(prefix)));q.onerror=()=>res([])})}catch(e){return[]}}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function dataToFile(data,name){const [h,b]=data.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:mime})}
function rcName(e,meta){const v=veh(e.vehicleId);return`beleg-${e.date||todayISO()}-${(v&&(v.plate||v.name)||'fahrzeug').replace(/[^A-Za-z0-9ÄÖÜäöü-]+/g,'')}.${meta.type==='pdf'?'pdf':'jpg'}`}
function receiptField(){return`<div class="rc" id="rcBox"></div><input type="file" id="rcFile" accept="image/*,application/pdf" hidden>`}
function wireReceipt(e){
 let state=e.receipt?{meta:e.receipt,data:null,changed:false}:{meta:null,data:null,changed:false};
 const box=$('#rcBox');
 const draw=async()=>{const m=state.meta;
  if(!m){box.innerHTML=`<span class="rt">Kein Beleg angehängt<small>Foto oder PDF der Quittung</small></span><button type="button" class="btn secondary" id="rcAdd">Beleg anhängen</button>`;$('#rcAdd').onclick=()=>$('#rcFile').click();return}
  if(!state.data&&e.id)state.data=await kvGet('rc:'+e.id);
  const th=m.type==='pdf'?'PDF':'';box.innerHTML=`<button type="button" class="th" id="rcView" aria-label="Beleg ansehen"${m.type!=='pdf'&&state.data?` style="background-image:url('${state.data}')"`:''}>${th}</button><span class="rt">Beleg angehängt<small>${m.type==='pdf'?'PDF':'Foto'}, ${kb(m.size||0)}</small></span><button type="button" class="btn danger" id="rcDel">Entfernen</button>`;
  $('#rcView').onclick=()=>state.data?viewReceipt(state.data,m,rcName({...e,date:$('#f').date.value,vehicleId:$('#f').vehicleId.value},m)):toast('Beleg nicht gefunden.');
  $('#rcDel').onclick=()=>{state={meta:null,data:null,changed:true};draw()}};
 $('#rcFile').onchange=async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;
  try{let data,type;
   if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>8*1048576)return toast('PDF ist zu groß (max. 8 MB).');data=await fileToDataURL(file);type='pdf'}
   else{data=await shrinkImage(file,1800,.78);type='image'}
   const size=Math.round((data.length-data.indexOf(',')-1)*3/4);state={meta:{type,size,added:new Date().toISOString()},data,changed:true};draw()}
  catch(err){toast('Beleg konnte nicht gelesen werden.')}};
 draw();
 return{commit(o){if(!state.changed){if(e.receipt)o.receipt=e.receipt;return}
  if(state.meta){o.receipt=state.meta;kvSet('rc:'+o.id,state.data).then(ok=>{if(!ok)toast('Beleg konnte nicht gespeichert werden.')})}
  else{delete o.receipt;kvSet('rc:'+o.id,null)}}}}
function viewReceipt(data,meta,name){
 const el=document.createElement('div');el.className='viewer';el.setAttribute('role','dialog');el.setAttribute('aria-label','Beleg');
 let url=null;let body;
 if(meta.type==='pdf'){url=URL.createObjectURL(dataToFile(data,name));body=`<iframe src="${url}" title="Beleg"></iframe>`}else body=`<img src="${data}" alt="Beleg">`;
 el.innerHTML=`<div class="vb"><button type="button" class="btn" id="vShare">Teilen / Sichern</button><button type="button" class="btn" id="vClose">Schließen</button></div><div class="vc">${body}</div>`;
 document.body.appendChild(el);
 const close=()=>{el.remove();if(url)URL.revokeObjectURL(url);document.removeEventListener('keydown',esc_,true)};const esc_=ev=>{if(ev.key==='Escape'){ev.stopPropagation();close()}};
 document.addEventListener('keydown',esc_,true);el.querySelector('#vClose').onclick=close;
 el.querySelector('#vShare').onclick=async()=>{const file=dataToFile(data,name);
  try{if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
   else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}
  catch(err){if(err&&err.name!=='AbortError')toast('Teilen nicht möglich: '+err.message)}}}

/* ---------- Beleg-Erkennung ---------- */
const BRANDS=['Aral','Shell','Esso','JET','TotalEnergies','OMV','BP','Avia','Agip','Eni','Q1','Westfalen','HEM','Orlen','Raiffeisen','Turmöl','Avanti','Genol','Socar','Migrol','Tamoil','Tesla','Ionity','EnBW','Fastned','Allego','Smatrics','Wien Energie','Lidl','Kaufland','Aldi','Hofer','Globus','Mr. Wash','Waschpark','Petrol','MOL','Benzina','Coop','Migros','Eurotank','Diskont'];
function parseReceipt(raw,costOnly){
 const r={found:[]};const t=String(raw||'').replace(/\r/g,'').replace(/[ \t]+/g,' ');const lines=t.split('\n').map(s=>s.trim()).filter(Boolean);const L=t.toLowerCase();
 if(!t.trim())return r;
 let m=t.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2}|\d{2})\b/);
 if(m){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo>=1&&mo<=12&&d>=1&&d<=31){r.date=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;r.found.push('Datum')}}
 if(!costOnly){
  if((m=t.match(/(\d{1,3}(?:[.,]\d{1,3})?)\s*kwh\b/i))){r.amount=pn(m[1]);r.unit='kWh'}
  else if((m=t.match(/(\d{1,3}[.,]\d{1,3})\s*(?:l|lt|ltr|liter)\b/i))){r.amount=pn(m[1]);r.unit='L'}
  else if((m=t.match(/(\d{1,3}[.,]\d{1,3})\s*kg\b/i))){r.amount=pn(m[1]);r.unit='kg'}
  if(r.amount!=null)r.found.push('Menge');
  m=t.match(/(\d[.,]\d{2,3})\s*(?:€|eur)?\s*\/\s*(?:l|lt|ltr|liter|kwh|kg)\b/i)||t.match(/(?:l|ltr|liter|kwh|kg)\s*[x×*]\s*(?:€|eur)?\s*(\d[.,]\d{2,3})/i)||t.match(/[x×*]\s*(\d[.,]\d{3})\b/);
  if(m){r.unitPrice=pn(m[1]);r.found.push('Preis')}
  if(r.unit==='kWh'||/ladevorgang|ladesäule|ladepunkt|kwh/.test(L))r.fuel=/\bdc\b|hpc|schnell|ionity|tesla|fastned|ccs/.test(L)?'dc':'ac';
  else if(/hvo/.test(L))r.fuel='hvo';
  else if(/diesel/.test(L))r.fuel='diesel';
  else if(/autogas|\blpg\b/.test(L))r.fuel='lpg';
  else if(/\bcng\b|erdgas/.test(L))r.fuel='cng';
  else if(/wasserstoff|\bh2\b/.test(L))r.fuel='h2';
  else if(/super ?plus|v-?power|ultimate|excellium|maxxmotion|\b98\b|\b100 ?oktan|\b102\b/.test(L))r.fuel='sp';
  else if(/\be ?10\b/.test(L))r.fuel='e10';
  else if(/super|bleifrei|\be ?5\b|\b95\b|normalbenzin/.test(L))r.fuel='e5';
  if(r.fuel)r.found.push('Energie')}
 // Betrag
 const AM=/(\d{1,4}[.,]\d{2})(?!\d)/g;const all=[...t.matchAll(AM)].map(x=>pn(x[1])).filter(x=>x!=null&&x>0);
 let tot=null;
 if(r.amount&&r.unitPrice){const exp=r.amount*r.unitPrice;const c=all.filter(x=>Math.abs(x-exp)<=Math.max(.05,exp*.01)).sort((a,b)=>Math.abs(a-exp)-Math.abs(b-exp));if(c.length)tot=c[0]}
 const bad=/netto|mwst|ust|steuer|rückgeld|gegeben|wechselgeld/i;
 if(tot==null)for(const re of[/summe|gesamt|total|zu zahlen/i,/betrag|bar\b|ec|girocard|karte|visa|mastercard|maestro/i]){for(const ln of lines){if(re.test(ln)&&!bad.test(ln)){const a=[...ln.matchAll(AM)];if(a.length){tot=pn(a[a.length-1][1]);break}}}if(tot!=null)break}
 if(tot==null&&all.length)tot=Math.max(...all.filter(x=>x<5000));
 if(tot!=null&&isFinite(tot)){r.total=tot;r.found.push('Betrag')}
 // Anbieter, Land, Ort
 for(const b of BRANDS){if(new RegExp('(^|[^a-zäöü])'+b.replace(/[.]/g,'\\.')+'($|[^a-zäöü])','i').test(t)){r.station=b;r.found.push('Anbieter');break}}
 if(/\batu ?\d{8}\b|österreich|austria|\ba-\d{4}\b/i.test(t))r.country='AT';
 else if(/\bche[- ]?\d{3}\.?\d{3}|schweiz|suisse|svizzera|\bch-\d{4}\b/i.test(t))r.country='CH';
 else if(/\bde ?\d{9}\b|deutschland|germany|\bd-\d{5}\b/i.test(t))r.country='DE';
 else if(/\bcz ?\d{8,10}\b|česk/i.test(t))r.country='CZ';
 else if(/\bit ?\d{11}\b|italia/i.test(t))r.country='IT';
 for(let i=0;i<lines.length;i++){const pm=lines[i].match(/^(?:[A-Z]{1,2}[- ])?(\d{4,5}) ([A-ZÄÖÜ][A-Za-zÄÖÜäöüß .\-\/]{2,40})$/);if(!pm)continue;
  r.zip=pm[1];r.place=pm[2].trim();if(!r.country)r.country=pm[1].length===5?'DE':'AT';
  const prev=i>0?lines[i-1]:'';if(/[A-Za-zÄÖÜäöüß]{3}/.test(prev)&&(/\d{1,4}\s?[a-z]?$/i.test(prev)||/(straße|strasse|str\.|gasse|weg|platz|allee)/i.test(prev))&&!/\d[.,]\d{2}/.test(prev))r.street=prev;
  r.found.push('Adresse');break}
 if(r.country)r.found.push('Land');
 return r}

async function exportJSON(){
 S.meta.lastExport=new Date().toISOString();
 const receipts={};for(const e of S.entries){if(!e.receipt)continue;const d=await kvGet('rc:'+e.id);if(d)receipts[e.id]=d}
 const name=`zapfwerk-backup-${todayISO()}.json`;const data=JSON.stringify({...S,receipts,exported:S.meta.lastExport},null,1);
 const file=new File([data],name,{type:'application/json'});
 try{if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  await save();render();toast('Sicherung exportiert')}catch(e){if(e&&e.name!=='AbortError')toast('Export nicht möglich: '+e.message)}}
$('#bgFile').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;
 try{await setBg(await shrinkImage(file))}catch(e){toast(e.message)}});

/* ---------- CSV-Import ---------- */
const CSV_HEAD=['Typ','Datum','Fahrzeug','Energie oder Art','Menge','Preis je Einheit','Betrag','Vollgetankt','Kilometerstand','Tageskilometer','Land','Tankstelle oder Anbieter','Ort','Straße','PLZ','Notiz'];
const CSV_KEYS=['typ','date','vehicle','kind','amount','unitPrice','total','full','odometer','tripKm','country','station','place','street','zip','note'];
const normH=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
const HMAP={typ:'typ',eintrag:'typ',art:'kind',datum:'date',date:'date',fahrzeug:'vehicle',kennzeichen:'vehicle',auto:'vehicle',energieoderart:'kind',energie:'kind',kraftstoff:'kind',sorte:'kind',kategorie:'kind',menge:'amount',liter:'amount',kwh:'amount',preisjeeinheit:'unitPrice',preis:'unitPrice',literpreis:'unitPrice',betrag:'total',summe:'total',kosten:'total',gesamt:'total',vollgetankt:'full',voll:'full',kilometerstand:'odometer',kmstand:'odometer',tachostand:'odometer',tageskilometer:'tripKm',gefahrenekm:'tripKm',strecke:'tripKm',land:'country',tankstelleoderanbieter:'station',tankstelle:'station',anbieter:'station',ort:'place',strasse:'street',plz:'zip',notiz:'note',bemerkung:'note'};
function csvRows(text){text=text.replace(/^﻿/,'');const head=text.split(/\r?\n/).slice(0,6);
 const sep=[';','\t',','].map(c=>[c,Math.max(...head.map(l=>l.split(c).length))]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
  else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==''))}
function csvNum(v,int){if(v==null)return null;let s=String(v).trim().replace(/\s|€|eur|km|l$|kwh$/gi,'');if(!s)return null;
 if(int&&/^\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,'');return pn(s)}
function csvDate(v){const s=String(v||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
 m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo<1||mo>12||d<1||d>31)return null;return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}return null}
function csvFuel(t){const L=normH(t);if(!L)return null;
 if(/stromdc|dc|schnell|hpc|ccs/.test(L))return'dc';if(/strom|ac|wallbox|laden|kwh/.test(L))return'ac';
 if(/hvo/.test(L))return'hvo';if(/diesel/.test(L))return'diesel';if(/lpg|autogas/.test(L))return'lpg';if(/cng|erdgas/.test(L))return'cng';if(/wasserstoff|h2/.test(L))return'h2';
 if(/plus|premium|98|100|vpower|ultimate|excellium/.test(L))return'sp';if(/e10/.test(L))return'e10';if(/super|e5|95|benzin|bleifrei/.test(L))return'e5';return null}
function csvCat(t){const L=normH(t);if(!L)return null;
 for(const [k,l] of CATS)if(L===normH(k)||L===normH(l))return k;
 const R=[[/wasch(strasse|anlage|park)|autowasche|wasche/,'waschstrasse'],[/scheiben|waschwasser|frostschutz/,'waschwasser'],[/polier|pflege|wachs|reinig|saug/,'pflege'],[/^ol|motorol|olwechsel|adblue|kuhlmittel|betriebsmittel|bremsflussig/,'betriebsmittel'],[/duft|zubehor/,'zubehoer'],[/park/,'parken'],[/maut|vignette|tunnel|brenner/,'maut'],[/werkstatt|service|inspektion|reparatur|tuv|^hu$|^au$|hauptuntersuchung|pickerl/,'werkstatt'],[/reifen|rader/,'reifen']];
 for(const [re,k] of R)if(re.test(L))return k;return null}
function csvCountry(t){const s=String(t||'').trim();if(!s)return null;const u=s.toUpperCase();if(CNAME[u])return u;
 const n=normH(s);for(const [c,name] of COUNTRIES)if(normH(name)===n)return c;
 const alt={a:'AT',d:'DE',ch:'CH',austria:'AT',germany:'DE',osterreich:'AT',oesterreich:'AT',schweiz:'CH',italia:'IT'};return alt[n]||'XX'}
function csvVehicle(t){const n=normH(t);if(!n)return null;
 return S.vehicles.find(v=>normH(v.plate)===n)||S.vehicles.find(v=>normH(v.alias)===n)||S.vehicles.find(v=>normH(v.name)===n)||null}
function parseCSV(text){
 const rows=csvRows(text);if(!rows.length)throw new Error('Die Datei ist leer.');
 let hr=-1,idx={};
 for(let r=0;r<Math.min(rows.length,10)&&hr<0;r++){const m={};rows[r].forEach((h,i)=>{const k=HMAP[normH(h)];if(k&&m[k]==null)m[k]=i});if(m.date!=null&&m.vehicle!=null){hr=r;idx=m}}
 if(hr<0)throw new Error('Spalten „Datum“ und „Fahrzeug“ fehlen – bitte die Vorlage verwenden.');
 const ok=[],errs=[],dup=[];const seen=new Set(S.entries.map(e=>[e.vehicleId,e.date,e.type,rnd(total(e),2)].join('|')));
 let ex=0;rows.slice(hr+1).forEach((r,i)=>{const line=i+hr+2;const g=k=>idx[k]==null?'':String(r[idx[k]]??'').trim();
  if(/beispielzeile/i.test(g('note'))){ex++;return}
  const date=csvDate(g('date'));if(!date)return errs.push(`Zeile ${line}: Datum „${g('date')}“ nicht lesbar`);
  const v=csvVehicle(g('vehicle'));if(!v)return errs.push(`Zeile ${line}: Fahrzeug „${g('vehicle')}“ nicht gefunden`);
  const kind=g('kind'),tt=normH(g('typ'));const fuel=csvFuel(kind),cat=csvCat(kind);
  const amount=csvNum(g('amount')),unitPrice=csvNum(g('unitPrice')),tot=csvNum(g('total'));
  let type=/kost|ausgab|sonst/.test(tt)?'cost':/tank|lad|fuel/.test(tt)?'fuel':fuel?'fuel':cat?'cost':amount!=null?'fuel':null;
  if(!type)return errs.push(`Zeile ${line}: Typ unklar (Tanken oder Kosten?)`);
  const country=csvCountry(g('country'))||'DE';const base={id:uid(),created:Date.now()+i,vehicleId:v.id,date,country,station:g('station'),place:g('place'),street:g('street'),zip:g('zip'),note:g('note'),src:'csv'};
  let e;
  if(type==='fuel'){const fu=fuel||v.fuel||'e5';let a=amount,p=unitPrice,t=tot;
   if(a!=null&&p!=null&&t==null)t=rnd(a*p,2);else if(a&&t!=null&&p==null)p=rnd(t/a,3);else if(p&&t!=null&&a==null)a=rnd(t/p,2);
   if(a==null&&t==null)return errs.push(`Zeile ${line}: Menge oder Betrag fehlt`);
   const fv=normH(g('full'));e={...base,type:'fuel',fuel:fu,amount:a,unitPrice:p,total:t,full:!/^(nein|n|no|0|false|teil|teilbetankung)$/.test(fv),odometer:csvNum(g('odometer'),true),tripKm:csvNum(g('tripKm'),true)}}
  else{if(tot==null)return errs.push(`Zeile ${line}: Betrag fehlt`);e={...base,type:'cost',category:cat||'sonstiges',total:tot};if(!cat&&kind)e.note=[kind,e.note].filter(Boolean).join(' – ')}
  const key=[e.vehicleId,e.date,e.type,rnd(total(e),2)].join('|');if(seen.has(key))return dup.push(line);seen.add(key);ok.push(e)});
 return{ok,errs,dup,ex}}
function csvReport(res){const fuel=res.ok.filter(e=>e.type==='fuel').length,cost=res.ok.length-fuel;
 const by={};res.ok.forEach(e=>{by[e.vehicleId]=(by[e.vehicleId]||0)+1});
 const sorted=res.ok.map(e=>e.date).sort();
 let h=`<h2>CSV-Import prüfen</h2>`;
 h+=res.ok.length?`<p>Bereit zum Hinzufügen: <strong>${fuel} Tankstopp${fuel===1?'':'s'}</strong> und <strong>${cost} sonstige Kosten</strong>${sorted.length?` vom ${fDate(sorted[0])} bis ${fDate(sorted[sorted.length-1])}`:''}.</p><ul class="hint">${Object.entries(by).map(([id,n])=>`<li>${esc(vText(veh(id)))}: ${n}</li>`).join('')}</ul>`:'<p>Es wurden keine importierbaren Zeilen gefunden.</p>';
 if(res.ex)h+=`<p class="hint">${res.ex} Beispielzeile${res.ex===1?'':'n'} aus der Vorlage ignoriert.</p>`;
 if(res.dup.length)h+=`<p class="hint">${res.dup.length} Zeile${res.dup.length===1?'':'n'} übersprungen, weil sie schon vorhanden ${res.dup.length===1?'ist':'sind'} (Zeile ${res.dup.slice(0,10).join(', ')}${res.dup.length>10?' …':''}).</p>`;
 if(res.errs.length)h+=`<p class="hint" style="color:var(--up)"><strong>${res.errs.length} Zeile${res.errs.length===1?'':'n'} nicht lesbar:</strong></p><ul class="hint">${res.errs.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}${res.errs.length>12?`<li>… und ${res.errs.length-12} weitere</li>`:''}</ul>`;
 h+=`<div class="actions"><span class="sp"></span><button type="button" class="btn secondary" data-close>Abbrechen</button>${res.ok.length?'<button type="button" class="btn primary" id="csvGo">Hinzufügen</button>':''}</div>`;
 openSheet(h);
 if(res.ok.length)$('#csvGo').onclick=async()=>{S.entries.push(...res.ok);await save();closeSheet();ui.vf='all';go('verlauf');toast(`${res.ok.length} Einträge hinzugefügt`)}}
$('#csvFile').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;
 if(!S.vehicles.length)return toast('Bitte zuerst die Fahrzeuge anlegen.');
 try{const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('�'))text=new TextDecoder('windows-1252').decode(buf);csvReport(parseCSV(text))}
 catch(e){toast('Import nicht möglich: '+e.message)}});
async function downloadTemplate(){
 const v=S.vehicles.find(x=>!x.archived)||{plate:'RO-AB 123'};const pl=v.plate||v.name;
 const ex=[['Tanken','02.08.2026',pl,'Super E5','41,20','1,749','72,06','ja','84210','','DE','Aral','Rosenheim','Münchener Str. 40','83022','Beispielzeile – bitte löschen'],
  ['Tanken','24.08.2026',pl,'Super E5','44,80','1,689','75,67','ja','','640','AT','OMV','Kufstein','','6330','Beispielzeile – bitte löschen'],
  ['Kosten','25.08.2026',pl,'Waschstraße','','','14,00','','','','DE','Mr. Wash','Rosenheim','','','Beispielzeile – bitte löschen']];
 const q=x=>/[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;
 const csv='﻿'+[CSV_HEAD,...ex].map(r=>r.map(q).join(';')).join('\r\n')+'\r\n';
 const file=new File([csv],'zapfwerk-vorlage.csv',{type:'text/csv'});
 try{if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:file.name});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}
 catch(e){if(e&&e.name!=='AbortError')toast('Download nicht möglich: '+e.message)}}

$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;
 try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.entries)||!Array.isArray(d.vehicles))throw new Error('Keine Zapfwerk-Sicherung');
  if(!confirm(`Sicherung mit ${d.vehicles.length} Fahrzeug(en) und ${d.entries.length} Einträgen importieren? Alle Daten auf diesem Gerät werden ersetzt.`))return;
  const rcs=d.receipts&&typeof d.receipts==='object'?d.receipts:{};S=normalize(d);delete S.exported;delete S.receipts;
  for(const k of await kvKeys('rc:'))await kvSet(k,null);
  for(const [id,data] of Object.entries(rcs))if(typeof data==='string'&&data.startsWith('data:'))await kvSet('rc:'+id,data);
  S.entries.forEach(e=>{if(e.receipt&&!rcs[e.id])delete e.receipt});
  await save();ui.vf='all';render();toast('Sicherung importiert')}catch(e){toast('Import fehlgeschlagen: '+e.message)}});

/* ---------- Start ---------- */
function go(tab){closeSheet();ui.tab=tab;render()}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#vf').onchange=e=>{ui.vf=e.target.value;render()};
$('#fab').onclick=chooseNew;
(async()=>{const d=await load();if(d)S=normalize(d);BG=await kvGet('bg');applyBg();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render()})();
</script>
